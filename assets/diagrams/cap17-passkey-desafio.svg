<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Passkey · demostrar sin compartir un secreto</title>
  <desc id="desc">El servidor envía un desafío único; el autenticador autoriza el uso de la clave privada vinculada al sitio, firma el desafío y el servidor verifica la firma con la clave pública registrada.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">Passkey · demostrar sin compartir un secreto</text>
  <text x="48" y="91" class="sans subtitle">La clave privada permanece bajo control del autenticador</text><rect id="pk-user" x="65" y="245" width="210" height="145" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="pk-user" data-padding="18" x="170" y="287" class="sans node-title"><tspan x="170" y="287">Persona</tspan><tspan x="170" dy="32" class="node-copy">desbloquea el uso</tspan><tspan x="170" dy="24" class="node-copy">con PIN o biometría</tspan></text><rect id="pk-auth" x="365" y="215" width="300" height="205" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="pk-auth" data-padding="18" x="515" y="257" class="sans node-title"><tspan x="515" y="257">Autenticador</tspan><tspan x="515" dy="32" class="node-copy">conserva la clave privada</tspan><tspan x="515" dy="24" class="node-copy">vinculada al sitio</tspan></text><rect id="pk-server" x="780" y="215" width="350" height="205" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="pk-server" data-padding="18" x="955" y="257" class="sans node-title"><tspan x="955" y="257">Servidor</tspan><tspan x="955" dy="32" class="node-copy">guarda la clave pública</tspan><tspan x="955" dy="24" class="node-copy">y emite un desafío único</tspan></text><path class="flow" d="M275 315H361"/><rect id="pk-label-unlock" x="278" y="266" width="80" height="34" rx="8" fill="#FFFDFA"/><text data-container="pk-label-unlock" data-padding="6" x="318" y="289" class="sans label">autoriza</text><path class="flow" d="M955 215V150H515V211"/><rect id="pk-label-challenge" x="665" y="133" width="152" height="34" rx="8" fill="#FFFDFA"/><text data-container="pk-label-challenge" data-padding="6" x="741" y="156" class="sans label">1 · desafío</text><path class="flow" d="M515 420V510H955V424"/><rect id="pk-label-sign" x="660" y="493" width="165" height="34" rx="8" fill="#FFFDFA"/><text data-container="pk-label-sign" data-padding="6" x="742.5" y="516" class="sans label">2 · firma y datos</text><rect id="pk-result" x="275" y="545" width="650" height="105" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2"/><text data-container="pk-result" data-padding="18" x="600" y="578" class="sans node-copy"><tspan x="600">El servidor verifica origen, RP ID, desafío, flags y firma.</tspan><tspan x="600" dy="25">Registro, recuperación y pérdida de dispositivos</tspan><tspan x="600" dy="25">siguen siendo decisiones del producto.</tspan></text>
</svg>
