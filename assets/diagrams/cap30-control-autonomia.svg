<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Superficie de control de un agente</title><desc id="desc">El control efectivo combina un alcance explícito, contexto limitado, permisos mínimos, aprobaciones para efectos sensibles y evidencia que permita detener o revertir.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.title{font-size:30px;font-weight:760}.head{font-size:20px;font-weight:760;text-anchor:middle}.copy{font-size:18px;fill:#59636D;text-anchor:middle}.num{font-size:17px;font-weight:780;text-anchor:middle}.foot{font-size:20px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker></defs><rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">LA AUTONOMÍA SE DISEÑA POR CAPAS</text><text x="72" y="146" class="s title">Superficie de control de un agente</text><rect id="cap30-control-autonomia-card-1" x="72.0" y="210" width="193.6" height="270" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="168.8" cy="254" r="22" fill="#31536A"/><text x="168.8" y="261" class="s num" fill="#fff" data-container="cap30-control-autonomia-card-1" data-padding="20">1</text><text class="s head" data-container="cap30-control-autonomia-card-1" data-padding="20"><tspan x="168.8" y="316.0">Alcance</tspan></text><text class="s copy" data-container="cap30-control-autonomia-card-1" data-padding="20"><tspan x="168.8" y="370.0">objetivo y</tspan><tspan x="168.8" y="394.0">exclusiones</tspan></text><rect id="cap30-control-autonomia-card-2" x="287.6" y="210" width="193.6" height="270" rx="22" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><circle cx="384.4" cy="254" r="22" fill="#A9A49B"/><text x="384.4" y="261" class="s num" fill="#fff" data-container="cap30-control-autonomia-card-2" data-padding="20">2</text><text class="s head" data-container="cap30-control-autonomia-card-2" data-padding="20"><tspan x="384.4" y="316.0">Contexto</tspan></text><text class="s copy" data-container="cap30-control-autonomia-card-2" data-padding="20"><tspan x="384.4" y="370.0">mínimo</tspan><tspan x="384.4" y="394.0">suficiente</tspan></text><rect id="cap30-control-autonomia-card-3" x="503.2" y="210" width="193.6" height="270" rx="22" fill="#F5ECD8" stroke="#C59132" stroke-width="3"/><circle cx="600.0" cy="254" r="22" fill="#C59132"/><text x="600.0" y="261" class="s num" fill="#fff" data-container="cap30-control-autonomia-card-3" data-padding="20">3</text><text class="s head" data-container="cap30-control-autonomia-card-3" data-padding="20"><tspan x="600.0" y="316.0">Permisos</tspan></text><text class="s copy" data-container="cap30-control-autonomia-card-3" data-padding="20"><tspan x="600.0" y="370.0">leer · actuar</tspan><tspan x="600.0" y="394.0">· denegar</tspan></text><rect id="cap30-control-autonomia-card-4" x="718.8" y="210" width="193.6" height="270" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="815.6" cy="254" r="22" fill="#31536A"/><text x="815.6" y="261" class="s num" fill="#fff" data-container="cap30-control-autonomia-card-4" data-padding="20">4</text><text class="s head" data-container="cap30-control-autonomia-card-4" data-padding="20"><tspan x="815.6" y="316.0">Aprobaciones</tspan></text><text class="s copy" data-container="cap30-control-autonomia-card-4" data-padding="20"><tspan x="815.6" y="370.0">efectos</tspan><tspan x="815.6" y="394.0">sensibles</tspan></text><rect id="cap30-control-autonomia-card-5" x="934.4" y="210" width="193.6" height="270" rx="22" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><circle cx="1031.2" cy="254" r="22" fill="#B95736"/><text x="1031.2" y="261" class="s num" fill="#fff" data-container="cap30-control-autonomia-card-5" data-padding="20">5</text><text class="s head" data-container="cap30-control-autonomia-card-5" data-padding="20"><tspan x="1031.2" y="302.0">Evidencia y</tspan><tspan x="1031.2" y="330.0">parada</tspan></text><text class="s copy" data-container="cap30-control-autonomia-card-5" data-padding="20"><tspan x="1031.2" y="370.0">logs · pruebas</tspan><tspan x="1031.2" y="394.0">· límites</tspan></text><path d="M265.6 345H279.6" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><path d="M481.2 345H495.2" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><path d="M696.8 345H710.8" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><path d="M912.4 345H926.4" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap30-control-autonomia-footer" x="126" y="548" width="948" height="90" rx="18" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text class="s foot" data-container="cap30-control-autonomia-footer" data-padding="20"><tspan x="600.0" y="585.5">Más autonomía solo es razonable cuando el trabajo es acotado, observable y</tspan><tspan x="600.0" y="610.5">recuperable.</tspan></text></svg>