<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1580" role="img" aria-labelledby="title desc"><title id="title">Ruta de aprendizaje del desarrollo web en composición vertical</title><desc id="desc">La ruta avanza desde la plataforma web hasta datos, operación y distribución; luego compara stacks y usa IA con un diario de calibración.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:16px;font-weight:760;letter-spacing:1.15px;fill:#31536A}.head{font-size:21px;font-weight:760}.copy{font-size:17px;fill:#59636D;text-anchor:middle}.num{font-size:15px;font-weight:780;text-anchor:middle}.foot{font-size:16px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#31536A"/></marker></defs><rect width="420" height="1580" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1548" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">APRENDER ES CERRAR RECORRIDOS</text><rect id="apc-ruta-aprendizaje-mobile-card-1" x="38" y="108" width="344" height="176" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="146" r="20" fill="#31536A"/><text x="72" y="152" class="s num" fill="#fff" data-container="apc-ruta-aprendizaje-mobile-card-1" data-padding="20">1</text><text x="108" y="152" class="s head" data-container="apc-ruta-aprendizaje-mobile-card-1" data-padding="20">Plataforma web</text><text class="s copy" data-container="apc-ruta-aprendizaje-mobile-card-1" data-padding="20"><tspan x="210.0" y="216.0">HTML · CSS · JS · red</tspan></text><path d="M210 284V322" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="apc-ruta-aprendizaje-mobile-card-2" x="38" y="330" width="344" height="176" rx="20" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><circle cx="72" cy="368" r="20" fill="#A9A49B"/><text x="72" y="374" class="s num" fill="#fff" data-container="apc-ruta-aprendizaje-mobile-card-2" data-padding="20">2</text><text x="108" y="374" class="s head" data-container="apc-ruta-aprendizaje-mobile-card-2" data-padding="20">Aplicación con datos</text><text class="s copy" data-container="apc-ruta-aprendizaje-mobile-card-2" data-padding="20"><tspan x="210.0" y="427.0">contrato · auth ·</tspan><tspan x="210.0" y="449.0">transacción</tspan></text><path d="M210 506V544" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="apc-ruta-aprendizaje-mobile-card-3" x="38" y="552" width="344" height="176" rx="20" fill="#F5ECD8" stroke="#C59132" stroke-width="3"/><circle cx="72" cy="590" r="20" fill="#C59132"/><text x="72" y="596" class="s num" fill="#fff" data-container="apc-ruta-aprendizaje-mobile-card-3" data-padding="20">3</text><text x="108" y="596" class="s head" data-container="apc-ruta-aprendizaje-mobile-card-3" data-padding="20">Calidad y operación</text><text class="s copy" data-container="apc-ruta-aprendizaje-mobile-card-3" data-padding="20"><tspan x="210.0" y="660.0">tests · entrega · señales</tspan></text><path d="M210 728V766" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="apc-ruta-aprendizaje-mobile-card-4" x="38" y="774" width="344" height="176" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="812" r="20" fill="#31536A"/><text x="72" y="818" class="s num" fill="#fff" data-container="apc-ruta-aprendizaje-mobile-card-4" data-padding="20">4</text><text x="108" y="818" class="s head" data-container="apc-ruta-aprendizaje-mobile-card-4" data-padding="20">Sistemas distribuidos</text><text class="s copy" data-container="apc-ruta-aprendizaje-mobile-card-4" data-padding="20"><tspan x="210.0" y="871.0">fallos · colas ·</tspan><tspan x="210.0" y="893.0">consistencia</tspan></text><path d="M210 950V988" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="apc-ruta-aprendizaje-mobile-card-5" x="38" y="996" width="344" height="176" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><circle cx="72" cy="1034" r="20" fill="#B95736"/><text x="72" y="1040" class="s num" fill="#fff" data-container="apc-ruta-aprendizaje-mobile-card-5" data-padding="20">5</text><text x="108" y="1040" class="s head" data-container="apc-ruta-aprendizaje-mobile-card-5" data-padding="20">Comparar stacks</text><text class="s copy" data-container="apc-ruta-aprendizaje-mobile-card-5" data-padding="20"><tspan x="210.0" y="1104.0">mismo slice · trade-offs</tspan></text><path d="M210 1172V1210" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="apc-ruta-aprendizaje-mobile-card-6" x="38" y="1218" width="344" height="176" rx="20" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><circle cx="72" cy="1256" r="20" fill="#A9A49B"/><text x="72" y="1262" class="s num" fill="#fff" data-container="apc-ruta-aprendizaje-mobile-card-6" data-padding="20">6</text><text x="108" y="1262" class="s head" data-container="apc-ruta-aprendizaje-mobile-card-6" data-padding="20">IA asistida</text><text class="s copy" data-container="apc-ruta-aprendizaje-mobile-card-6" data-padding="20"><tspan x="210.0" y="1315.0">delegar · verificar ·</tspan><tspan x="210.0" y="1337.0">calibrar</tspan></text><text class="s foot"><tspan x="210.0" y="1414.0">Cada etapa produce un proyecto y</tspan><tspan x="210.0" y="1438.0">una explicación; acumular</tspan><tspan x="210.0" y="1462.0">recursos no sustituye la</tspan><tspan x="210.0" y="1486.0">práctica.</tspan></text></svg>