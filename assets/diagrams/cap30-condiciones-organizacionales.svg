<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">La organización prepara el terreno</title>
  <desc id="desc">Documentación y contexto, estructura y convenciones, herramientas y procesos, y cultura y prácticas se refuerzan para producir cambios pequeños, revisables y coherentes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">La organización prepara el terreno</text>
  <text x="48" y="91" class="sans subtitle">La efectividad del agente también es una propiedad del sistema de trabajo</text><rect id="org-card-0" x="80" y="155" width="455" height="190" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="org-card-0" data-padding="18" x="307.5" y="197" class="sans node-title"><tspan x="307.5" y="197">Contexto</tspan><tspan x="307.5" dy="32" class="node-copy">arquitectura · ADR</tspan><tspan x="307.5" dy="24" class="node-copy">instrucciones vigentes</tspan></text><rect id="org-card-1" x="665" y="155" width="455" height="190" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="org-card-1" data-padding="18" x="892.5" y="197" class="sans node-title"><tspan x="892.5" y="197">Convenciones</tspan><tspan x="892.5" dy="32" class="node-copy">nombres · módulos</tspan><tspan x="892.5" dy="24" class="node-copy">contratos predecibles</tspan></text><rect id="org-card-2" x="80" y="430" width="455" height="190" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="org-card-2" data-padding="18" x="307.5" y="472" class="sans node-title"><tspan x="307.5" y="472">Guardrails</tspan><tspan x="307.5" dy="32" class="node-copy">CI · tests · linters</tspan><tspan x="307.5" dy="24" class="node-copy">permisos y aprobaciones</tspan></text><rect id="org-card-3" x="665" y="430" width="455" height="190" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="org-card-3" data-padding="18" x="892.5" y="472" class="sans node-title"><tspan x="892.5" y="472">Prácticas</tspan><tspan x="892.5" dy="32" class="node-copy">delegación consciente</tspan><tspan x="892.5" dy="24" class="node-copy">revisión y aprendizaje</tspan></text><rect id="org-outcome" x="430" y="330" width="340" height="125" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="org-outcome" data-padding="18" x="600" y="372" class="sans node-title"><tspan x="600" y="372">Cambio revisable</tspan><tspan x="600" dy="32" class="node-copy">alcance · evidencia</tspan><tspan x="600" dy="24" class="node-copy">responsable</tspan></text><path class="flow" d="M535 250H600V326"/><path class="flow" d="M665 250H600V326"/><path class="flow" d="M535 525H600V459"/><path class="flow" d="M665 525H600V459"/>
</svg>
