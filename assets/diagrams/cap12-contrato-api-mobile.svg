<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1112" role="img" aria-labelledby="title desc"><title id="title">Contrato de una API en composición vertical</title><desc id="desc">Consumidor y proveedor acuerdan solicitud, respuesta, errores, seguridad y evolución antes de acoplar implementaciones.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:16px;font-weight:760;letter-spacing:1.15px;fill:#31536A}.head{font-size:21px;font-weight:760}.copy{font-size:17px;fill:#59636D;text-anchor:middle}.num{font-size:15px;font-weight:780;text-anchor:middle}.foot{font-size:16px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#31536A"/></marker></defs><rect width="420" height="1112" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1080" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">EL CONTRATO COORDINA DOS LADOS</text><rect id="cap12-contrato-api-mobile-card-1" x="38" y="108" width="344" height="176" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="146" r="20" fill="#31536A"/><text x="72" y="152" class="s num" fill="#fff" data-container="cap12-contrato-api-mobile-card-1" data-padding="20">1</text><text x="108" y="152" class="s head" data-container="cap12-contrato-api-mobile-card-1" data-padding="20">Necesidad</text><text class="s copy" data-container="cap12-contrato-api-mobile-card-1" data-padding="20"><tspan x="210.0" y="216.0">acción del consumidor</tspan></text><path d="M210 284V322" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap12-contrato-api-mobile-card-2" x="38" y="330" width="344" height="176" rx="20" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><circle cx="72" cy="368" r="20" fill="#A9A49B"/><text x="72" y="374" class="s num" fill="#fff" data-container="cap12-contrato-api-mobile-card-2" data-padding="20">2</text><text x="108" y="374" class="s head" data-container="cap12-contrato-api-mobile-card-2" data-padding="20">Solicitud</text><text class="s copy" data-container="cap12-contrato-api-mobile-card-2" data-padding="20"><tspan x="210.0" y="438.0">método · URL · datos</tspan></text><path d="M210 506V544" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap12-contrato-api-mobile-card-3" x="38" y="552" width="344" height="176" rx="20" fill="#F5ECD8" stroke="#C59132" stroke-width="3"/><circle cx="72" cy="590" r="20" fill="#C59132"/><text x="72" y="596" class="s num" fill="#fff" data-container="cap12-contrato-api-mobile-card-3" data-padding="20">3</text><text x="108" y="596" class="s head" data-container="cap12-contrato-api-mobile-card-3" data-padding="20">Contrato</text><text class="s copy" data-container="cap12-contrato-api-mobile-card-3" data-padding="20"><tspan x="210.0" y="649.0">esquema · errores ·</tspan><tspan x="210.0" y="671.0">seguridad</tspan></text><path d="M210 728V766" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap12-contrato-api-mobile-card-4" x="38" y="774" width="344" height="176" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="812" r="20" fill="#31536A"/><text x="72" y="818" class="s num" fill="#fff" data-container="cap12-contrato-api-mobile-card-4" data-padding="20">4</text><text x="108" y="818" class="s head" data-container="cap12-contrato-api-mobile-card-4" data-padding="20">Respuesta</text><text class="s copy" data-container="cap12-contrato-api-mobile-card-4" data-padding="20"><tspan x="210.0" y="871.0">estado · contenido ·</tspan><tspan x="210.0" y="893.0">metadatos</tspan></text><text class="s foot"><tspan x="210.0" y="982.0">API-first permite validar el</tspan><tspan x="210.0" y="1006.0">intercambio antes de terminar la</tspan><tspan x="210.0" y="1030.0">implementación.</tspan></text></svg>