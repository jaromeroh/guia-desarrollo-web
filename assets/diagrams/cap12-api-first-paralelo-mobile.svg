<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1010" role="img" aria-labelledby="title desc">
  <title id="title">API-first · trabajo paralelo con un contrato</title>
  <desc id="desc">Consumidor y proveedor acuerdan un contrato, desarrollan en paralelo contra mocks y pruebas, y se integran verificando el mismo contrato.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="420" height="1010" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="978" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">CONTRATO ANTES QUE IMPLEMENTACIÓN</text><rect id="api-m-contract" x="52" y="92" width="316" height="140" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="api-m-contract" data-padding="18" x="210" y="134" class="sans node-title"><tspan x="210" y="134">Contrato acordado</tspan><tspan x="210" dy="32" class="node-copy">esquema · errores · ejemplos</tspan></text><path class="flow" d="M210 232V280"/><rect id="api-m-front" x="38" y="290" width="160" height="205" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="api-m-front" data-padding="18" x="118" y="332" class="sans node-title"><tspan x="118" y="332">Consumidor</tspan><tspan x="118" dy="32" class="node-copy">mock</tspan><tspan x="118" dy="24" class="node-copy">cliente</tspan></text><rect id="api-m-back" x="222" y="290" width="160" height="205" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="api-m-back" data-padding="18" x="302" y="332" class="sans node-title"><tspan x="302" y="332">Proveedor</tspan><tspan x="302" dy="32" class="node-copy">servicio</tspan><tspan x="302" dy="24" class="node-copy">validación</tspan></text><path class="relation" d="M210 280V270M118 280V290M302 280V290M118 270H302"/><path class="flow" d="M118 495V570H210V618"/><path class="flow" d="M302 495V570H210V618"/><rect id="api-m-integrate" x="52" y="625" width="316" height="145" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="api-m-integrate" data-padding="18" x="210" y="667" class="sans node-title"><tspan x="210" y="667">Integración</tspan><tspan x="210" dy="32" class="node-copy">pruebas de contrato</tspan><tspan x="210" dy="24" class="node-copy">evidencia compartida</tspan></text><rect id="api-m-note" x="52" y="825" width="316" height="105" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2"/><text data-container="api-m-note" data-padding="18" x="210" y="862" class="sans node-title"><tspan x="210">El contrato coordina</tspan><tspan x="210" dy="30" class="node-copy">no sustituye las conversaciones</tspan></text>
</svg>
