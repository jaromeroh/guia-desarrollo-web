<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1120" role="img" aria-labelledby="title desc">
  <title id="title">Cómo elegir entre flujo normal, Flexbox y Grid en composición vertical</title>
  <desc id="desc">El flujo normal conserva el orden de lectura, Flexbox distribuye en un eje y Grid coordina filas y columnas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#31536A"/></marker>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.5px;fill:#31536A}.heading{font-size:24px;font-weight:760;text-anchor:middle}.copy{font-size:17px;fill:#59636D;text-anchor:middle}.signal{font-size:14px;font-weight:760;letter-spacing:1.1px;fill:#31536A;text-anchor:middle}.item{font-size:17px;font-weight:700;text-anchor:middle}.flow{stroke:#31536A;stroke-width:3.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="420" height="1120" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="1088" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">RELACIÓN ANTES QUE HERRAMIENTA</text>
  <rect x="42" y="92" width="336" height="116" rx="18" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/>
  <text x="210" y="138" class="sans heading">¿Qué debes coordinar?</text>
  <text x="210" y="176" class="sans copy">elige según la relación espacial</text>
  <path class="flow" d="M210 210V246"/>

  <rect x="42" y="256" width="336" height="220" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="210" y="296" class="sans signal">ORDEN DE LECTURA</text>
  <text x="210" y="340" class="sans heading">Flujo normal</text>
  <text x="210" y="380" class="sans copy">el contenido avanza en el orden</text>
  <text x="210" y="406" class="sans copy">del documento</text>
  <text x="210" y="448" class="sans item">artículos · formularios</text>
  <path class="flow" d="M210 478V514"/>

  <rect x="42" y="524" width="336" height="220" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="210" y="564" class="sans signal">UN EJE DOMINA</text>
  <text x="210" y="608" class="sans heading">Flexbox</text>
  <text x="210" y="648" class="sans copy">distribuye una fila o columna</text>
  <text x="210" y="674" class="sans copy">y puede envolver elementos</text>
  <text x="210" y="716" class="sans item">barras · grupos · navegación</text>
  <path class="flow" d="M210 746V782"/>

  <rect x="42" y="792" width="336" height="220" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/>
  <text x="210" y="832" class="sans signal">DOS EJES SE COORDINAN</text>
  <text x="210" y="876" class="sans heading">Grid</text>
  <text x="210" y="916" class="sans copy">relaciona filas y columnas</text>
  <text x="210" y="942" class="sans copy">en una cuadrícula</text>
  <text x="210" y="984" class="sans item">regiones · galerías · paneles</text>
  <text x="210" y="1062" class="sans copy">Los modelos pueden combinarse.</text>
</svg>
