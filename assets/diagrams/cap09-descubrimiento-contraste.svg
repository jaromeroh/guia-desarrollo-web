<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Descubrimiento mediante cuatro fuentes de evidencia</title><desc id="desc">Conversar revela lenguaje e intención; observar revela conducta real; revisar evidencia revela frecuencia y excepciones; prototipar revela interpretaciones. La síntesis produce preguntas y criterios.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:26px;font-weight:760;text-anchor:middle}.copy{font-size:19px;fill:#59636D;text-anchor:middle}.lab{font-size:16px;font-weight:760;letter-spacing:1px;text-anchor:middle}.foot{font-size:22px;font-weight:700;text-anchor:middle}</style></defs><rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">NINGUNA FUENTE CUENTA TODA LA HISTORIA</text><g><rect x="72" y="132" width="244" height="206" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="194" y="180" class="s head">Conversar</text><text x="194" y="224" class="s copy">lenguaje · intención</text><text x="194" y="258" class="s copy">dolor percibido</text><text x="194" y="304" class="s lab">LO QUE DICE</text></g><g><rect x="342" y="132" width="244" height="206" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="464" y="180" class="s head">Observar</text><text x="464" y="224" class="s copy">pasos · atajos</text><text x="464" y="258" class="s copy">trabajo invisible</text><text x="464" y="304" class="s lab" fill="#C59132">LO QUE HACE</text></g><g><rect x="612" y="132" width="244" height="206" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="734" y="180" class="s head">Revisar evidencia</text><text x="734" y="224" class="s copy">datos · soporte</text><text x="734" y="258" class="s copy">excepciones · frecuencia</text><text x="734" y="304" class="s lab">LO QUE OCURRE</text></g><g><rect x="882" y="132" width="246" height="206" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="1005" y="180" class="s head">Prototipar</text><text x="1005" y="224" class="s copy">hacer visible</text><text x="1005" y="258" class="s copy">una interpretación</text><text x="1005" y="304" class="s lab">LO QUE ENTENDIMOS</text></g><path d="M194 338V412H600 M464 338V412H600 M734 338V412H600 M1005 338V412H600" fill="none" stroke="#31536A" stroke-width="4"/><rect x="298" y="412" width="604" height="126" rx="22" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="600" y="458" class="s head">Síntesis compartida</text><text x="600" y="498" class="s copy">supuestos · preguntas abiertas · criterios de aceptación</text><text x="600" y="610" class="s foot">Descubrir es contrastar versiones, no elegir la que suena más convincente.</text></svg>
