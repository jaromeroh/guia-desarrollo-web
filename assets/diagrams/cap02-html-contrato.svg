<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">HTML semántico como contrato inicial</title>
  <desc id="desc">El navegador interpreta el HTML semántico y obtiene tres capacidades relacionadas: una estructura de documento comprensible, comportamientos nativos para interactuar y una base para el árbol de accesibilidad.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#31536A"/></marker>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.title{font-size:30px;font-weight:760;text-anchor:middle}.copy{font-size:22px;fill:#59636D;text-anchor:middle}.code{font-size:22px;text-anchor:start}.flow{stroke:#31536A;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F2EEE6"/>
  <rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="72" y="82" class="sans tag">UN DOCUMENTO, VARIAS CAPACIDADES</text>

  <rect x="70" y="150" width="300" height="430" rx="24" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="220" y="205" class="sans title">HTML semántico</text>
  <text x="220" y="240" class="sans copy">declara qué representa cada parte</text>
  <rect x="105" y="282" width="230" height="230" rx="18" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="132" y="326" class="mono code">&lt;header&gt;</text>
  <text x="132" y="368" class="mono code">&lt;nav&gt;</text>
  <text x="132" y="410" class="mono code">&lt;main&gt;</text>
  <text x="132" y="452" class="mono code">&lt;form&gt;</text>
  <text x="220" y="552" class="sans copy">significado antes que apariencia</text>

  <rect x="440" y="240" width="260" height="240" rx="24" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/>
  <text x="570" y="302" class="sans title">Navegador</text>
  <text x="570" y="342" class="sans copy">analiza elementos</text>
  <text x="570" y="372" class="sans copy">y relaciones</text>
  <rect x="486" y="408" width="168" height="44" rx="14" fill="#FFFDFA" stroke="#31536A" stroke-width="2"/>
  <text x="570" y="437" class="sans copy">interpreta la semántica</text>

  <rect x="790" y="126" width="340" height="142" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="960" y="174" class="sans title">Estructura</text>
  <text x="960" y="210" class="sans copy">regiones · encabezados · listas</text>
  <text x="960" y="240" class="sans copy">forman un documento comprensible</text>

  <rect x="790" y="290" width="340" height="142" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="960" y="338" class="sans title">Comportamiento nativo</text>
  <text x="960" y="374" class="sans copy">navegar · enfocar · seleccionar</text>
  <text x="960" y="404" class="sans copy">y enviar formularios</text>

  <rect x="790" y="454" width="340" height="142" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/>
  <text x="960" y="502" class="sans title">Accesibilidad</text>
  <text x="960" y="538" class="sans copy">nombres · roles · relaciones</text>
  <text x="960" y="568" class="sans copy">alimentan el árbol accesible</text>

  <line class="flow" x1="370" y1="360" x2="434" y2="360"/>
  <path class="flow" d="M700 360 H748 V197 H784"/>
  <line class="flow" x1="700" y1="360" x2="784" y2="360"/>
  <path class="flow" d="M700 360 H748 V525 H784"/>
  <text x="600" y="642" class="sans copy">CSS presenta y JavaScript amplía; la base de significado comienza en HTML.</text>
</svg>
