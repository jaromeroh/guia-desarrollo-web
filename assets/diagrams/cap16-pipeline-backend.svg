<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Pipeline de backend</title><desc id="desc">La entrada recibe y correlaciona, el middleware aplica políticas, el caso de uso coordina, el dominio decide y la salida traduce el resultado.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.title{font-size:30px;font-weight:760}.head{font-size:20px;font-weight:760;text-anchor:middle}.copy{font-size:18px;fill:#59636D;text-anchor:middle}.num{font-size:17px;font-weight:780;text-anchor:middle}.foot{font-size:20px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker></defs><rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">UNA SOLICITUD CRUZA RESPONSABILIDADES</text><text x="72" y="146" class="s title">Pipeline de backend</text><rect id="cap16-pipeline-backend-card-1" x="72.0" y="210" width="247.5" height="270" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="195.8" cy="254" r="22" fill="#31536A"/><text x="195.8" y="261" class="s num" fill="#fff" data-container="cap16-pipeline-backend-card-1" data-padding="20">1</text><text class="s head" data-container="cap16-pipeline-backend-card-1" data-padding="20"><tspan x="195.8" y="316.0">Entrada</tspan></text><text class="s copy" data-container="cap16-pipeline-backend-card-1" data-padding="20"><tspan x="195.8" y="370.0">parsear · request</tspan><tspan x="195.8" y="394.0">ID</tspan></text><rect id="cap16-pipeline-backend-card-2" x="341.5" y="210" width="247.5" height="270" rx="22" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><circle cx="465.2" cy="254" r="22