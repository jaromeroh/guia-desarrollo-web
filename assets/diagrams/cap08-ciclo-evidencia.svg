<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de desarrollo con IA basado en evidencia</title><desc id="desc">El equipo especifica y contextualiza; el agente ejecuta; el entorno produce observaciones; equipo y herramientas evalúan; se corrige y revisa antes de volver a especificar. Se termina por evidencia suficiente, no por una declaración.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:23px;font-weight:760;text-anchor:middle}.copy{font-size:18px;fill:#59636D;text-anchor:middle}.num{font-size:17px;font-weight:780;text-anchor:middle}.foot{font-size:22px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker></defs>
  <rect width="1200" height="760" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="684" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">TERMINA POR EVIDENCIA, NO POR DECLARACIÓN</text>
  <path d="M282 234H358 M574 234H650 M866 234H942 M1010 320V430H866 M650 500H574 M358 500H282 M174 430V320" fill="none" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/>
  <g><rect x="66" y="160" width="216" height="148" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="98" cy="192" r="20" fill="#31536A"/><text x="98" y="198" class="s num" fill="#fff">1</text><text x="174" y="208" class="s head">Especificar</text><text x="174" y="248" class="s copy">resultado · restricciones</text><text x="174" y="276" class="s copy">criterios de aceptación</text></g>
  <g><rect x="358" y="160" width="216" height="148" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="390" cy="192" r="20" fill="#31536A"/><text x="390" y="198" class="s num" fill="#fff">2</text><text x="466" y="208" class="s head">Contextualizar</text><text x="466" y="248" class="s copy">código · documentos</text><text x="466" y="276" class="s copy">entorno · permisos</text></g>
  <g><rect x="650" y="160" width="216" height="148" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><circle cx="682" cy="192" r="20" fill="#59636D"/><text x="682" y="198" class="s num" fill="#fff">3</text><text x="758" y="208" class="s head">Ejecutar</text><text x="758" y="248" class="s copy">explorar · modificar</text><text x="758" y="276" class="s copy">usar herramientas</text></g>
  <g><rect x="942" y="160" width="216" height="148" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><circle cx="974" cy="192" r="20" fill="#B68125"/><text x="974" y="198" class="s num" fill="#fff">4</text><text x="1050" y="208" class="s head">Observar</text><text x="1050" y="248" class="s copy">diffs · logs · pruebas</text><text x="1050" y="276" class="s copy">capturas · estados</text></g>
  <g><rect x="650" y="426" width="216" height="148" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><circle cx="682" cy="458" r="20" fill="#B68125"/><text x="682" y="464" class="s num" fill="#fff">5</text><text x="758" y="474" class="s head">Evaluar</text><text x="758" y="514" class="s copy">corrección · seguridad</text><text x="758" y="542" class="s copy">regresiones · objetivo</text></g>
  <g><rect x="358" y="426" width="216" height="148" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="390" cy="458" r="20" fill="#31536A"/><text x="390" y="464" class="s num" fill="#fff">6</text><text x="466" y="474" class="s head">Corregir y revisar</text><text x="466" y="514" class="s copy">ajustar · explicar</text><text x="466" y="542" class="s copy">aprobar o volver</text></g>
  <rect x="66" y="426" width="216" height="148" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="174" y="474" class="s head">¿Evidencia suficiente?</text><text x="174" y="514" class="s copy">sí → integrar</text><text x="174" y="542" class="s copy">no → nuevo ciclo</text>
  <text x="600" y="648" class="s foot">La revisión aumenta con el impacto, la incertidumbre y la irreversibilidad.</text><text x="600" y="684" class="s copy">Un test que pasa es evidencia; no demuestra por sí solo que se resolvió el problema correcto.</text>
</svg>
