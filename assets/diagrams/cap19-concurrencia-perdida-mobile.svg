<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1260" role="img" aria-labelledby="title desc">
  <title id="title">Concurrencia · una actualización perdida</title>
  <desc id="desc">Dos transacciones leen el mismo saldo; ambas calculan desde el valor anterior y la segunda escritura oculta la primera. La invariante debe protegerse con una operación atómica, bloqueo, restricción o aislamiento adecuado.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="420" height="1260" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="1228" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">ACTUALIZACIÓN PERDIDA</text><rect id="lu-mobile-0" x="52" y="92" width="316" height="140" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="lu-mobile-0" data-padding="18" x="210" y="134" class="sans node-title"><tspan x="210" y="134">Estado inicial</tspan><tspan x="210" dy="32" class="node-copy">saldo = 100</tspan></text><path class="flow" d="M210 232V289"/><rect id="lu-mobile-1" x="52" y="297" width="316" height="140" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="lu-mobile-1" data-padding="18" x="210" y="339" class="sans node-title"><tspan x="210" y="339">A y B leen</tspan><tspan x="210" dy="32" class="node-copy">ambas observan 100</tspan></text><path class="flow" d="M210 437V494"/><rect id="lu-mobile-2" x="52" y="502" width="316" height="140" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="lu-mobile-2" data-padding="18" x="210" y="544" class="sans node-title"><tspan x="210" y="544">A escribe</tspan><tspan x="210" dy="32" class="node-copy">100 − 80 = 20</tspan></text><path class="risk-flow" d="M210 642V699"/><rect id="lu-mobile-3" x="52" y="707" width="316" height="140" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="lu-mobile-3" data-padding="18" x="210" y="749" class="sans node-title"><tspan x="210" y="749">B sobrescribe</tspan><tspan x="210" dy="32" class="node-copy">100 − 50 = 50</tspan></text><path class="risk-flow" d="M210 847V904"/><rect id="lu-mobile-4" x="52" y="912" width="316" height="140" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="lu-mobile-4" data-padding="18" x="210" y="954" class="sans node-title"><tspan x="210" y="954">Invariante rota</tspan><tspan x="210" dy="32" class="node-copy">el sistema ocultó una retirada</tspan></text>
</svg>
