<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo completo del desarrollo de software</title>
  <desc id="desc">Antes se reduce incertidumbre, durante se convierte la intención en software verificable y después se observa la realidad. La evidencia de producción alimenta el siguiente ciclo.</desc>
  <defs><style>
    .s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.part{font-size:17px;font-weight:760;letter-spacing:1px;text-anchor:middle}.head{font-size:32px;font-weight:780;text-anchor:middle}.purpose{font-size:22px;font-weight:700;text-anchor:middle}.item{font-size:20px;fill:#59636D;text-anchor:middle}.num{font-size:18px;font-weight:780;text-anchor:middle}.foot{font-size:22px;font-weight:700;text-anchor:middle}.note{font-size:19px;fill:#59636D;text-anchor:middle}
  </style><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L10,3 z" fill="#31536A"/></marker><marker id="r" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L10,3 z" fill="#B95736"/></marker></defs>
  <rect width="1200" height="760" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="684" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="72" y="84" class="s tag">EL CÓDIGO ES UNA FASE, NO EL CICLO COMPLETO</text>
  <path d="M374 334H424 M776 334H826" stroke="#31536A" stroke-width="6" marker-end="url(#a)"/>
  <g><rect x="72" y="132" width="302" height="406" rx="24" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="223" cy="174" r="25" fill="#31536A"/><text x="223" y="181" class="s num" fill="#fff">1</text><text x="223" y="223" class="s part" fill="#31536A">PARTE III</text><text x="223" y="270" class="s head">Antes</text><text x="223" y="310" class="s purpose">reducir incertidumbre</text><line x1="112" y1="340" x2="334" y2="340" stroke="#E8EEF1" stroke-width="2"/><text x="223" y="382" class="s item">entender el problema</text><text x="223" y="420" class="s item">diseñar la experiencia</text><text x="223" y="458" class="s item">elegir arquitectura</text><text x="223" y="496" class="s item">planificar evidencia</text></g>
  <g><rect x="424" y="132" width="352" height="406" rx="24" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><circle cx="600" cy="174" r="25" fill="#59636D"/><text x="600" y="181" class="s num" fill="#fff">2</text><text x="600" y="223" class="s part" fill="#59636D">PARTE IV</text><text x="600" y="270" class="s head">Durante</text><text x="600" y="310" class="s purpose">convertir intención en software</text><line x1="466" y1="340" x2="734" y2="340" stroke="#D8D2C7" stroke-width="2"/><text x="600" y="382" class="s item">implementar por incrementos</text><text x="600" y="420" class="s item">integrar componentes</text><text x="600" y="458" class="s item">probar supuestos</text><text x="600" y="496" class="s item">revisar lo generado</text></g>
  <g><rect x="826" y="132" width="302" height="406" rx="24" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><circle cx="977" cy="174" r="25" fill="#B68125"/><text x="977" y="181" class="s num" fill="#fff">3</text><text x="977" y="223" class="s part" fill="#C59132">PARTE V</text><text x="977" y="270" class="s head">Después</text><text x="977" y="310" class="s purpose">observar la realidad</text><line x1="866" y1="340" x2="1088" y2="340" stroke="#F5ECD8" stroke-width="2"/><text x="977" y="382" class="s item">desplegar con control</text><text x="977" y="420" class="s item">observar y diagnosticar</text><text x="977" y="458" class="s item">operar y proteger</text><text x="977" y="496" class="s item">aprender del uso</text></g>
  <path d="M977 548V610H223V548" fill="none" stroke="#B95736" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#r)"/>
  <text x="600" y="594" class="s foot" fill="#B95736">La evidencia vuelve a las decisiones</text><text x="600" y="660" class="s note">La proporción de esfuerzo cambia según el problema, el riesgo y la etapa del producto.</text>
</svg>
