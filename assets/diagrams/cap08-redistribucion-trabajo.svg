<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Redistribución del trabajo con asistencia de IA</title><desc id="desc">Sin asistencia, gran parte del esfuerzo visible se concentra en implementación mecánica. Con IA, esa parte puede comprimirse y aumenta el peso relativo de especificar, contextualizar, revisar y validar. No representa porcentajes universales.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:27px;font-weight:760}.lab{font-size:18px;font-weight:760;letter-spacing:.8px;text-anchor:middle}.copy{font-size:19px;fill:#59636D;text-anchor:middle}.foot{font-size:22px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">LA IA CAMBIA LA DISTRIBUCIÓN, NO LA RESPONSABILIDAD</text>
  <text x="72" y="146" class="s head">Flujo principalmente manual</text><rect x="72" y="174" width="230" height="146" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><rect x="326" y="174" width="548" height="146" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><rect x="898" y="174" width="230" height="146" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="187" y="224" class="s lab">ESPECIFICAR</text><text x="187" y="264" class="s copy">problema · diseño</text><text x="600" y="224" class="s lab">IMPLEMENTAR Y DEPURAR</text><text x="600" y="264" class="s copy">mucho trabajo mecánico visible</text><text x="1013" y="224" class="s lab">VERIFICAR</text><text x="1013" y="264" class="s copy">probar · lanzar</text>
  <text x="72" y="394" class="s head">Flujo asistido por IA</text><rect x="72" y="422" width="366" height="146" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><rect x="462" y="422" width="276" height="146" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><rect x="762" y="422" width="366" height="146" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="255" y="472" class="s lab">ESPECIFICAR Y CONTEXTUALIZAR</text><text x="255" y="512" class="s copy">criterios · límites · herramientas</text><text x="600" y="472" class="s lab">EJECUTAR</text><text x="600" y="512" class="s copy">generar · iterar</text><text x="945" y="472" class="s lab">EVALUAR Y OPERAR</text><text x="945" y="512" class="s copy">evidencia · seguridad · regresiones</text>
  <text x="600" y="626" class="s foot">La IA puede participar en todas las fases; el equipo sigue respondiendo por el resultado.</text><text x="600" y="660" class="s copy">La forma concreta cambia según el problema, el riesgo y las herramientas.</text>
</svg>
