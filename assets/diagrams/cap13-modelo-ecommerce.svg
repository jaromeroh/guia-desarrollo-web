<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Modelo lógico de datos para un e-commerce</title>
  <desc id="desc">Diagrama entidad-relación con usuarios, direcciones, pedidos, pagos, líneas de pedido, productos, categorías y la tabla puente de productos y categorías. Muestra claves principales, claves foráneas y cardinalidades.</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262e; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262e; }
    .table { fill: #fffdfa; stroke: #a9a49b; stroke-width: 2.2; }
    .table-blue { fill: #fffdfa; stroke: #31536a; stroke-width: 2.4; }
    .table-rust { fill: #fffdfa; stroke: #b95736; stroke-width: 2.4; }
    .table-ochre { fill: #fffdfa; stroke: #b68125; stroke-width: 2.4; }
    .head-blue { fill: #e8eef1; }
    .head-rust { fill: #f3e6df; }
    .head-ochre { fill: #f5ecd8; }
    .title { font-size: 34px; font-weight: 750; }
    .subtitle { font-size: 17px; fill: #72706c; }
    .table-title { font-size: 17px; font-weight: 730; text-anchor: middle; }
    .field { font-size: 14px; }
    .pk { font-size: 12px; font-weight: 750; fill: #31536a; }
    .fk { font-size: 12px; font-weight: 750; fill: #b95736; }
    .relation { fill: none; stroke: #59636d; stroke-width: 2.2; }
    .cardinality { font-size: 14px; font-weight: 750; fill: #59636d; text-anchor: middle; }
    .note { font-size: 14px; fill: #72706c; }
  </style>

  <rect width="1200" height="900" fill="#f2eee6"/>
  <text data-small-ok="true" x="50" y="60" class="sans title">Modelo lógico · e-commerce</text>
  <text data-small-ok="true" x="50" y="91" class="sans subtitle">Entidades, claves y cardinalidades del caso transversal del libro</text>

  <!-- Relaciones detrás de las tablas -->
  <g>
    <path class="relation" d="M220 245 H290"/>
    <text data-small-ok="true" x="236" y="236" class="sans cardinality">1</text>
    <text data-small-ok="true" x="275" y="236" class="sans cardinality">N</text>

    <path class="relation" d="M125 315 V545"/>
    <text data-small-ok="true" x="113" y="338" class="sans cardinality">1</text>
    <text data-small-ok="true" x="113" y="528" class="sans cardinality">N</text>

    <path class="relation" d="M500 245 H570"/>
    <text data-small-ok="true" x="516" y="236" class="sans cardinality">1</text>
    <text data-small-ok="true" x="555" y="236" class="sans cardinality">N</text>

    <path class="relation" d="M395 315 V545"/>
    <text data-small-ok="true" x="383" y="338" class="sans cardinality">1</text>
    <text data-small-ok="true" x="383" y="528" class="sans cardinality">0..1</text>

    <path class="relation" d="M780 245 H850"/>
    <text data-small-ok="true" x="796" y="236" class="sans cardinality">N</text>
    <text data-small-ok="true" x="835" y="236" class="sans cardinality">1</text>

    <path class="relation" d="M955 315 V420 H690 V545"/>
    <text data-small-ok="true" x="944" y="338" class="sans cardinality">1</text>
    <text data-small-ok="true" x="703" y="529" class="sans cardinality">N</text>

    <path class="relation" d="M780 645 H850"/>
    <text data-small-ok="true" x="796" y="636" class="sans cardinality">N</text>
    <text data-small-ok="true" x="835" y="636" class="sans cardinality">1</text>

    <path class="relation" d="M1060 545 V478 H1110 V545"/>
    <text data-small-ok="true" x="1075" y="499" class="sans cardinality">padre</text>
  </g>

  <!-- Usuarios -->
  <g transform="translate(40 145)">
    <rect class="table-blue" width="180" height="170" rx="12"/>
    <path class="head-blue" d="M12 0 H168 A12 12 0 0 1 180 12 V46 H0 V12 A12 12 0 0 1 12 0"/>
    <text data-small-ok="true" x="90" y="30" class="sans table-title">usuarios</text>
    <line x1="0" y1="46" x2="180" y2="46" stroke="#31536a"/>
    <text data-small-ok="true" x="14" y="72" class="mono pk">PK</text><text data-small-ok="true" x="47" y="72" class="mono field">id UUID</text>
    <text data-small-ok="true" x="47" y="98" class="mono field">email</text>
    <text data-small-ok="true" x="47" y="124" class="mono field">nombre</text>
    <text data-small-ok="true" x="47" y="150" class="mono field">rol</text>
  </g>

  <!-- Pedidos -->
  <g transform="translate(290 145)">
    <rect class="table" width="210" height="170" rx="12"/>
    <path fill="#f7f4ed" d="M12 0 H198 A12 12 0 0 1 210 12 V46 H0 V12 A12 12 0 0 1 12 0"/>
    <text data-small-ok="true" x="105" y="30" class="sans table-title">pedidos</text>
    <line x1="0" y1="46" x2="210" y2="46" stroke="#a9a49b"/>
    <text data-small-ok="true" x="14" y="72" class="mono pk">PK</text><text data-small-ok="true" x="47" y="72" class="mono field">id UUID</text>
    <text data-small-ok="true" x="14" y="98" class="mono fk">FK</text><text data-small-ok="true" x="47" y="98" class="mono field">usuario_id</text>
    <text data-small-ok="true" x="47" y="124" class="mono field">estado</text>
    <text data-small-ok="true" x="47" y="150" class="mono field">total</text>
  </g>

  <!-- Líneas -->
  <g transform="translate(570 145)">
    <rect class="table-rust" width="210" height="170" rx="12"/>
    <path class="head-rust" d="M12 0 H198 A12 12 0 0 1 210 12 V46 H0 V12 A12 12 0 0 1 12 0"/>
    <text data-small-ok="true" x="105" y="30" class="sans table-title">lineas_pedido</text>
    <line x1="0" y1="46" x2="210" y2="46" stroke="#b95736"/>
    <text data-small-ok="true" x="14" y="72" class="mono pk">PK</text><text data-small-ok="true" x="47" y="72" class="mono field">id UUID</text>
    <text data-small-ok="true" x="14" y="98" class="mono fk">FK</text><text data-small-ok="true" x="47" y="98" class="mono field">pedido_id</text>
    <text data-small-ok="true" x="14" y="124" class="mono fk">FK</text><text data-small-ok="true" x="47" y="124" class="mono field">producto_id</text>
    <text data-small-ok="true" x="47" y="150" class="mono field">cantidad · precio</text>
  </g>

  <!-- Productos -->
  <g transform="translate(850 145)">
    <rect class="table-ochre" width="210" height="170" rx="12"/>
    <path class="head-ochre" d="M12 0 H198 A12 12 0 0 1 210 12 V46 H0 V12 A12 12 0 0 1 12 0"/>
    <text data-small-ok="true" x="105" y="30" class="sans table-title">productos</text>
    <line x1="0" y1="46" x2="210" y2="46" stroke="#b68125"/>
    <text data-small-ok="true" x="14" y="72" class="mono pk">PK</text><text data-small-ok="true" x="47" y="72" class="mono field">id UUID</text>
    <text data-small-ok="true" x="47" y="98" class="mono field">sku</text>
    <text data-small-ok="true" x="47" y="124" class="mono field">nombre</text>
    <text data-small-ok="true" x="47" y="150" class="mono field">precio · stock</text>
  </g>

  <!-- Direcciones -->
  <g transform="translate(40 545)">
    <rect class="table-blue" width="180" height="170" rx="12"/>
    <path class="head-blue" d="M12 0 H168 A12 12 0 0 1 180 12 V46 H0 V12 A12 12 0 0 1 12 0"/>
    <text data-small-ok="true" x="90" y="30" class="sans table-title">direcciones</text>
    <line x1="0" y1="46" x2="180" y2="46" stroke="#31536a"/>
    <text data-small-ok="true" x="14" y="72" class="mono pk">PK</text><text data-small-ok="true" x="47" y="72" class="mono field">id UUID</text>
    <text data-small-ok="true" x="14" y="98" class="mono fk">FK</text><text data-small-ok="true" x="47" y="98" class="mono field">usuario_id</text>
    <text data-small-ok="true" x="47" y="124" class="mono field">tipo</text>
    <text data-small-ok="true" x="47" y="150" class="mono field">ciudad · país</text>
  </g>

  <!-- Pagos -->
  <g transform="translate(290 545)">
    <rect class="table-rust" width="210" height="170" rx="12"/>
    <path class="head-rust" d="M12 0 H198 A12 12 0 0 1 210 12 V46 H0 V12 A12 12 0 0 1 12 0"/>
    <text data-small-ok="true" x="105" y="30" class="sans table-title">pagos</text>
    <line x1="0" y1="46" x2="210" y2="46" stroke="#b95736"/>
    <text data-small-ok="true" x="14" y="72" class="mono pk">PK</text><text data-small-ok="true" x="47" y="72" class="mono field">id UUID</text>
    <text data-small-ok="true" x="14" y="98" class="mono fk">FK</text><text data-small-ok="true" x="47" y="98" class="mono field">pedido_id</text>
    <text data-small-ok="true" x="47" y="124" class="mono field">método · estado</text>
    <text data-small-ok="true" x="47" y="150" class="mono field">monto</text>
  </g>

  <!-- Puente -->
  <g transform="translate(570 545)">
    <rect class="table" width="210" height="170" rx="12"/>
    <path fill="#f7f4ed" d="M12 0 H198 A12 12 0 0 1 210 12 V46 H0 V12 A12 12 0 0 1 12 0"/>
    <text data-small-ok="true" x="105" y="24" class="sans" font-size="15" font-weight="730" text-anchor="middle">productos_</text>
    <text data-small-ok="true" x="105" y="41" class="sans" font-size="15" font-weight="730" text-anchor="middle">categorias</text>
    <line x1="0" y1="46" x2="210" y2="46" stroke="#a9a49b"/>
    <text data-small-ok="true" x="14" y="84" class="mono fk">FK</text><text data-small-ok="true" x="47" y="84" class="mono field">producto_id</text>
    <text data-small-ok="true" x="14" y="116" class="mono fk">FK</text><text data-small-ok="true" x="47" y="116" class="mono field">categoria_id</text>
    <text data-small-ok="true" x="47" y="150" class="mono field">PK compuesta</text>
  </g>

  <!-- Categorías -->
  <g transform="translate(850 545)">
    <rect class="table-ochre" width="210" height="170" rx="12"/>
    <path class="head-ochre" d="M12 0 H198 A12 12 0 0 1 210 12 V46 H0 V12 A12 12 0 0 1 12 0"/>
    <text data-small-ok="true" x="105" y="30" class="sans table-title">categorias</text>
    <line x1="0" y1="46" x2="210" y2="46" stroke="#b68125"/>
    <text data-small-ok="true" x="14" y="72" class="mono pk">PK</text><text data-small-ok="true" x="47" y="72" class="mono field">id UUID</text>
    <text data-small-ok="true" x="14" y="98" class="mono fk">FK</text><text data-small-ok="true" x="47" y="98" class="mono field">padre_id?</text>
    <text data-small-ok="true" x="47" y="124" class="mono field">nombre</text>
    <text data-small-ok="true" x="47" y="150" class="mono field">slug</text>
  </g>

  <g transform="translate(50 790)">
    <text data-small-ok="true" x="0" y="0" class="sans note">PK = clave primaria</text>
    <text data-small-ok="true" x="155" y="0" class="sans note">FK = clave foránea</text>
    <text data-small-ok="true" x="315" y="0" class="sans note">? = opcional</text>
    <text data-small-ok="true" x="0" y="32" class="sans note">El pedido conserva una copia de la dirección y del producto para mantener el histórico.</text>
    <rect x="820" y="-20" width="300" height="78" rx="10" fill="#f3e6df" stroke="#b95736"/>
    <text data-small-ok="true" x="837" y="7" class="sans" font-size="13" font-weight="700" fill="#8f3f26">Detalle físico a verificar</text>
    <text data-small-ok="true" x="837" y="30" class="sans note">Para garantizar Pedido 1:1 Pago,</text>
    <text data-small-ok="true" x="837" y="50" class="sans note">pagos.pedido_id debería ser UNIQUE.</text>
  </g>
</svg>
