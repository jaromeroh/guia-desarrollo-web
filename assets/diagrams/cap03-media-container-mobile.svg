<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1040" role="img" aria-labelledby="title desc">
  <title id="title">Diferencia entre media queries y container queries en composición vertical</title>
  <desc id="desc">Media queries consultan el entorno para decisiones de página. Container queries consultan el espacio local para decisiones del componente.</desc>
  <defs>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.5px;fill:#31536A}.heading{font-size:24px;font-weight:760;text-anchor:middle}.copy{font-size:17px;fill:#59636D;text-anchor:middle}.item{font-size:17px;font-weight:700;text-anchor:middle}.label{font-size:14px;font-weight:760;letter-spacing:1.1px;fill:#31536A;text-anchor:middle}
    </style>
  </defs>
  <rect width="420" height="1040" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="1008" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">DOS PREGUNTAS, DOS ALCANCES</text>
  <rect x="38" y="92" width="344" height="382" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="210" y="138" class="mono heading">@media</text>
  <text x="210" y="174" class="sans copy">¿qué permite el entorno?</text>
  <rect x="66" y="208" width="288" height="96" rx="16" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="210" y="244" class="sans label">ALCANCE: PÁGINA</text>
  <text x="210" y="280" class="sans item">viewport · color · movimiento</text>
  <text x="210" y="352" class="sans copy">Decide la estructura de página</text>
  <text x="210" y="382" class="sans copy">o respeta preferencias del usuario.</text>
  <text x="210" y="438" class="sans item">Ej.: mostrar la barra lateral</text>

  <rect x="38" y="506" width="344" height="410" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="210" y="552" class="mono heading">@container</text>
  <text x="210" y="588" class="sans copy">¿qué espacio tiene el componente?</text>
  <rect x="66" y="622" width="288" height="96" rx="16" fill="#FFFDFA" stroke="#B68125" stroke-width="2"/>
  <text x="210" y="658" class="sans label">ALCANCE: COMPONENTE</text>
  <text x="210" y="694" class="sans item">contenedor local disponible</text>
  <rect x="66" y="750" width="74" height="104" rx="13" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <rect x="154" y="750" width="112" height="104" rx="13" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <rect x="280" y="750" width="74" height="104" rx="13" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="103" y="812" class="sans label">LATERAL</text><text x="210" y="812" class="sans label">PRINCIPAL</text><text x="317" y="812" class="sans label">MODAL</text>
  <text x="210" y="886" class="sans copy">La misma tarjeta adapta su composición.</text>
  <text x="210" y="966" class="sans copy">La decisión vive donde nace la restricción.</text>
</svg>
