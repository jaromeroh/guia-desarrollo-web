<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Constructor y jardinero · dos formas de intervenir</title>
  <desc id="desc">La mentalidad de constructor controla cada paso de una implementación; la de jardinero prepara contexto, límites y evidencia para orientar resultados variables. El trabajo real combina ambas según el riesgo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">Constructor y jardinero · dos formas de intervenir</text>
  <text x="48" y="91" class="sans subtitle">No son roles excluyentes: cambia el grado de control directo</text><rect id="bg-builder" x="65" y="150" width="490" height="450" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="bg-builder" data-padding="18" x="310" y="205" class="sans node-title"><tspan x="310" y="205">Constructor</tspan></text><rect id="bg-gardener" x="645" y="150" width="490" height="450" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="bg-gardener" data-padding="18" x="890" y="205" class="sans node-title"><tspan x="890" y="205">Jardinero</tspan></text><text x="105" y="270" class="sans tag">INTERVENCIÓN</text><text x="105" y="298" class="sans small">decide cada paso</text><text x="685" y="270" class="sans tag">INTERVENCIÓN</text><text x="685" y="298" class="sans small">define condiciones y límites</text><text x="105" y="348" class="sans tag">CONTROL</text><text x="105" y="376" class="sans small">flujo explícito</text><text x="685" y="348" class="sans tag">CONTROL</text><text x="685" y="376" class="sans small">feedback y ajuste</text><text x="105" y="426" class="sans tag">DEPURACIÓN</text><text x="105" y="454" class="sans small">código y estado</text><text x="685" y="426" class="sans tag">DEPURACIÓN</text><text x="685" y="454" class="sans small">contexto, herramientas y salida</text><text x="105" y="504" class="sans tag">EVIDENCIA</text><text x="105" y="532" class="sans small">pruebas del programa</text><text x="685" y="504" class="sans tag">EVIDENCIA</text><text x="685" y="532" class="sans small">diff, pruebas, trazas y revisión</text><rect id="bg-note" x="260" y="625" width="680" height="58" rx="12" fill="#F3E6DF" stroke="#B95736" stroke-width="2"/><text data-container="bg-note" data-padding="12" x="600" y="661" class="sans node-copy">Usa control directo donde el riesgo o el oráculo lo exijan.</text>
</svg>
