<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1120" role="img" aria-labelledby="title desc"><title id="title">Iceberg del requerimiento en composición vertical</title><desc id="desc">El pedido visible oculta usuario, propósito, datos, flujo, volumen y riesgo. Las respuestas forman un requerimiento verificable.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.2px;fill:#31536A}.head{font-size:22px;font-weight:760;text-anchor:middle}.copy{font-size:16px;fill:#59636D;text-anchor:middle}.item{font-size:16px;font-weight:700}.lab{font-size: 14px;font-weight:760;letter-spacing:.8px}</style></defs><rect width="420" height="1120" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1088" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">DEL PEDIDO AL REQUERIMIENTO</text><text x="38" y="108" class="s lab" fill="#31536A">VISIBLE · LO DICHO</text><rect x="38" y="132" width="344" height="134" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="210" y="184" class="s head">«Exportar a Excel»</text><text x="210" y="224" class="s copy">solución propuesta, aún ambigua</text><path d="M38 306H382" stroke="#31536A" stroke-width="4" stroke-dasharray="10 8"/><text x="38" y="350" class="s lab">OCULTO · CONTEXTO</text><rect x="38" y="374" width="344" height="460" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="66" y="426" class="s item">¿Quién lo usa?</text><text x="66" y="478" class="s item">¿Para qué decisión?</text><text x="66" y="530" class="s item">¿Qué datos y filtros?</text><text x="66" y="582" class="s item">¿Qué ocurre después?</text><text x="66" y="634" class="s item">¿Qué volumen y permisos?</text><text x="66" y="686" class="s item">¿Qué error sería costoso?</text><text x="66" y="738" class="s item">¿Cómo medimos el éxito?</text><rect x="38" y="878" width="344" height="142" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="210" y="928" class="s head">Requerimiento verificable</text><text x="210" y="968" class="s copy">problema · usuario · límites</text><text x="210" y="998" class="s copy">criterio de éxito</text></svg>
