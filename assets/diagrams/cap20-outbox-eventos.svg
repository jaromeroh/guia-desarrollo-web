<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Transactional outbox · cerrar la brecha de publicación</title>
  <desc id="desc">La transacción guarda el cambio de dominio y el mensaje de outbox en la misma base de datos; un relay publica después en el broker y marca el mensaje. La entrega suele ser al menos una vez, por lo que el consumidor debe deduplicar.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">Transactional outbox · cerrar la brecha de publicación</text>
  <text x="48" y="91" class="sans subtitle">Una transacción local evita confirmar el pedido sin conservar la intención de publicar</text><rect id="ob-app" x="55" y="250" width="210" height="150" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="ob-app" data-padding="18" x="160" y="292" class="sans node-title"><tspan x="160" y="292">Aplicación</tspan><tspan x="160" dy="32" class="node-copy">crea pedido</tspan><tspan x="160" dy="24" class="node-copy">y evento</tspan></text><rect id="ob-db" x="355" y="175" width="250" height="120" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="ob-db" data-padding="18" x="480" y="217" class="sans node-title"><tspan x="480" y="217">orders</tspan><tspan x="480" dy="32" class="node-copy">cambio de dominio</tspan></text><rect id="ob-table" x="355" y="375" width="250" height="120" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="ob-table" data-padding="18" x="480" y="417" class="sans node-title"><tspan x="480" y="417">outbox</tspan><tspan x="480" dy="32" class="node-copy">mensaje pendiente</tspan></text><rect id="ob-tx" x="320" y="125" width="320" height="430" rx="22" fill="none" stroke="#B95736" stroke-width="3" stroke-dasharray="10 8"/><text x="345" y="155" class="sans tag">UNA TRANSACCIÓN LOCAL</text><rect id="ob-relay" x="705" y="375" width="190" height="120" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="ob-relay" data-padding="18" x="800" y="417" class="sans node-title"><tspan x="800" y="417">Relay</tspan><tspan x="800" dy="32" class="node-copy">publica y marca</tspan></text><rect id="ob-broker" x="965" y="375" width="190" height="120" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="ob-broker" data-padding="18" x="1060" y="417" class="sans node-title"><tspan x="1060" y="417">Broker</tspan><tspan x="1060" dy="32" class="node-copy">distribuye</tspan></text><rect id="ob-consumer" x="840" y="585" width="250" height="115" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="ob-consumer" data-padding="18" x="965" y="627" class="sans node-title"><tspan x="965" y="627">Consumidor</tspan><tspan x="965" dy="32" class="node-copy">deduplica por message ID</tspan></text><path class="flow" d="M265 325H316"/><path class="flow" d="M320 325H355"/><path class="flow" d="M605 435H701"/><path class="flow" d="M895 435H961"/><path class="flow" d="M1060 495V545H965V581"/><path class="risk-flow" d="M840 642H650V495H609"/><rect id="ob-label-retry" x="650" y="595" width="170" height="34" rx="8" fill="#FFFDFA"/><text data-container="ob-label-retry" data-padding="6" x="735" y="618" class="sans label">duplicado posible</text>
</svg>
