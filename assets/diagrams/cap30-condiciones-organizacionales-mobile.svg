<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1370" role="img" aria-labelledby="title desc">
  <title id="title">La organización prepara el terreno</title>
  <desc id="desc">Documentación y contexto, estructura y convenciones, herramientas y procesos, y cultura y prácticas se refuerzan para producir cambios pequeños, revisables y coherentes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="420" height="1370" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="1338" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">CONDICIONES DE EQUIPO</text><rect id="org-mobile-0" x="52" y="92" width="316" height="165" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="org-mobile-0" data-padding="18" x="210" y="134" class="sans node-title"><tspan x="210" y="134">Contexto</tspan><tspan x="210" dy="32" class="node-copy">arquitectura · ADR</tspan><tspan x="210" dy="24" class="node-copy">instrucciones vigentes</tspan></text><path class="flow" d="M210 257V314"/><rect id="org-mobile-1" x="52" y="322" width="316" height="165" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="org-mobile-1" data-padding="18" x="210" y="364" class="sans node-title"><tspan x="210" y="364">Convenciones</tspan><tspan x="210" dy="32" class="node-copy">nombres · módulos</tspan><tspan x="210" dy="24" class="node-copy">contratos predecibles</tspan></text><path class="flow" d="M210 487V544"/><rect id="org-mobile-2" x="52" y="552" width="316" height="165" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="org-mobile-2" data-padding="18" x="210" y="594" class="sans node-title"><tspan x="210" y="594">Guardrails</tspan><tspan x="210" dy="32" class="node-copy">CI · tests · linters</tspan><tspan x="210" dy="24" class="node-copy">permisos y aprobaciones</tspan></text><path class="flow" d="M210 717V774"/><rect id="org-mobile-3" x="52" y="782" width="316" height="165" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="org-mobile-3" data-padding="18" x="210" y="824" class="sans node-title"><tspan x="210" y="824">Prácticas</tspan><tspan x="210" dy="32" class="node-copy">delegación consciente</tspan><tspan x="210" dy="24" class="node-copy">revisión y aprendizaje</tspan></text><path class="flow" d="M210 947V1004"/><rect id="org-mobile-result" x="52" y="1015" width="316" height="175" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="org-mobile-result" data-padding="18" x="210" y="1057" class="sans node-title"><tspan x="210" y="1057">Cambio revisable</tspan><tspan x="210" dy="32" class="node-copy">alcance · evidencia</tspan><tspan x="210" dy="24" class="node-copy">responsable</tspan></text><rect id="org-mobile-note" x="52" y="1240" width="316" height="80" rx="14" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text data-container="org-mobile-note" data-padding="14" x="210" y="1273" class="sans node-copy"><tspan x="210">Una herramienta no compensa</tspan><tspan x="210" dy="24">un sistema de trabajo ambiguo.</tspan></text>
</svg>
