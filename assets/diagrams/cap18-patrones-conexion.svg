<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro formas de mantener datos recientes</title>
  <desc id="desc">Polling repite solicitudes; long polling mantiene una solicitud hasta que hay datos; SSE abre un flujo del servidor al cliente; WebSocket mantiene un canal bidireccional.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">Cuatro formas de mantener datos recientes</text>
  <text x="48" y="91" class="sans subtitle">La dirección y la duración del intercambio cambian el contrato operativo</text><rect id="rt-kind-0" x="55" y="135" width="210" height="105" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="rt-kind-0" data-padding="18" x="160" y="195" class="sans node-title"><tspan x="160" y="195">Polling</tspan></text><rect id="rt-client-0" x="355" y="135" width="210" height="105" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="rt-client-0" data-padding="18" x="460" y="195" class="sans node-title"><tspan x="460" y="195">Cliente</tspan></text><rect id="rt-server-0" x="825" y="135" width="210" height="105" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="rt-server-0" data-padding="18" x="930" y="195" class="sans node-title"><tspan x="930" y="195">Servidor</tspan></text><path class="flow" d="M565 170H821"/><path class="flow" d="M825 213H569"/><rect id="rt-req-0" x="610" y="139" width="164" height="34" rx="8" fill="#FFFDFA"/><text data-container="rt-req-0" data-padding="6" x="692" y="162" class="sans label">preguntar</text><rect id="rt-res-0" x="590" y="210" width="205" height="34" rx="8" fill="#FFFDFA"/><text data-container="rt-res-0" data-padding="6" x="692.5" y="233" class="sans label">responder</text><text x="1055" y="180" class="sans small"><tspan x="1055">intervalo</tspan></text><rect id="rt-kind-1" x="55" y="280" width="210" height="105" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="rt-kind-1" data-padding="18" x="160" y="340" class="sans node-title"><tspan x="160" y="340">Long polling</tspan></text><rect id="rt-client-1" x="355" y="280" width="210" height="105" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="rt-client-1" data-padding="18" x="460" y="340" class="sans node-title"><tspan x="460" y="340">Cliente</tspan></text><rect id="rt-server-1" x="825" y="280" width="210" height="105" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="rt-server-1" data-padding="18" x="930" y="340" class="sans node-title"><tspan x="930" y="340">Servidor</tspan></text><path class="flow" d="M565 315H821"/><path class="flow" d="M825 358H569"/><rect id="rt-req-1" x="610" y="284" width="164" height="34" rx="8" fill="#FFFDFA"/><text data-container="rt-req-1" data-padding="6" x="692" y="307" class="sans label">preguntar y esperar</text><rect id="rt-res-1" x="590" y="355" width="205" height="34" rx="8" fill="#FFFDFA"/><text data-container="rt-res-1" data-padding="6" x="692.5" y="378" class="sans label">responder al tener datos</text><text x="1055" y="325" class="sans small"><tspan x="1055">nueva solicitud</tspan></text><rect id="rt-kind-2" x="55" y="425" width="210" height="105" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="rt-kind-2" data-padding="18" x="160" y="485" class="sans node-title"><tspan x="160" y="485">SSE</tspan></text><rect id="rt-client-2" x="355" y="425" width="210" height="105" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="rt-client-2" data-padding="18" x="460" y="485" class="sans node-title"><tspan x="460" y="485">Cliente</tspan></text><rect id="rt-server-2" x="825" y="425" width="210" height="105" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="rt-server-2" data-padding="18" x="930" y="485" class="sans node-title"><tspan x="930" y="485">Servidor</tspan></text><path class="flow" d="M565 460H821"/><path class="flow" d="M825 503H569"/><rect id="rt-req-2" x="610" y="429" width="164" height="34" rx="8" fill="#FFFDFA"/><text data-container="rt-req-2" data-padding="6" x="692" y="452" class="sans label">abrir stream</text><rect id="rt-res-2" x="590" y="500" width="205" height="34" rx="8" fill="#FFFDFA"/><text data-container="rt-res-2" data-padding="6" x="692.5" y="523" class="sans label">eventos sucesivos</text><text x="1055" y="470" class="sans small"><tspan x="1055">auto: EventSource</tspan></text><rect id="rt-kind-3" x="55" y="570" width="210" height="105" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="rt-kind-3" data-padding="18" x="160" y="630" class="sans node-title"><tspan x="160" y="630">WebSocket</tspan></text><rect id="rt-client-3" x="355" y="570" width="210" height="105" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="rt-client-3" data-padding="18" x="460" y="630" class="sans node-title"><tspan x="460" y="630">Cliente</tspan></text><rect id="rt-server-3" x="825" y="570" width="210" height="105" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="rt-server-3" data-padding="18" x="930" y="630" class="sans node-title"><tspan x="930" y="630">Servidor</tspan></text><path class="flow" d="M565 605H821"/><path class="flow" d="M825 648H569"/><rect id="rt-req-3" x="610" y="574" width="164" height="34" rx="8" fill="#FFFDFA"/><text data-container="rt-req-3" data-padding="6" x="692" y="597" class="sans label">handshake</text><rect id="rt-res-3" x="590" y="645" width="205" height="34" rx="8" fill="#FFFDFA"/><text data-container="rt-res-3" data-padding="6" x="692.5" y="668" class="sans label">mensajes ↔</text><text x="1055" y="615" class="sans small"><tspan x="1055">definida por app</tspan></text>
</svg>
