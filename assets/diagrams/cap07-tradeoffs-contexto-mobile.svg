<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1240" role="img" aria-labelledby="title desc">
  <title id="title">Evaluación de trade-offs en composición vertical</title><desc id="desc">La decisión se revisa con objetivo, restricciones, coste del error y reversibilidad. El resultado es un ajuste al contexto actual.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.3px;fill:#31536A}.head{font-size:22px;font-weight:760;text-anchor:middle}.q{font-size:18px;font-weight:720;text-anchor:middle}.copy{font-size:16px;fill:#59636D;text-anchor:middle}.lab{font-size: 14px;font-weight:760;letter-spacing:.9px;text-anchor:middle}.foot{font-size:17px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="420" height="1240" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1208" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">TRADE-OFFS CON CONTEXTO</text>
  <rect x="38" y="92" width="344" height="148" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="210" y="136" class="s head">Decisión técnica</text><text x="210" y="178" class="s q">¿Qué opción encaja mejor ahora?</text><text x="210" y="210" class="s copy">No existe un ganador universal.</text>
  <g><rect x="38" y="278" width="344" height="182" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="210" y="316" class="s lab">OBJETIVO</text><text x="210" y="358" class="s q">¿Qué estamos optimizando?</text><text x="210" y="400" class="s copy">tiempo · coste · calidad · escala</text></g>
  <g><rect x="38" y="488" width="344" height="182" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="210" y="526" class="s lab" fill="#C59132">RESTRICCIONES</text><text x="210" y="568" class="s q">¿Qué límites son reales?</text><text x="210" y="610" class="s copy">equipo · plazo · regulación · carga</text></g>
  <g><rect x="38" y="698" width="344" height="182" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="210" y="736" class="s lab" fill="#B95736">COSTE DEL ERROR</text><text x="210" y="778" class="s q">¿Qué ocurre si falla?</text><text x="210" y="820" class="s copy">datos · dinero · usuarios · operación</text></g>
  <g><rect x="38" y="908" width="344" height="182" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="210" y="946" class="s lab">REVERSIBILIDAD</text><text x="210" y="988" class="s q">¿Cuánto cuesta cambiar?</text><text x="210" y="1030" class="s copy">migración · dependencias · opciones</text></g>
  <text x="210" y="1138" class="s foot" text-anchor="middle">Prioriza un beneficio</text><text x="210" y="1168" class="s foot" text-anchor="middle">y acepta un coste.</text><text x="210" y="1204" class="s copy" text-anchor="middle">Documenta el razonamiento y revísalo.</text>
</svg>
