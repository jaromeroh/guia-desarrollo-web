<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Verificación según impacto e incertidumbre</title><desc id="desc">Las tareas se clasifican por impacto de equivocarse e incertidumbre del trabajo. A mayor combinación, se limitan permisos, se exige aprobación, pruebas fuertes y recuperación preparada.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:25px;font-weight:760}.q{font-size:20px;font-weight:700}.copy{font-size:18px;fill:#59636D}.axis{font-size:17px;font-weight:760;letter-spacing:1px}.foot{font-size:22px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker></defs>
  <rect width="1200" height="820" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="744" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">VERIFICACIÓN PROPORCIONAL AL RIESGO</text>
  <path d="M122 692V132" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><path d="M122 692H1120" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><text x="142" y="126" class="s axis">IMPACTO DE EQUIVOCARSE ↑</text><text x="620" y="742" class="s axis" text-anchor="middle">INCERTIDUMBRE DE LA TAREA</text>
  <g><rect x="154" y="432" width="438" height="226" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="186" y="478" class="s head">Bajo impacto · baja incertidumbre</text><text x="186" y="520" class="s q">Automatizar con comprobaciones rápidas</text><text x="186" y="560" class="s copy">diff acotado · tipos · tests existentes</text><text x="186" y="594" class="s copy">revisión por muestreo cuando corresponda</text><text x="186" y="634" class="s copy">Ej.: formato o cambio mecánico reversible</text></g>
  <g><rect x="626" y="432" width="462" height="226" rx="22" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="658" y="478" class="s head">Bajo impacto · alta incertidumbre</text><text x="658" y="520" class="s q">Explorar sin confundir prototipo con solución</text><text x="658" y="560" class="s copy">entorno aislado · hipótesis explícitas</text><text x="658" y="594" class="s copy">observación y criterio de detención</text><text x="658" y="634" class="s copy">Ej.: investigar un fallo no reproducido</text></g>
  <g><rect x="154" y="158" width="438" height="226" rx="22" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="186" y="204" class="s head">Alto impacto · baja incertidumbre</text><text x="186" y="246" class="s q">Ejecutar con controles y recuperación</text><text x="186" y="286" class="s copy">pruebas específicas · revisión obligatoria</text><text x="186" y="320" class="s copy">despliegue gradual · reversión disponible</text><text x="186" y="360" class="s copy">Ej.: migración conocida de datos</text></g>
  <g><rect x="626" y="158" width="462" height="226" rx="22" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="658" y="204" class="s head">Alto impacto · alta incertidumbre</text><text x="658" y="246" class="s q">Limitar autoridad y exigir aprobación</text><text x="658" y="286" class="s copy">solo lectura primero · entorno seguro</text><text x="658" y="320" class="s copy">revisión experta · recuperación ensayada</text><text x="658" y="360" class="s copy">Ej.: autenticación, pagos o producción</text></g>
  <text x="620" y="770" class="s foot">El riesgo define la evidencia y los permisos; no la confianza subjetiva en el modelo.</text>
</svg>
