<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 980" role="img" aria-labelledby="title desc">
  <title id="title">Mapa vertical de una aplicación web y sus fronteras</title>
  <desc id="desc">Un cliente no confiable inicia una solicitud. Puede atravesar DNS, proxy o CDN antes de llegar a la aplicación, que consulta datos o servicios externos. La respuesta vuelve al cliente.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#31536A"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636D"/></marker>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:14px;font-weight:760;letter-spacing:1.5px;fill:#31536A}.group{font-size:25px;font-weight:750;text-anchor:middle}.copy{font-size:16px;fill:#59636D;text-anchor:middle}.chip{font-size:16px;font-weight:650;text-anchor:middle}.label{font-size:14px;font-weight:680;fill:#59636D;text-anchor:middle}.request{stroke:#31536A;stroke-width:4;fill:none;marker-end:url(#arrow)}.response{stroke:#59636D;stroke-width:3.5;stroke-dasharray:9 7;fill:none;marker-end:url(#return-arrow)}
    </style>
  </defs>
  <rect width="420" height="980" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="948" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="36" y="50" class="sans tag">MAPA DEL SISTEMA</text>

  <rect x="48" y="78" width="324" height="154" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="210" y="120" class="sans group">Clientes</text>
  <text x="210" y="149" class="sans copy">navegador · app móvil · servicio</text>
  <text x="210" y="181" class="sans chip">Inician solicitudes</text>
  <text x="210" y="210" class="sans copy">entorno no confiable</text>

  <line x1="36" y1="265" x2="384" y2="265" stroke="#B95736" stroke-width="3" stroke-dasharray="9 8"/>

  <rect x="48" y="310" width="324" height="132" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/>
  <text x="210" y="353" class="sans group">Red y edge</text>
  <text x="210" y="384" class="sans chip">DNS · proxy · CDN</text>
  <text x="210" y="416" class="sans copy">resolución, caché o enrutamiento</text>

  <rect x="48" y="500" width="324" height="154" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/>
  <text x="210" y="543" class="sans group">Aplicación</text>
  <text x="210" y="576" class="sans chip">API y validación</text>
  <text x="210" y="606" class="sans chip">Lógica de negocio</text>
  <text x="210" y="634" class="sans copy">procesa y coordina</text>

  <rect x="48" y="712" width="324" height="154" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="210" y="755" class="sans group">Dependencias</text>
  <text x="210" y="788" class="sans chip">Datos y caché</text>
  <text x="210" y="818" class="sans chip">Servicios externos</text>
  <text x="210" y="846" class="sans copy">persisten o colaboran</text>

  <line class="request" x1="184" y1="232" x2="184" y2="304"/>
  <line class="request" x1="184" y1="442" x2="184" y2="494"/>
  <line class="request" x1="184" y1="654" x2="184" y2="706"/>
  <path class="response" d="M238 712 V660 M238 500 V448 M238 310 V238"/>
  <rect x="126" y="248" width="168" height="32" rx="10" fill="#FFFDFA"/>
  <text x="210" y="270" class="sans label">frontera de confianza</text>
  <text x="210" y="916" class="sans label">solicitud continua · respuesta discontinua</text>
</svg>
