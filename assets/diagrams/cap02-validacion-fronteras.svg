<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Validación en cliente y servidor</title>
  <desc id="desc">El cliente ofrece ayuda temprana para corregir datos, pero permanece fuera de la frontera de confianza. El servidor vuelve a analizar los datos, valida el contrato, autoriza la operación y solo entonces acepta cambios.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#31536A"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#59636D"/></marker>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.title{font-size:31px;font-weight:760;text-anchor:middle}.copy{font-size:22px;fill:#59636D;text-anchor:middle}.item{font-size:22px;font-weight:680;text-anchor:start}.boundary{font-size:18px;font-weight:720;letter-spacing:1.2px;fill:#59636D;text-anchor:middle}.flow{stroke:#31536A;stroke-width:4;fill:none;marker-end:url(#arrow)}.return{stroke:#59636D;stroke-width:3.5;stroke-dasharray:10 8;fill:none;marker-end:url(#return-arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F2EEE6"/>
  <rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="72" y="82" class="sans tag">DOS RESPONSABILIDADES DISTINTAS</text>

  <rect x="70" y="150" width="430" height="390" rx="24" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="285" y="205" class="sans title">Cliente</text>
  <text x="285" y="240" class="sans copy">ayuda a corregir pronto</text>
  <rect x="105" y="280" width="360" height="190" rx="18" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="132" y="323" class="mono item">required</text>
  <text x="132" y="365" class="mono item">minlength="3"</text>
  <text x="132" y="407" class="sans item">mensaje junto al campo</text>
  <text x="285" y="510" class="sans copy">mejora la experiencia, no crea confianza</text>

  <line x1="600" y1="126" x2="600" y2="566" stroke="#B95736" stroke-width="3" stroke-dasharray="10 9"/>
  <rect x="480" y="108" width="240" height="36" rx="12" fill="#FFFDFA"/>
  <text x="600" y="132" class="sans boundary">FRONTERA DE CONFIANZA</text>

  <rect x="700" y="150" width="430" height="390" rx="24" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/>
  <text x="915" y="205" class="sans title">Servidor</text>
  <text x="915" y="240" class="sans copy">decide si la operación es aceptable</text>
  <rect x="735" y="280" width="360" height="190" rx="18" fill="#FFFDFA" stroke="#B95736" stroke-width="2"/>
  <text x="762" y="323" class="sans item">1. Analiza y normaliza</text>
  <text x="762" y="365" class="sans item">2. Valida el contrato</text>
  <text x="762" y="407" class="sans item">3. Autentica y autoriza</text>
  <text x="762" y="449" class="sans item">4. Acepta o rechaza</text>
  <text x="915" y="510" class="sans copy">protege la integridad del sistema</text>

  <line class="flow" x1="500" y1="340" x2="694" y2="340"/>
  <text x="600" y="320" class="sans copy">datos propuestos</text>
  <path class="return" d="M700 488 H650 V580 H500"/>
  <rect x="525" y="558" width="150" height="34" rx="11" fill="#FFFDFA"/>
  <text x="600" y="582" class="sans copy">resultado o errores</text>
  <text x="600" y="638" class="sans title">El cliente propone; el servidor decide.</text>
</svg>
