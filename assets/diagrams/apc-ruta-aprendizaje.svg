<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Ruta de aprendizaje del desarrollo web</title><desc id="desc">La ruta avanza desde la plataforma web hasta datos, operación y distribución; luego compara stacks y usa IA con un diario de calibración.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.title{font-size:30px;font-weight:760}.head{font-size:18px;font-weight:760;text-anchor:middle}.copy{font-size:16px;fill:#59636D;text-anchor:middle}.num{font-size:17px;font-weight:780;text-anchor:middle}.foot{font-size:20px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker></defs><rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">APRENDER ES CERRAR RECORRIDOS</text><text x="72" y="146" class="s title">Ruta de aprendizaje del desarrollo web</text><rect id="apc-ruta-aprendizaje-card-1" x="72.0" y="210" width="157.7" height="270" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="150.8" cy="254" r="22" fill="#31536A"/><text x="150.8" y="261" class="s num" fill="#fff" data-container="apc-ruta-aprendizaje-card-1" data-padding="20">1</text><text class="s head" data-container="apc-ruta-aprendizaje-card-1" data-padding="18"><tspan x="150.8" y="302.0">Plataforma</tspan><tspan x="150.8" y="330.0">web</tspan></text><text class="s copy" data-container="apc-ruta-aprendizaje-card-1" data-padding="20"><tspan x="150.8" y="370.0">HTML · CSS ·</tspan><tspan x="150.8" y="394.0">JS · red</tspan></text><rect id="apc-ruta-aprendizaje-card-2" x="251.7" y="210" width="157.7" height="270" rx="22" fill="#FFFDFA" stroke="#A9