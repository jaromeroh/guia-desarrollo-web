<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1330" role="img" aria-labelledby="title desc">
  <title id="title">Transactional outbox · cerrar la brecha de publicación</title>
  <desc id="desc">La transacción guarda el cambio de dominio y el mensaje de outbox en la misma base de datos; un relay publica después en el broker y marca el mensaje. La entrega suele ser al menos una vez, por lo que el consumidor debe deduplicar.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="420" height="1330" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="1298" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">CAMBIO Y MENSAJE ATÓMICOS</text><rect id="ob-mobile-0" x="52" y="92" width="316" height="140" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="ob-mobile-0" data-padding="18" x="210" y="134" class="sans node-title"><tspan x="210" y="134">Transacción local</tspan><tspan x="210" dy="32" class="node-copy">guardar pedido + fila outbox</tspan></text><path class="flow" d="M210 232V289"/><rect id="ob-mobile-1" x="52" y="297" width="316" height="140" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="ob-mobile-1" data-padding="18" x="210" y="339" class="sans node-title"><tspan x="210" y="339">Confirmar</tspan><tspan x="210" dy="32" class="node-copy">ambos cambios o ninguno</tspan></text><path class="flow" d="M210 437V494"/><rect id="ob-mobile-2" x="52" y="502" width="316" height="140" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="ob-mobile-2" data-padding="18" x="210" y="544" class="sans node-title"><tspan x="210" y="544">Relay</tspan><tspan x="210" dy="32" class="node-copy">publicar mensaje pendiente</tspan></text><path class="flow" d="M210 642V699"/><rect id="ob-mobile-3" x="52" y="707" width="316" height="140" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="ob-mobile-3" data-padding="18" x="210" y="749" class="sans node-title"><tspan x="210" y="749">Broker</tspan><tspan x="210" dy="32" class="node-copy">asumir y distribuir el mensaje</tspan></text><path class="flow" d="M210 847V904"/><rect id="ob-mobile-4" x="52" y="912" width="316" height="140" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="ob-mobile-4" data-padding="18" x="210" y="954" class="sans node-title"><tspan x="210" y="954">Consumidor</tspan><tspan x="210" dy="32" class="node-copy">deduplicar y aplicar el efecto</tspan></text><rect id="ob-mobile-note" x="52" y="1125" width="316" height="125" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2"/><text data-container="ob-mobile-note" data-padding="16" x="210" y="1160" class="sans node-copy"><tspan x="210">Puede haber redelivery.</tspan><tspan x="210" dy="25">El message ID permite</tspan><tspan x="210" dy="25">deduplicar el efecto.</tspan></text>
</svg>
