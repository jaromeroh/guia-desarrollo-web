<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Modelo de caja y diagnóstico de desbordamiento</title>
  <desc id="desc">La caja se compone de contenido, padding, borde y margen. Cuando el tamaño mínimo del contenido supera el espacio disponible, aparece desbordamiento y debe revisarse el contrato de tamaño.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#31536A"/></marker>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.heading{font-size:30px;font-weight:760;text-anchor:middle}.copy{font-size:22px;fill:#59636D;text-anchor:middle}.item{font-size:23px;font-weight:720}.flow{stroke:#31536A;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="740" fill="#F2EEE6"/>
  <rect x="38" y="38" width="1124" height="664" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="72" y="84" class="sans tag">TAMAÑO DECLARADO, TAMAÑO REAL</text>

  <rect x="70" y="136" width="550" height="480" rx="24" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/>
  <text x="345" y="182" class="sans heading">Capas de una caja</text>
  <rect x="112" y="218" width="466" height="342" rx="18" fill="#F2EEE6" stroke="#A9A49B" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="136" y="250" class="sans item">margin</text>
  <rect x="158" y="266" width="374" height="250" rx="16" fill="#F3E6DF" stroke="#B95736" stroke-width="4"/>
  <text x="182" y="300" class="sans item">border</text>
  <rect x="204" y="314" width="282" height="154" rx="14" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="228" y="348" class="sans item">padding</text>
  <rect x="250" y="362" width="190" height="70" rx="12" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="345" y="406" class="sans item" text-anchor="middle">contenido</text>
  <text x="345" y="594" class="sans copy">Con border-box, width incluye padding y borde.</text>

  <rect x="680" y="136" width="450" height="480" rx="24" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/>
  <text x="905" y="182" class="sans heading">Cuando no cabe</text>
  <rect x="720" y="226" width="370" height="92" rx="16" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="750" y="263" class="sans item">Espacio disponible</text><text x="1056" y="292" class="mono item" text-anchor="end">22rem</text>
  <line class="flow" x1="905" y1="320" x2="905" y2="354"/>
  <rect x="720" y="364" width="370" height="92" rx="16" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="750" y="401" class="sans item">Mínimo del contenido</text><text x="1056" y="430" class="mono item" text-anchor="end">30rem</text>
  <line class="flow" x1="905" y1="458" x2="905" y2="492"/>
  <rect x="720" y="502" width="370" height="82" rx="16" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/>
  <text x="905" y="538" class="sans heading">Desbordamiento</text>
  <text x="905" y="568" class="sans copy">las restricciones no concuerdan</text>
  <text x="600" y="666" class="sans copy">Antes de ocultarlo, identifica qué caja no puede reducirse y qué debería hacer el contenido.</text>
</svg>
