<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Authorization Code con PKCE</title>
  <desc id="desc">La aplicación crea un verifier y envía solo su challenge al servidor de autorización; después canjea el código junto con el verifier. Un código interceptado no basta para obtener tokens.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="780" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">Authorization Code con PKCE</text>
  <text x="48" y="91" class="sans subtitle">PKCE vincula el código de autorización con la instancia que inició el flujo</text><rect id="pkce-user" x="50" y="130" width="180" height="90" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="pkce-user" data-padding="18" x="140" y="182" class="sans node-title"><tspan x="140" y="182">Persona</tspan></text><path class="relation" stroke-dasharray="7 8" d="M140 220V710"/><rect id="pkce-app" x="325" y="130" width="180" height="90" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="pkce-app" data-padding="18" x="415" y="182" class="sans node-title"><tspan x="415" y="182">Aplicación</tspan></text><path class="relation" stroke-dasharray="7 8" d="M415 220V710"/><rect id="pkce-auth" x="650" y="130" width="180" height="90" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="pkce-auth" data-padding="18" x="740" y="182" class="sans node-title"><tspan x="740" y="182">Autorizador</tspan></text><path class="relation" stroke-dasharray="7 8" d="M740 220V710"/><rect id="pkce-api" x="975" y="130" width="180" height="90" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="pkce-api" data-padding="18" x="1065" y="182" class="sans node-title"><tspan x="1065" y="182">API</tspan></text><path class="relation" stroke-dasharray="7 8" d="M1065 220V710"/><path class="flow" d="M415 270H640"/><rect id="pkce-message-0" x="433" y="230" width="189" height="34" rx="8" fill="#FFFDFA"/><text data-container="pkce-message-0" data-padding="6" x="527.5" y="253" class="sans label">1 · challenge + state</text><path class="flow" d="M740 340H425"/><rect id="pkce-message-1" x="467" y="300" width="230" height="34" rx="8" fill="#FFFDFA"/><text data-container="pkce-message-1" data-padding="6" x="582" y="323" class="sans label">2 · autenticar y consentir</text><path class="flow" d="M740 410H415"/><rect id="pkce-message-2" x="492" y="370" width="171" height="34" rx="8" fill="#FFFDFA"/><text data-container="pkce-message-2" data-padding="6" x="577.5" y="393" class="sans label">3 · redirect + code</text><path class="flow" d="M415 485H740"/><rect id="pkce-message-3" x="492" y="445" width="171" height="34" rx="8" fill="#FFFDFA"/><text data-container="pkce-message-3" data-padding="6" x="577.5" y="468" class="sans label">4 · code + verifier</text><path class="flow" d="M740 560H415"/><rect id="pkce-message-4" x="502" y="520" width="150" height="34" rx="8" fill="#FFFDFA"/><text data-container="pkce-message-4" data-padding="6" x="577" y="543" class="sans label">5 · tokens</text><path class="flow" d="M505 635H1065"/><rect id="pkce-message-5" x="710" y="595" width="150" height="34" rx="8" fill="#FFFDFA"/><text data-container="pkce-message-5" data-padding="6" x="785" y="618" class="sans label">6 · access token</text><rect id="pkce-local" x="280" y="235" width="270" height="70" rx="12" fill="#E8EEF1" stroke="#31536A" stroke-width="2"/><text data-container="pkce-local" data-padding="12" x="415" y="263" class="sans node-copy"><tspan x="415">Genera verifier aleatorio</tspan><tspan x="415" dy="23">y lo conserva temporalmente</tspan></text><rect id="pkce-note" x="320" y="700" width="560" height="55" rx="12" fill="#F3E6DF" stroke="#B95736" stroke-width="2"/><text data-container="pkce-note" data-padding="12" x="600" y="735" class="sans node-copy">El código robado no se canjea sin el verifier correcto.</text>
</svg>
