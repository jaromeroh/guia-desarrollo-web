<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1410" role="img" aria-labelledby="title desc">
  <title id="title">Hosting · responsabilidad frente a abstracción</title>
  <desc id="desc">Infraestructura ofrece mayor control operativo; una plataforma o contenedor administrado comparte responsabilidades; funciones y edge administran más del runtime, pero imponen contratos y límites específicos.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="420" height="1410" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="1378" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">COMPARACIÓN ESTRUCTURADA</text><rect id="mobile-card-0" x="38" y="92" width="344" height="372" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="mobile-card-0" data-padding="18" x="210" y="137" class="sans node-title"><tspan x="210" y="137">Infraestructura</tspan></text><text x="62" y="184" class="sans tag">MODELO</text><text x="62" y="209" class="sans small">VM · red · sistema</text><text x="62" y="230" class="sans small">configurados por el equipo</text><text x="62" y="272" class="sans tag">ENCAJA CUANDO</text><text x="62" y="297" class="sans small">runtime o red especiales</text><text x="62" y="318" class="sans small">control fino</text><text x="62" y="360" class="sans tag">COSTE A OPERAR</text><text x="62" y="385" class="sans small">parches · capacidad</text><text x="62" y="406" class="sans small">recuperación · guardias</text><rect id="mobile-card-1" x="38" y="512" width="344" height="372" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="mobile-card-1" data-padding="18" x="210" y="557" class="sans node-title"><tspan x="210" y="557">Plataforma</tspan></text><text x="62" y="604" class="sans tag">MODELO</text><text x="62" y="629" class="sans small">app o contenedor</text><text x="62" y="650" class="sans small">ciclo administrado</text><text x="62" y="692" class="sans tag">ENCAJA CUANDO</text><text x="62" y="717" class="sans small">servicio web común</text><text x="62" y="738" class="sans small">equipo pequeño o medio</text><text x="62" y="780" class="sans tag">COSTE A OPERAR</text><text x="62" y="805" class="sans small">límites del producto</text><text x="62" y="826" class="sans small">red y portabilidad</text><rect id="mobile-card-2" x="38" y="932" width="344" height="372" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="mobile-card-2" data-padding="18" x="210" y="977" class="sans node-title"><tspan x="210" y="977">Funciones y edge</tspan></text><text x="62" y="1024" class="sans tag">MODELO</text><text x="62" y="1049" class="sans small">ejecución por evento</text><text x="62" y="1070" class="sans small">distribución gestionada</text><text x="62" y="1112" class="sans tag">ENCAJA CUANDO</text><text x="62" y="1137" class="sans small">carga variable</text><text x="62" y="1158" class="sans small">trabajo cercano y acotado</text><text x="62" y="1200" class="sans tag">COSTE A OPERAR</text><text x="62" y="1225" class="sans small">cuotas · latencia a datos</text><text x="62" y="1246" class="sans small">runtime específico</text>
</svg>
