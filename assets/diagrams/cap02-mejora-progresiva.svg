<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Capas de la mejora progresiva</title>
  <desc id="desc">HTML aporta la función esencial. CSS mejora la presentación y JavaScript amplía el comportamiento. Cada capa se apoya en la anterior, que conserva su propósito si la superior falla.</desc>
  <defs>
    <style>
      .bg { fill: #F2EEE6; }
      .frame { fill: #FFFDFA; stroke: #D8D2C7; stroke-width: 3; }
      .eyebrow { fill: #31536A; font-family: sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 3px; }
      .title { fill: #20262E; font-family: sans-serif; font-size: 35px; font-weight: 700; }
      .copy { fill: #59636D; font-family: sans-serif; font-size: 22px; font-weight: 400; }
      .item { fill: #31536A; font-family: sans-serif; font-size: 18px; font-weight: 600; }
      .html { fill: #E8EEF1; stroke: #31536A; stroke-width: 4; }
      .css { fill: #F2EEE6; stroke: #A9A49B; stroke-width: 4; }
      .js { fill: #F5ECD8; stroke: #C59132; stroke-width: 4; }
      .support { fill: none; stroke: #72706C; stroke-width: 4; }
      .badge-blue { fill: #31536A; }
      .badge-gray { fill: #72706C; }
      .badge { fill: #fff; font-family: sans-serif; font-size: 20px; font-weight: 700; }
      .footer { fill: #31536A; font-family: sans-serif; font-size: 22px; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#72706C"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <rect class="frame" x="38" y="38" width="1124" height="684" rx="28"/>
  <text class="eyebrow" x="78" y="92">CAPAS ACUMULATIVAS</text>

  <path class="support" d="M600 540V500" marker-end="url(#arrow)"/>
  <path class="support" d="M600 346V306" marker-end="url(#arrow)"/>

  <rect class="html" x="120" y="546" width="960" height="124" rx="22"/>
  <circle class="badge-blue" cx="170" cy="590" r="24"/>
  <text class="badge" x="170" y="597" text-anchor="middle">1</text>
  <text class="title" x="210" y="590">HTML · función esencial</text>
  <text class="copy" x="210" y="628">Contenido, enlaces y formularios que ya pueden cumplir su propósito</text>
  <text class="item" x="935" y="611" text-anchor="middle">BASE</text>

  <rect class="css" x="210" y="352" width="780" height="136" rx="22"/>
  <circle class="badge-gray" cx="260" cy="400" r="24"/>
  <text class="badge" x="260" y="407" text-anchor="middle">2</text>
  <text class="title" x="300" y="400">CSS · presentación</text>
  <text class="copy" x="300" y="438">Jerarquía, adaptación y legibilidad</text>
  <text class="item" x="875" y="420" text-anchor="middle">MEJORA</text>

  <rect class="js" x="300" y="146" width="600" height="148" rx="22"/>
  <circle class="badge-blue" cx="350" cy="196" r="24"/>
  <text class="badge" x="350" y="203" text-anchor="middle">3</text>
  <text class="title" x="390" y="196">JavaScript · ampliación</text>
  <text class="copy" x="390" y="236">Actualizaciones parciales, autocompletado</text>
  <text class="copy" x="390" y="266">y otras interacciones enriquecidas</text>

  <rect x="120" y="686" width="960" height="1" fill="#D8D2C7"/>
  <text class="footer" x="600" y="708" text-anchor="middle">Si una capa superior falla, la inferior conserva su propósito.</text>
</svg>
