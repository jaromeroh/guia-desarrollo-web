<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Promover el mismo artefacto entre ambientes</title>
  <desc id="desc">Un commit produce un artefacto inmutable; preview y staging verifican propiedades distintas; producción recibe ese mismo artefacto con configuración externa, y la liberación se observa y puede detenerse.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">Promover el mismo artefacto entre ambientes</text>
  <text x="48" y="91" class="sans subtitle">Cambiar configuración no debe reconstruir el binario</text><rect id="promo-source" x="55" y="215" width="190" height="150" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="promo-source" data-padding="18" x="150" y="257" class="sans node-title"><tspan x="150" y="257">Commit</tspan><tspan x="150" dy="32" class="node-copy">código revisado</tspan><tspan x="150" dy="24" class="node-copy">lockfile vigente</tspan></text><rect id="promo-artifact" x="310" y="215" width="215" height="150" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="promo-artifact" data-padding="18" x="417.5" y="257" class="sans node-title"><tspan x="417.5" y="257">Artefacto</tspan><tspan x="417.5" dy="32" class="node-copy">inmutable</tspan><tspan x="417.5" dy="24" class="node-copy">ID verificable</tspan></text><rect id="promo-preview" x="590" y="155" width="245" height="135" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="promo-preview" data-padding="18" x="712.5" y="197" class="sans node-title"><tspan x="712.5" y="197">Preview</tspan><tspan x="712.5" dy="32" class="node-copy">cambio y UX</tspan><tspan x="712.5" dy="24" class="node-copy">datos aislados</tspan></text><rect id="promo-staging" x="590" y="360" width="245" height="135" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="promo-staging" data-padding="18" x="712.5" y="402" class="sans node-title"><tspan x="712.5" y="402">Staging</tspan><tspan x="712.5" dy="32" class="node-copy">integración y operación</tspan><tspan x="712.5" dy="24" class="node-copy">propiedades relevantes</tspan></text><rect id="promo-production" x="920" y="255" width="225" height="155" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="promo-production" data-padding="18" x="1032.5" y="297" class="sans node-title"><tspan x="1032.5" y="297">Producción</tspan><tspan x="1032.5" dy="32" class="node-copy">tráfico real</tspan><tspan x="1032.5" dy="24" class="node-copy">señales y alertas</tspan></text><path class="flow" d="M245 290H306"/><path class="flow" d="M525 260H586"/><path class="flow" d="M525 320H555V427H586"/><path class="flow" d="M835 222H875V330H916"/><path class="flow" d="M835 427H875V335H916"/><rect id="promo-config-a" x="600" y="300" width="205" height="36" rx="8" fill="#FFFDFA"/><text data-container="promo-config-a" data-padding="6" x="702.5" y="324" class="sans label">configuración externa</text><path class="risk-flow" d="M1032 410V535H700V499"/><rect id="promo-stop" x="765" y="517" width="210" height="36" rx="8" fill="#FFFDFA"/><text data-container="promo-stop" data-padding="6" x="870" y="541" class="sans label">detener o revertir app</text><rect id="promo-note" x="215" y="585" width="770" height="82" rx="14" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text data-container="promo-note" data-padding="16" x="600" y="618" class="sans node-copy"><tspan x="600">La paridad significa reproducir las propiedades que se validan.</tspan><tspan x="600" dy="25">Las diferencias inevitables deben ser explícitas y comprobables.</tspan></text>
</svg>
