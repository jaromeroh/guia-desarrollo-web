<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Iceberg del pedido y el requerimiento</title><desc id="desc">El pedido visible es exportar. Bajo la superficie están usuario, propósito, datos, volumen, seguridad y flujo posterior. El requerimiento verificable emerge al conectar esas respuestas.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:30px;font-weight:760;text-anchor:middle}.copy{font-size:21px;fill:#59636D;text-anchor:middle}.item{font-size:20px;font-weight:700}.lab{font-size:17px;font-weight:760;letter-spacing:1px}</style></defs><rect width="1200" height="760" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="684" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">DEL PEDIDO A UNA NECESIDAD VERIFICABLE</text><path d="M72 282H1128" stroke="#31536A" stroke-width="4" stroke-dasharray="12 9"/><text x="92" y="266" class="s lab" fill="#31536A">SUPERFICIE · LO DICHO</text><rect x="376" y="126" width="448" height="116" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="600" y="176" class="s head">«Quiero exportar a Excel»</text><text x="600" y="214" class="s copy">una solución propuesta, todavía ambigua</text><text x="92" y="320" class="s lab" fill="#59636D">BAJO LA SUPERFICIE · CONTEXTO</text><rect x="72" y="346" width="1056" height="222" rx="24" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="120" y="396" class="s item">¿Quién lo usa y para qué decisión?</text><text x="120" y="442" class="s item">¿Qué datos, filtros y formato necesita?</text><text x="120" y="488" class="s item">¿Qué volumen, frecuencia y permisos existen?</text><text x="642" y="396" class="s item">¿Qué ocurre antes y después?</text><text x="642" y="442" class="s item">¿Qué error sería costoso?</text><text x="642" y="488" class="s item">¿Cómo sabremos que funciona?</text><rect x="248" y="602" width="704" height="76" rx="18" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="600" y="636" class="s head">Requerimiento verificable</text><text x="600" y="666" class="s copy">problema + usuario + restricciones + criterio de éxito</text></svg>
