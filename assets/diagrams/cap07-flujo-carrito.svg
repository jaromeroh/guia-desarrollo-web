<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">El sistema vive en las conexiones del flujo de carrito</title><desc id="desc">Frontend, API, carrito e inventario colaboran para agregar un producto. Se destacan doble envío, contrato incompatible y cambio concurrente de stock. La confirmación o el error regresan a la interfaz.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:25px;font-weight:760;text-anchor:middle}.copy{font-size:18px;fill:#59636D;text-anchor:middle}.risk{font-size:16px;font-weight:720;fill:#B95736;text-anchor:middle}.lab{font-size:16px;font-weight:760;text-anchor:middle}.foot{font-size:21px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#59636D"/></marker></defs>
  <rect width="1200" height="780" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="704" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">EL SISTEMA VIVE EN LAS CONEXIONES</text>
  <path d="M286 254H344 M546 254H604 M806 254H864" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/>
  <g><rect x="72" y="148" width="214" height="214" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="179" y="194" class="s head">Frontend</text><text x="179" y="236" class="s copy">captura el clic</text><text x="179" y="268" class="s copy">anticipa la interfaz</text><text x="179" y="316" class="m copy">POST /cart/items</text></g>
  <g><rect x="332" y="148" width="214" height="214" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="439" y="194" class="s head">API</text><text x="439" y="236" class="s copy">autentica</text><text x="439" y="268" class="s copy">valida entrada</text><text x="439" y="300" class="s copy">coordina</text></g>
  <g><rect x="592" y="148" width="214" height="214" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="699" y="194" class="s head">Carrito</text><text x="699" y="236" class="s copy">calcula precio</text><text x="699" y="268" class="s copy">agrega el ítem</text><text x="699" y="300" class="s copy">persiste</text></g>
  <g><rect x="852" y="148" width="276" height="214" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="990" y="194" class="s head">Inventario y datos</text><text x="990" y="236" class="s copy">comprueba existencia</text><text x="990" y="268" class="s copy">verifica o reserva stock</text><text x="990" y="300" class="s copy">confirma la transacción</text></g>
  <g><rect x="244" y="392" width="156" height="66" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2"/><text x="322" y="420" class="s risk">doble envío</text><text x="322" y="444" class="s risk">o timeout</text><rect x="502" y="392" width="164" height="66" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2"/><text x="584" y="420" class="s risk">contrato</text><text x="584" y="444" class="s risk">incompatible</text><rect x="770" y="392" width="190" height="66" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2"/><text x="865" y="420" class="s risk">stock cambia</text><text x="865" y="444" class="s risk">en concurrencia</text></g>
  <path d="M990 362V520H180V366" fill="none" stroke="#59636D" stroke-width="4" stroke-dasharray="11 8" marker-end="url(#r)"/><text x="600" y="506" class="s lab">confirmación o error vuelve por las mismas fronteras</text>
  <rect x="72" y="552" width="1056" height="104" rx="18" fill="#E8EEF1" stroke="#31536A" stroke-width="2"/><text x="600" y="590" class="s foot">La actualización optimista crea una obligación</text><text x="600" y="626" class="s copy">éxito: conservar el cambio · error: revertir la interfaz y explicar qué ocurrió</text>
  <text x="600" y="704" class="s copy">Prueba también conexiones, tiempos, reintentos y efectos concurrentes.</text>
</svg>
