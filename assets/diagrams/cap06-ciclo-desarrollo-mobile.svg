<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1300" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo completo del desarrollo en composición vertical</title>
  <desc id="desc">Antes se reduce incertidumbre, durante se implementa y verifica, y después se observa la realidad. La evidencia regresa al siguiente ciclo.</desc>
  <defs><style>
    .s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.3px;fill:#31536A}.part{font-size: 14px;font-weight:760;letter-spacing:1px}.head{font-size:25px;font-weight:780}.purpose{font-size:17px;font-weight:700}.item{font-size:16px;fill:#59636D}.num{font-size:15px;font-weight:780;text-anchor:middle}.foot{font-size:17px;font-weight:700;text-anchor:middle}.note{font-size:15px;fill:#59636D;text-anchor:middle}
  </style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#31536A"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#B95736"/></marker></defs>
  <rect width="420" height="1300" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1268" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">EL CICLO COMPLETO</text>
  <g><rect x="38" y="92" width="344" height="278" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="74" cy="132" r="22" fill="#31536A"/><text x="74" y="138" class="s num" fill="#fff">1</text><text x="108" y="128" class="s part" fill="#31536A">PARTE III</text><text x="108" y="160" class="s head">Antes</text><text x="66" y="207" class="s purpose">Reducir incertidumbre</text><text x="66" y="245" class="s item">problema · experiencia</text><text x="66" y="277" class="s item">arquitectura · plan</text><text x="66" y="314" class="s item"><tspan x="66">Definir qué evidencia</tspan><tspan x="66" dy="24">confirmará la decisión.</tspan></text></g>
  <path d="M210 370V410" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="418" width="344" height="278" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><circle cx="74" cy="458" r="22" fill="#59636D"/><text x="74" y="464" class="s num" fill="#fff">2</text><text x="108" y="454" class="s part" fill="#59636D">PARTE IV</text><text x="108" y="486" class="s head">Durante</text><text x="66" y="533" class="s purpose">Convertir intención en software</text><text x="66" y="571" class="s item">implementar · integrar</text><text x="66" y="603" class="s item">probar · revisar</text><text x="66" y="652" class="s item">La IA acelera; el equipo verifica.</text></g>
  <path d="M210 696V736" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="744" width="344" height="278" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><circle cx="74" cy="784" r="22" fill="#B68125"/><text x="74" y="790" class="s num" fill="#fff">3</text><text x="108" y="780" class="s part" fill="#C59132">PARTE V</text><text x="108" y="812" class="s head">Después</text><text x="66" y="859" class="s purpose">Observar la realidad</text><text x="66" y="897" class="s item">desplegar · diagnosticar</text><text x="66" y="929" class="s item">operar · aprender</text><text x="66" y="978" class="s item">El uso revela límites y oportunidades.</text></g>
  <path d="M210 1022V1080H66V1010" fill="none" stroke="#B95736" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#r)"/>
  <text x="210" y="1118" class="s foot" fill="#B95736" text-anchor="middle">La evidencia inicia el siguiente ciclo.</text><text x="210" y="1178" class="s note" text-anchor="middle">No existe una distribución universal</text><text x="210" y="1206" class="s note" text-anchor="middle">del esfuerzo entre las tres fases.</text>
</svg>
