<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Decisión de reutilización de una respuesta en caché</title><desc id="desc">Una respuesta fresca se reutiliza. Una respuesta vencida con validador se consulta condicionalmente: 304 reutiliza el cuerpo y 200 lo reemplaza. Sin validador se solicita una respuesta completa.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:27px;font-weight:760;text-anchor:middle}.copy{font-size:20px;fill:#59636D;text-anchor:middle}.lab{font-size:17px;font-weight:760;letter-spacing:1px;fill:#31536A;text-anchor:middle}.yes{font-size:18px;font-weight:760;fill:#31536A}.no{font-size:18px;font-weight:760;fill:#59636D}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker></defs>
  <rect width="1200" height="760" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="684" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">FRESCURA NO ES LO MISMO QUE VALIDACIÓN</text>
  <rect x="72" y="132" width="244" height="104" rx="18" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="194" y="176" class="s head">Respuesta</text><text x="194" y="210" class="s copy">almacenada</text>
  <path d="M316 184H386" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/><polygon points="474,118 562,184 474,250 386,184" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="474" y="177" class="s head">¿Sigue</text><text x="474" y="207" class="s head">fresca?</text>
  <path d="M474 250V325H286" fill="none" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/><text x="490" y="293" class="s yes">SÍ</text><rect x="72" y="282" width="214" height="92" rx="18" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="179" y="326" class="s head">Reutilizar</text><text x="179" y="356" class="s copy">sin ir al origen</text>
  <path d="M562 184H632" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/><text x="580" y="168" class="s no">NO</text><polygon points="720,118 808,184 720,250 632,184" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="720" y="177" class="s head">¿Tiene</text><text x="720" y="207" class="s head">validador?</text>
  <path d="M720 250V316" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/><text x="738" y="286" class="s yes">SÍ</text><rect x="596" y="316" width="248" height="96" rx="18" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="720" y="358" class="s head">Petición condicional</text><text x="720" y="390" class="m copy">If-None-Match</text>
  <path d="M808 184H922V316" fill="none" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/><text x="840" y="168" class="s no">NO</text><rect x="910" y="316" width="218" height="96" rx="18" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="1019" y="358" class="s head">Petición normal</text><text x="1019" y="390" class="s copy">descarga completa</text>
  <path d="M720 412V482H512" fill="none" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/><path d="M720 412V482H924" fill="none" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/>
  <rect x="292" y="452" width="220" height="118" rx="18" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="402" y="494" class="m head">304</text><text x="402" y="528" class="s copy">reutiliza el cuerpo</text><text x="402" y="554" class="s copy">y actualiza metadatos</text>
  <rect x="924" y="452" width="204" height="118" rx="18" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="1026" y="494" class="m head">200</text><text x="1026" y="528" class="s copy">reemplaza el cuerpo</text><text x="1026" y="554" class="s copy">almacenado</text>
  <text x="600" y="650" class="s head">Validar puede evitar transferir otra vez el contenido.</text><text x="600" y="684" class="s copy">Pero aun requiere consultar al servidor de origen.</text>
</svg>
