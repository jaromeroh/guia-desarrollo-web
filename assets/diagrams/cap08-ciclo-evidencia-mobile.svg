<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1450" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo con IA basado en evidencia en composición vertical</title><desc id="desc">Se especifica, contextualiza, ejecuta, observa, evalúa y corrige o revisa. El ciclo termina cuando la evidencia es suficiente para el riesgo.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.2px;fill:#31536A}.head{font-size:21px;font-weight:760}.copy{font-size:15px;fill:#59636D}.num{font-size:15px;font-weight:780;text-anchor:middle}.foot{font-size:17px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#31536A"/></marker></defs>
  <rect width="420" height="1450" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1418" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">CICLO BASADO EN EVIDENCIA</text>
  <g><rect x="38" y="92" width="344" height="154" rx="19" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="128" r="20" fill="#31536A"/><text x="72" y="134" class="s num" fill="#fff">1</text><text x="108" y="132" class="s head">Especificar</text><text x="66" y="178" class="s copy">resultado · restricciones · aceptación</text></g><path d="M210 246V282" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="290" width="344" height="154" rx="19" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="326" r="20" fill="#31536A"/><text x="72" y="332" class="s num" fill="#fff">2</text><text x="108" y="330" class="s head">Contextualizar</text><text x="66" y="376" class="s copy">código · documentos · permisos</text></g><path d="M210 444V480" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="488" width="344" height="154" rx="19" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><circle cx="72" cy="524" r="20" fill="#59636D"/><text x="72" y="530" class="s num" fill="#fff">3</text><text x="108" y="528" class="s head">Ejecutar</text><text x="66" y="574" class="s copy">explorar · modificar · usar herramientas</text></g><path d="M210 642V678" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="686" width="344" height="154" rx="19" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><circle cx="72" cy="722" r="20" fill="#B68125"/><text x="72" y="728" class="s num" fill="#fff">4</text><text x="108" y="726" class="s head">Observar</text><text x="66" y="772" class="s copy">diffs · logs · pruebas · estados</text></g><path d="M210 840V876" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="884" width="344" height="154" rx="19" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><circle cx="72" cy="920" r="20" fill="#B68125"/><text x="72" y="926" class="s num" fill="#fff">5</text><text x="108" y="924" class="s head">Evaluar</text><text x="66" y="970" class="s copy">corrección · seguridad · regresiones</text></g><path d="M210 1038V1074" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="1082" width="344" height="154" rx="19" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="1118" r="20" fill="#31536A"/><text x="72" y="1124" class="s num" fill="#fff">6</text><text x="108" y="1122" class="s head">Corregir y revisar</text><text x="66" y="1168" class="s copy">ajustar · aprobar · volver al inicio</text></g>
  <text x="210" y="1300" class="s foot" text-anchor="middle">Termina cuando la evidencia</text><text x="210" y="1332" class="s foot" text-anchor="middle">es suficiente para el riesgo.</text><text x="210" y="1384" class="s copy" text-anchor="middle">No cuando el agente declara que terminó.</text>
</svg>
