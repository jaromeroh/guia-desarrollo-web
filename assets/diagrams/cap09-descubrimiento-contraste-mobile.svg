<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1280" role="img" aria-labelledby="title desc"><title id="title">Fuentes de descubrimiento en composición vertical</title><desc id="desc">Conversación, observación, evidencia y prototipo aportan perspectivas diferentes que se sintetizan en supuestos, preguntas y criterios.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.2px;fill:#31536A}.head{font-size:22px;font-weight:760}.copy{font-size:16px;fill:#59636D}.lab{font-size: 14px;font-weight:760;letter-spacing:.8px}.foot{font-size:17px;font-weight:700;text-anchor:middle}</style></defs><rect width="420" height="1280" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1248" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">CONTRASTAR CUATRO FUENTES</text><g><rect x="38" y="94" width="344" height="200" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="66" y="140" class="s head">Conversar</text><text x="66" y="180" class="s copy">lenguaje · intención · dolor percibido</text><text x="66" y="254" class="s lab" fill="#31536A">LO QUE DICE</text></g><g><rect x="38" y="320" width="344" height="200" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="66" y="366" class="s head">Observar</text><text x="66" y="406" class="s copy">pasos · atajos · trabajo invisible</text><text x="66" y="480" class="s lab" fill="#C59132">LO QUE HACE</text></g><g><rect x="38" y="546" width="344" height="200" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="66" y="592" class="s head">Revisar evidencia</text><text x="66" y="632" class="s copy">datos · soporte · excepciones</text><text x="66" y="706" class="s lab">LO QUE OCURRE</text></g><g><rect x="38" y="772" width="344" height="200" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="66" y="818" class="s head">Prototipar</text><text x="66" y="858" class="s copy">hacer visible una interpretación</text><text x="66" y="932" class="s lab" fill="#31536A">LO QUE ENTENDIMOS</text></g><rect x="38" y="1010" width="344" height="154" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="66" y="1054" class="s head">Síntesis compartida</text><text x="66" y="1094" class="s copy">supuestos · preguntas · criterios</text><text x="210" y="1216" class="s foot" text-anchor="middle">Descubrir es contrastar versiones.</text></svg>
