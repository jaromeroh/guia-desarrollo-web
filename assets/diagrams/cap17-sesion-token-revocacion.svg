<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sesión referenciada o token autocontenido</title>
  <desc id="desc">Una sesión referenciada permite revocar el estado en el servidor de forma directa; un token autocontenido se verifica localmente pero necesita expiración breve, rotación o estado adicional cuando la revocación debe ser inmediata.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">Sesión referenciada o token autocontenido</text>
  <text x="48" y="91" class="sans subtitle">La diferencia decisiva es dónde vive el estado y cómo se revoca</text><rect x="38" y="125" width="1124" height="535" rx="24" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><rect id="st-browser-a" x="75" y="205" width="220" height="125" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="st-browser-a" data-padding="18" x="185" y="247" class="sans node-title"><tspan x="185" y="247">Cliente web</tspan><tspan x="185" dy="32" class="node-copy">cookie con ID opaco</tspan></text><rect id="st-app-a" x="430" y="205" width="220" height="125" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="st-app-a" data-padding="18" x="540" y="247" class="sans node-title"><tspan x="540" y="247">Aplicación</tspan><tspan x="540" dy="32" class="node-copy">resuelve el ID</tspan></text><rect id="st-store" x="785" y="205" width="300" height="125" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="st-store" data-padding="18" x="935" y="247" class="sans node-title"><tspan x="935" y="247">Almacén de sesiones</tspan><tspan x="935" dy="32" class="node-copy">identidad · riesgo · vigencia</tspan></text><path class="flow" d="M295 268H426"/><path class="flow" d="M650 268H781"/><rect id="st-label-a" x="310" y="218" width="100" height="34" rx="8" fill="#FFFDFA"/><text data-container="st-label-a" data-padding="6" x="360" y="241" class="sans label">ID opaco</text><rect id="st-label-b" x="665" y="218" width="104" height="34" rx="8" fill="#FFFDFA"/><text data-container="st-label-b" data-padding="6" x="717" y="241" class="sans label">consulta</text><path class="risk-flow" d="M935 330V375H540V407"/><rect id="st-label-revoke" x="690" y="342" width="210" height="34" rx="8" fill="#FFFDFA"/><text data-container="st-label-revoke" data-padding="6" x="795" y="365" class="sans label">invalidación inmediata</text><rect id="st-client-b" x="75" y="455" width="220" height="125" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="st-client-b" data-padding="18" x="185" y="497" class="sans node-title"><tspan x="185" y="497">Cliente API</tspan><tspan x="185" dy="32" class="node-copy">access token breve</tspan></text><rect id="st-api" x="430" y="455" width="220" height="125" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="st-api" data-padding="18" x="540" y="497" class="sans node-title"><tspan x="540" y="497">Resource API</tspan><tspan x="540" dy="32" class="node-copy">firma · emisor</tspan><tspan x="540" dy="24" class="node-copy">audiencia · vigencia</tspan></text><rect id="st-policy" x="785" y="455" width="300" height="125" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="st-policy" data-padding="18" x="935" y="497" class="sans node-title"><tspan x="935" y="497">Estado adicional</tspan><tspan x="935" dy="32" class="node-copy">bloqueo · permisos · revocación</tspan></text><path class="flow" d="M295 518H426"/><path class="risk-flow" d="M650 518H781"/><rect id="st-label-token" x="310" y="468" width="100" height="34" rx="8" fill="#FFFDFA"/><text data-container="st-label-token" data-padding="6" x="360" y="491" class="sans label">token</text><rect id="st-label-current" x="660" y="468" width="116" height="34" rx="8" fill="#FFFDFA"/><text data-container="st-label-current" data-padding="6" x="718" y="491" class="sans label">si hace falta</text>
</svg>
