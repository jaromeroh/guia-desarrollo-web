<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1260" role="img" aria-labelledby="title desc">
  <title id="title">Diagnóstico por capas en composición vertical</title><desc id="desc">DNS, transporte, TLS, HTTP y uso final producen evidencias diferentes que permiten localizar un fallo.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.4px;fill:#31536A}.head{font-size:22px;font-weight:760}.copy{font-size:17px;fill:#59636D}.ev{font-size:15px;font-weight:700;fill:#31536A;text-anchor:end}.foot{font-size:17px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#31536A"/></marker></defs>
  <rect width="420" height="1260" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1228" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">DIAGNÓSTICO POR CAPAS</text><text x="38" y="92" class="s head"><tspan x="38">Busca la primera</tspan><tspan x="38" dy="28">evidencia ausente</tspan></text>
  <g><rect x="38" y="136" width="344" height="150" rx="18" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="66" y="182" class="s head">DNS</text><text x="66" y="218" class="s copy">nombre → dirección</text><text x="354" y="218" class="m ev" text-anchor="end">registro DNS</text></g><path d="M210 286V322" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="330" width="344" height="150" rx="18" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><text x="66" y="376" class="s head">Transporte</text><text x="66" y="412" class="s copy">establece conexión</text><text x="354" y="412" class="m ev" text-anchor="end">connect time</text></g><path d="M210 480V516" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="524" width="344" height="150" rx="18" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="66" y="570" class="s head">TLS</text><text x="66" y="606" class="s copy">protege y valida</text><text x="354" y="606" class="m ev" text-anchor="end">certificado</text></g><path d="M210 674V710" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="718" width="344" height="150" rx="18" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><text x="66" y="764" class="s head">HTTP</text><text x="66" y="800" class="s copy">petición y respuesta</text><text x="354" y="800" class="m ev" text-anchor="end">estado · headers</text></g><path d="M210 868V904" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="38" y="912" width="344" height="164" rx="18" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="66" y="958" class="s head">Uso final</text><text x="66" y="994" class="s copy">aplicación y navegador</text><text x="354" y="1032" class="m ev" text-anchor="end">logs · consola</text></g>
  <text x="210" y="1140" class="s foot">“No carga” no localiza la causa.</text><text x="210" y="1176" class="s copy" text-anchor="middle">Cada capa puede fallar por separado.</text>
</svg>
