<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1120" role="img" aria-labelledby="title desc">
  <title id="title">Frontera de un componente en composición vertical</title><desc id="desc">El contrato expone entradas, resultados, errores y garantías. La implementación queda oculta tras una frontera estable.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.3px;fill:#31536A}.head{font-size:22px;font-weight:760;text-anchor:middle}.copy{font-size:16px;fill:#59636D;text-anchor:middle}.item{font-size:16px;font-weight:700;text-anchor:middle}.lab{font-size: 14px;font-weight:760;letter-spacing:.9px;text-anchor:middle}</style></defs>
  <rect width="420" height="1120" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1088" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">LA FRONTERA ES UN CONTRATO</text>
  <rect x="38" y="92" width="344" height="588" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="210" y="136" class="s head">Lo que otros pueden observar</text>
  <rect x="66" y="174" width="288" height="96" rx="14" fill="#FFFDFA"/><text x="210" y="208" class="s lab">ENTRADAS</text><text x="210" y="244" class="m copy">createUser(data)</text>
  <rect x="66" y="292" width="288" height="96" rx="14" fill="#FFFDFA"/><text x="210" y="326" class="s lab">RESULTADOS</text><text x="210" y="362" class="s copy">usuario creado</text>
  <rect x="66" y="410" width="288" height="96" rx="14" fill="#FFFDFA"/><text x="210" y="444" class="s lab">ERRORES</text><text x="210" y="480" class="s copy">datos inválidos</text>
  <rect x="66" y="528" width="288" height="96" rx="14" fill="#FFFDFA"/><text x="210" y="562" class="s lab">GARANTÍAS</text><text x="210" y="598" class="s copy">unicidad · permisos</text>
  <line x1="38" y1="726" x2="382" y2="726" stroke="#31536A" stroke-width="4" stroke-dasharray="10 8"/><rect x="110" y="704" width="200" height="44" rx="20" fill="#31536A"/><text x="210" y="732" class="s lab" fill="#fff">FRONTERA ESTABLE</text>
  <rect x="38" y="784" width="344" height="204" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="210" y="830" class="s head">Implementación oculta</text><text x="210" y="872" class="s item">validación · consultas</text><text x="210" y="906" class="s item">hash · registros</text><text x="210" y="954" class="s copy">Puede cambiar tras la frontera.</text>
  <text x="210" y="1036" class="s copy" text-anchor="middle">Depende del contrato,</text><text x="210" y="1066" class="s copy" text-anchor="middle">no de los detalles internos.</text>
</svg>
