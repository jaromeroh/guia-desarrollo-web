<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1420" role="img" aria-labelledby="title desc">
  <title id="title">Seguridad del navegador en composición vertical</title><desc id="desc">Same-origin policy, CORS, CSRF y CSP resuelven preguntas distintas sobre lectura, permiso, intención y ejecución.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.3px;fill:#31536A}.head{font-size:23px;font-weight:760}.q{font-size:17px;font-weight:720}.copy{font-size:16px;fill:#59636D}.lab{font-size: 14px;font-weight:760;letter-spacing:.8px}.foot{font-size:17px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="420" height="1420" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1388" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">CUATRO PREGUNTAS DE SEGURIDAD</text>
  <g><rect x="38" y="94" width="344" height="256" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="66" y="140" class="s head">Mismo origen</text><text x="66" y="181" class="s q">¿Puede leer el otro origen?</text><text x="66" y="222" class="s copy">Limita acceso programático que</text><text x="66" y="250" class="s copy">expondría datos entre sitios.</text><text x="66" y="310" class="s lab" fill="#31536A">RESTRICCIÓN BASE</text></g>
  <g><rect x="38" y="380" width="344" height="256" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="66" y="426" class="s head">CORS</text><text x="66" y="467" class="s q">¿Autoriza compartir la respuesta?</text><text x="66" y="508" class="s copy">El servidor concede lectura a</text><text x="66" y="536" class="s copy">un origen mediante cabeceras.</text><text x="66" y="596" class="s lab" fill="#C59132">PERMISO ENTRE ORÍGENES</text></g>
  <g><rect x="38" y="666" width="344" height="256" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="66" y="712" class="s head">CSRF</text><text x="66" y="753" class="s q">¿El usuario quiso esta acción?</text><text x="66" y="794" class="s copy">Un sitio intenta aprovechar</text><text x="66" y="822" class="s copy">credenciales ya presentes.</text><text x="66" y="882" class="s lab" fill="#B95736">INTENCIÓN AUTENTICADA</text></g>
  <g><rect x="38" y="952" width="344" height="256" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="66" y="998" class="s head">CSP</text><text x="66" y="1039" class="s q">¿Qué puede cargarse o ejecutarse?</text><text x="66" y="1080" class="s copy">Restringe scripts, estilos,</text><text x="66" y="1108" class="s copy">conexiones y otras fuentes.</text><text x="66" y="1168" class="s lab" fill="#59636D">DEFENSA EN PROFUNDIDAD</text></g>
  <text x="210" y="1276" class="s foot">Ninguno sustituye los controles</text><text x="210" y="1308" class="s foot">del servidor.</text><text x="210" y="1354" class="s copy" text-anchor="middle">Primero identifica la pregunta.</text>
</svg>
