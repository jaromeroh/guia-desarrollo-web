<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1450" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de carrito en composición vertical</title><desc id="desc">La petición cruza frontend, API, carrito e inventario. Cada conexión añade riesgos y la respuesta obliga a confirmar o revertir la interfaz.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.2px;fill:#31536A}.head{font-size:22px;font-weight:760}.copy{font-size:16px;fill:#59636D}.risk{font-size:14px;font-weight:720;fill:#B95736;text-anchor:middle}.foot{font-size:17px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#31536A"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#59636D"/></marker></defs>
  <rect width="420" height="1450" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1418" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">EL SISTEMA VIVE EN LAS CONEXIONES</text>
  <g><rect x="38" y="94" width="344" height="188" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="66" y="140" class="s head">Frontend</text><text x="66" y="178" class="s copy">captura el clic · anticipa la interfaz</text><text x="66" y="218" class="m copy">POST /cart/items</text></g><path d="M210 282V326" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect x="240" y="292" width="128" height="48" rx="12" fill="#F3E6DF" stroke="#B95736"/><text x="304" y="322" class="s risk">doble envío</text>
  <g><rect x="38" y="334" width="344" height="188" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="66" y="380" class="s head">API</text><text x="66" y="418" class="s copy">autentica · valida · coordina</text><text x="66" y="458" class="s copy">expone el contrato HTTP</text></g><path d="M210 522V566" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect x="232" y="532" width="136" height="48" rx="12" fill="#F3E6DF" stroke="#B95736"/><text x="300" y="562" class="s risk">contrato incompatible</text>
  <g><rect x="38" y="574" width="344" height="188" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="66" y="620" class="s head">Carrito</text><text x="66" y="658" class="s copy">calcula precio · agrega el ítem</text><text x="66" y="698" class="s copy">coordina la persistencia</text></g><path d="M210 762V806" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect x="226" y="772" width="142" height="48" rx="12" fill="#F3E6DF" stroke="#B95736"/><text x="297" y="802" class="s risk">stock concurrente</text>
  <g><rect x="38" y="814" width="344" height="206" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="66" y="860" class="s head">Inventario y datos</text><text x="66" y="898" class="s copy">comprueba existencia y stock</text><text x="66" y="938" class="s copy">confirma la transacción</text><text x="66" y="978" class="s copy">o devuelve un error</text></g>
  <path d="M210 1020V1080H66V1010" fill="none" stroke="#59636D" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#r)"/><text x="210" y="1116" class="s foot" text-anchor="middle">La respuesta vuelve por las fronteras.</text>
  <rect x="38" y="1150" width="344" height="170" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="210" y="1192" class="s foot">La interfaz contrajo una obligación</text><text x="210" y="1234" class="s copy" text-anchor="middle">éxito → conservar el cambio</text><text x="210" y="1266" class="s copy" text-anchor="middle">error → revertir y explicar</text>
  <text x="210" y="1368" class="s copy" text-anchor="middle">Prueba conexiones, tiempos</text><text x="210" y="1398" class="s copy" text-anchor="middle">y reintentos.</text>
</svg>
