<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Niveles del modelado de datos</title><desc id="desc">El modelo conceptual identifica conceptos, el lógico define relaciones y restricciones, y el físico decide almacenamiento e índices.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.title{font-size:30px;font-weight:760}.head{font-size:20px;font-weight:760;text-anchor:middle}.copy{font-size:18px;fill:#59636D;text-anchor:middle}.num{font-size:17px;font-weight:780;text-anchor:middle}.foot{font-size:20px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker></defs><rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">TRES MODELOS, TRES PREGUNTAS</text><text x="72" y="146" class="s title">Niveles del modelado de datos</text><rect id="cap13-niveles-modelado-card-1" x="72.0" y="210" width="247.5" height="270" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="195.8" cy="254" r="22" fill="#31536A"/><text x="195.8" y="261" class="s num" fill="#fff" data-container="cap13-niveles-modelado-card-1" data-padding="20">1</text><text class="s head" data-container="cap13-niveles-modelado-card-1" data-padding="20"><tspan x="195.8" y="316.0">Conceptual</tspan></text><text class="s copy" data-container="cap13-niveles-modelado-card-1" data-padding="20"><tspan x="195.8" y="382.0">¿qué existe?</tspan></text><rect id="cap13-niveles-modelado-card-2" x="341.5" y="210" width="247.5" height="270" rx="22" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><circle cx="465.2" cy="254" r="22" fill="#A9A49B"/><text x="465.2" y="261" class="s num" fill="#fff" data-container="cap13-niveles-modelado-card-2" data-padding="20">2</text><text class="s head" data-container="cap13-niveles-modelado-card-2" data-padding="20"><tspan x="465.2" y="316.0">Lógico</tspan></text><text class="s copy" data-container="cap13-niveles-modelado-card-2" data-padding="20"><tspan x="465.2" y="382.0">¿cómo se relaciona?</tspan></text><rect id="cap13-niveles-modelado-card-3" x="611.0" y="210" width="247.5" height="270" rx="22" fill="#F5ECD8" stroke="#C59132" stroke-width="3"/><circle cx="734.8" cy="254" r="22" fill="#C59132"/><text x="734.8" y="261" class="s num" fill="#fff" data-container="cap13-niveles-modelado-card-3" data-padding="20">3</text><text class="s head" data-container="cap13-niveles-modelado-card-3" data-padding="20"><tspan x="734.8" y="316.0">Físico</tspan></text><text class="s copy" data-container="cap13-niveles-modelado-card-3" data-padding="20"><tspan x="734.8" y="382.0">¿cómo se almacena?</tspan></text><rect id="cap13-niveles-modelado-card-4" x="880.5" y="210" width="247.5" height="270" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="1004.2" cy="254" r="22" fill="#31536A"/><text x="1004.2" y="261" class="s num" fill="#fff" data-container="cap13-niveles-modelado-card-4" data-padding="20">4</text><text class="s head" data-container="cap13-niveles-modelado-card-4" data-padding="20"><tspan x="1004.2" y="316.0">Evolución</tspan></text><text class="s copy" data-container="cap13-niveles-modelado-card-4" data-padding="20"><tspan x="1004.2" y="370.0">¿cómo cambia sin</tspan><tspan x="1004.2" y="394.0">perder datos?</tspan></text><path d="M319.5 345H333.5" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><path d="M589.0 345H603.0" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><path d="M858.5 345H872.5" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap13-niveles-modelado-footer" x="126" y="548" width="948" height="90" rx="18" fill="#FFFDFA" stroke="#D8D2