<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Evaluación contextual de trade-offs</title><desc id="desc">Una decisión técnica se evalúa según el objetivo actual, las restricciones reales, el coste de equivocarse y su reversibilidad. La mejor opción es el mejor ajuste al contexto, no un ganador universal.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:29px;font-weight:760;text-anchor:middle}.q{font-size:22px;font-weight:720;text-anchor:middle}.copy{font-size:19px;fill:#59636D;text-anchor:middle}.lab{font-size:16px;font-weight:760;letter-spacing:1px;text-anchor:middle}.foot{font-size:22px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">NO HAY UN GANADOR FUERA DE CONTEXTO</text>
  <rect x="416" y="132" width="368" height="146" rx="24" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="600" y="180" class="s head">Decisión técnica</text><text x="600" y="222" class="s q">¿Qué opción encaja mejor ahora?</text><text x="600" y="252" class="s copy">con evidencia y supuestos explícitos</text>
  <g><rect x="72" y="326" width="244" height="176" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="194" y="370" class="s lab">OBJETIVO</text><text x="194" y="414" class="s q">¿Qué optimizamos?</text><text x="194" y="452" class="s copy">tiempo · coste</text><text x="194" y="480" class="s copy">calidad · escala</text></g>
  <g><rect x="342" y="326" width="244" height="176" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="464" y="370" class="s lab" fill="#C59132">RESTRICCIONES</text><text x="464" y="414" class="s q">¿Qué es real?</text><text x="464" y="452" class="s copy">equipo · plazo</text><text x="464" y="480" class="s copy">regulación · carga</text></g>
  <g><rect x="612" y="326" width="244" height="176" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="734" y="370" class="s lab" fill="#B95736">COSTE DEL ERROR</text><text x="734" y="414" class="s q">¿Qué pasa si falla?</text><text x="734" y="452" class="s copy">datos · dinero</text><text x="734" y="480" class="s copy">usuarios · operación</text></g>
  <g><rect x="882" y="326" width="246" height="176" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="1005" y="370" class="s lab">REVERSIBILIDAD</text><text x="1005" y="414" class="s q">¿Podemos cambiar?</text><text x="1005" y="452" class="s copy">coste de migrar</text><text x="1005" y="480" class="s copy">opciones abiertas</text></g>
  <text x="600" y="574" class="s foot">Elige conscientemente qué beneficio priorizas y qué coste aceptas.</text><text x="600" y="614" class="s copy">Documenta el razonamiento para poder revisarlo cuando cambie el contexto.</text>
</svg>
