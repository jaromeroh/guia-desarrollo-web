<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1120" role="img" aria-labelledby="title desc">
  <title id="title">Redistribución del trabajo con IA en composición vertical</title><desc id="desc">La asistencia puede comprimir implementación mecánica y aumentar el peso relativo de especificación y verificación, sin transferir responsabilidad.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.2px;fill:#31536A}.head{font-size:22px;font-weight:760}.lab{font-size: 14px;font-weight:760;letter-spacing:.8px;text-anchor:middle}.copy{font-size:16px;fill:#59636D;text-anchor:middle}.foot{font-size:17px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="420" height="1120" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1088" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">REDISTRIBUIR, NO DELEGAR RESPONSABILIDAD</text>
  <text x="38" y="108" class="s head">Flujo principalmente manual</text><rect x="38" y="136" width="344" height="280" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/>
  <rect x="66" y="172" width="288" height="62" rx="13" fill="#E8EEF1"/><text x="210" y="210" class="s lab">ESPECIFICAR · tramo breve</text><rect x="66" y="250" width="288" height="88" rx="13" fill="#FFFDFA"/><text x="210" y="286" class="s lab">IMPLEMENTAR · tramo dominante</text><text x="210" y="318" class="s copy">escribir · integrar · depurar</text><rect x="66" y="354" width="288" height="42" rx="13" fill="#F5ECD8"/><text x="210" y="381" class="s lab">VERIFICAR</text>
  <text x="38" y="474" class="s head">Flujo asistido por IA</text><rect x="38" y="502" width="344" height="360" rx="20" fill="#FFFDFA" stroke="#31536A" stroke-width="3"/>
  <rect x="66" y="540" width="288" height="92" rx="13" fill="#E8EEF1"/><text x="210" y="576" class="s lab">ESPECIFICAR Y CONTEXTUALIZAR</text><text x="210" y="608" class="s copy">criterios · límites · herramientas</text><rect x="100" y="650" width="220" height="70" rx="13" fill="#F7F4ED"/><text x="210" y="692" class="s lab">EJECUTAR · ITERAR</text><rect x="66" y="738" width="288" height="92" rx="13" fill="#F5ECD8"/><text x="210" y="774" class="s lab">EVALUAR Y OPERAR</text><text x="210" y="806" class="s copy">evidencia · seguridad · regresiones</text>
  <text x="210" y="930" class="s foot" text-anchor="middle">La IA puede participar en todas las fases.</text><text x="210" y="968" class="s foot" text-anchor="middle">El equipo responde por el resultado.</text><text x="210" y="1028" class="s copy" text-anchor="middle">No representa porcentajes universales.</text>
</svg>
