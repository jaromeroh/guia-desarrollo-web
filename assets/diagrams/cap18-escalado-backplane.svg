<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Escalar conexiones exige un backplane</title>
  <desc id="desc">Cada instancia conserva sus conexiones locales; un backplane distribuye mensajes entre instancias para alcanzar al destinatario conectado en otro proceso. La durabilidad depende de la tecnología elegida.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">Escalar conexiones exige un backplane</text>
  <text x="48" y="91" class="sans subtitle">El balanceador reparte conexiones; el backplane coordina mensajes</text><rect id="rt-lb" x="435" y="125" width="330" height="105" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="rt-lb" data-padding="18" x="600" y="167" class="sans node-title"><tspan x="600" y="167">Balanceador</tspan><tspan x="600" dy="32" class="node-copy">establece la ruta de conexión</tspan></text><rect id="rt-instance-1" x="95" y="310" width="250" height="130" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="rt-instance-1" data-padding="18" x="220" y="352" class="sans node-title"><tspan x="220" y="352">Instancia 1</tspan><tspan x="220" dy="32" class="node-copy">conexiones locales A</tspan></text><path class="flow" d="M600 230V270H220V306"/><rect id="rt-instance-2" x="475" y="310" width="250" height="130" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="rt-instance-2" data-padding="18" x="600" y="352" class="sans node-title"><tspan x="600" y="352">Instancia 2</tspan><tspan x="600" dy="32" class="node-copy">conexiones locales B</tspan></text><path class="flow" d="M600 230V270H600V306"/><rect id="rt-instance-3" x="855" y="310" width="250" height="130" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="rt-instance-3" data-padding="18" x="980" y="352" class="sans node-title"><tspan x="980" y="352">Instancia 3</tspan><tspan x="980" dy="32" class="node-copy">conexiones locales C</tspan></text><path class="flow" d="M600 230V270H980V306"/><rect id="rt-bus" x="305" y="495" width="590" height="185" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="rt-bus" data-padding="18" x="600" y="537" class="sans node-title"><tspan x="600" y="537">Backplane de mensajería</tspan><tspan x="600" dy="32" class="node-copy">fan-out entre instancias</tspan><tspan x="600" dy="24" class="node-copy">Pub/Sub no aporta replay</tspan><tspan x="600" dy="24" class="node-copy">un broker durable</tspan><tspan x="600" dy="24" class="node-copy">añade retención o replay</tspan></text><path class="flow" d="M220 440V465H600V491"/><path class="flow" d="M600 440V465H600V491"/><path class="flow" d="M980 440V465H600V491"/>
</svg>
