<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1390" role="img" aria-labelledby="title desc">
  <title id="title">Acoplamiento y cohesión en composición vertical</title><desc id="desc">Se comparan alto y bajo acoplamiento, y baja y alta cohesión. El objetivo son cambios localizados sin fragmentar al máximo.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.3px;fill:#31536A}.head{font-size:23px;font-weight:760}.q{font-size:17px;font-weight:700}.copy{font-size:16px;fill:#59636D}.lab{font-size: 14px;font-weight:760;letter-spacing:.8px}.foot{font-size:17px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="420" height="1390" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1358" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">DOS DIMENSIONES DEL DISEÑO</text>
  <g><rect x="38" y="94" width="344" height="272" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="66" y="140" class="s head">Acoplamiento alto</text><text x="66" y="181" class="s q">¿Cuántos cambios se propagan?</text><text x="66" y="222" class="s copy">Una pieza conoce detalles de muchas.</text><text x="66" y="250" class="s copy"><tspan x="66">Las pruebas requieren</tspan><tspan x="66" dy="24">el sistema entero.</tspan></text><text x="66" y="326" class="s lab" fill="#B95736">CAMBIO DISTRIBUIDO</text></g>
  <g><rect x="38" y="396" width="344" height="272" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="66" y="442" class="s head">Acoplamiento bajo</text><text x="66" y="483" class="s q">¿La dependencia usa un contrato?</text><text x="66" y="524" class="s copy">La pieza conoce solo la interfaz.</text><text x="66" y="552" class="s copy">Un doble sustituye la dependencia.</text><text x="66" y="628" class="s lab" fill="#31536A">CAMBIO LOCALIZADO</text></g>
  <g><rect x="38" y="698" width="344" height="272" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="66" y="744" class="s head">Cohesión baja</text><text x="66" y="785" class="s q">¿Por qué viven juntas?</text><text x="66" y="826" class="s copy">Funciones sin propósito compartido</text><text x="66" y="854" class="s copy">forman un cajón de sastre.</text><text x="66" y="930" class="s lab" fill="#B95736">RESPONSABILIDAD DIFUSA</text></g>
  <g><rect x="38" y="1000" width="344" height="272" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="66" y="1046" class="s head">Cohesión alta</text><text x="66" y="1087" class="s q">¿Todo sirve al mismo propósito?</text><text x="66" y="1128" class="s copy">Reglas y operaciones relacionadas</text><text x="66" y="1156" class="s copy">comparten un componente.</text><text x="66" y="1232" class="s lab" fill="#C59132">RESPONSABILIDAD CLARA</text></g>
  <text x="210" y="1324" class="s foot" text-anchor="middle">Busca cambios localizados,</text><text x="210" y="1354" class="s foot" text-anchor="middle">no fragmentación máxima.</text>
</svg>
