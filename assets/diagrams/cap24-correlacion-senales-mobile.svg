<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1334" role="img" aria-labelledby="title desc"><title id="title">Correlación para explicar un incidente en composición vertical</title><desc id="desc">Un identificador de solicitud y el contexto de traza conectan eventos detallados, comportamiento agregado y causalidad entre servicios.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:16px;font-weight:760;letter-spacing:1.15px;fill:#31536A}.head{font-size:21px;font-weight:760}.copy{font-size:17px;fill:#59636D;text-anchor:middle}.num{font-size:15px;font-weight:780;text-anchor:middle}.foot{font-size:16px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#31536A"/></marker></defs><rect width="420" height="1334" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1302" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">LAS SEÑALES RESPONDEN JUNTAS</text><rect id="cap24-correlacion-senales-mobile-card-1" x="38" y="108" width="344" height="176" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="146" r="20" fill="#31536A"/><text x="72" y="152" class="s num" fill="#fff" data-container="cap24-correlacion-senales-mobile-card-1" data-padding="20">1</text><text x="108" y="152" class="s head" data-container="cap24-correlacion-senales-mobile-card-1" data-padding="20">Pregunta</text><text class="s copy" data-container="cap24-correlacion-senales-mobile-card-1" data-padding="20"><tspan x="210.0" y="216.0">impacto y periodo</tspan></text><path d="M210 284V322" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap24-correlacion-senales-mobile-card-2" x="38" y="330" width="344" height="176" rx="20" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><circle cx="72" cy="368" r="20" fill="#A9A49B"/><text x="72" y="374"