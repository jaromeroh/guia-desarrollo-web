<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Frontera, contrato e implementación de un componente</title><desc id="desc">Otros componentes dependen del contrato visible: entradas, resultados, errores y garantías. La implementación queda oculta y puede cambiar si conserva ese contrato.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:30px;font-weight:760;text-anchor:middle}.copy{font-size:21px;fill:#59636D;text-anchor:middle}.item{font-size:20px;font-weight:700;text-anchor:middle}.lab{font-size:17px;font-weight:760;letter-spacing:1px;text-anchor:middle}</style></defs>
  <rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">LA FRONTERA ES UN CONTRATO</text>
  <rect x="72" y="132" width="1056" height="190" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="600" y="178" class="s head">Lo que otros componentes pueden observar</text>
  <rect x="104" y="214" width="220" height="72" rx="14" fill="#FFFDFA"/><text x="214" y="246" class="s lab">ENTRADAS</text><text x="214" y="272" class="m copy">createUser(data)</text>
  <rect x="356" y="214" width="220" height="72" rx="14" fill="#FFFDFA"/><text x="466" y="246" class="s lab">RESULTADOS</text><text x="466" y="272" class="s copy">usuario creado</text>
  <rect x="608" y="214" width="220" height="72" rx="14" fill="#FFFDFA"/><text x="718" y="246" class="s lab">ERRORES</text><text x="718" y="272" class="s copy">datos inválidos</text>
  <rect x="860" y="214" width="236" height="72" rx="14" fill="#FFFDFA"/><text x="978" y="246" class="s lab">GARANTÍAS</text><text x="978" y="272" class="s copy">unicidad · permisos</text>
  <line x1="72" y1="366" x2="1128" y2="366" stroke="#31536A" stroke-width="4" stroke-dasharray="12 9"/><rect x="468" y="346" width="264" height="42" rx="20" fill="#31536A"/><text x="600" y="374" class="s lab" fill="#fff">FRONTERA ESTABLE</text>
  <rect x="190" y="418" width="820" height="162" rx="22" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="600" y="462" class="s head">Implementación oculta</text><text x="600" y="508" class="s item">validación · consultas · hash de contraseña · registros</text><text x="600" y="548" class="s copy">Puede cambiar sin obligar a cambiar a los consumidores.</text>
  <text x="600" y="638" class="s item">La independencia nace de depender del contrato, no de los detalles internos.</text>
</svg>
