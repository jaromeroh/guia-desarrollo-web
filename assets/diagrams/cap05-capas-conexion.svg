<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Diagnóstico de una petición por capas</title><desc id="desc">DNS, transporte, TLS, HTTP y aplicación o navegador tienen responsabilidades y evidencias distintas. Cada capa puede fallar aunque las anteriores funcionen.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:28px;font-weight:760;text-anchor:middle}.copy{font-size:19px;fill:#59636D;text-anchor:middle}.ev{font-size:17px;font-weight:720;letter-spacing:.6px;fill:#31536A;text-anchor:middle}.foot{font-size:21px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker></defs>
  <rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">DIAGNÓSTICO POR CAPAS</text>
  <text x="600" y="139" class="s head">Una petición funciona solo si cada responsabilidad se cumple</text>
  <path d="M245 300H288 M455 300H498 M665 300H708 M875 300H918" stroke="#31536A" stroke-width="5" marker-end="url(#a)"/>
  <g><rect x="72" y="190" width="174" height="254" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="159" y="242" class="s head">DNS</text><text x="159" y="285" class="s copy">nombre</text><text x="159" y="315" class="s copy">→ dirección</text><rect x="92" y="356" width="134" height="58" rx="12" fill="#FFFDFA"/><text x="159" y="391" class="m ev">registro DNS</text></g>
  <g><rect x="282" y="190" width="174" height="254" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="369" y="242" class="s head">Transporte</text><text x="369" y="285" class="s copy">establece</text><text x="369" y="315" class="s copy">la conexión</text><rect x="302" y="356" width="134" height="58" rx="12" fill="#FFFDFA"/><text x="369" y="391" class="m ev">connect time</text></g>
  <g><rect x="492" y="190" width="174" height="254" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="579" y="242" class="s head">TLS</text><text x="579" y="285" class="s copy">protege y</text><text x="579" y="315" class="s copy">valida el nombre</text><rect x="512" y="356" width="134" height="58" rx="12" fill="#FFFDFA"/><text x="579" y="391" class="m ev">certificado</text></g>
  <g><rect x="702" y="190" width="174" height="254" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="789" y="242" class="s head">HTTP</text><text x="789" y="285" class="s copy">define petición</text><text x="789" y="315" class="s copy">y respuesta</text><rect x="722" y="356" width="134" height="58" rx="12" fill="#FFFDFA"/><text x="789" y="391" class="m ev">estado · headers</text></g>
  <g><rect x="912" y="190" width="216" height="254" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="1020" y="242" class="s head">Uso</text><text x="1020" y="285" class="s copy">aplicación decide;</text><text x="1020" y="315" class="s copy">navegador aplica reglas</text><rect x="936" y="356" width="168" height="58" rx="12" fill="#FFFDFA"/><text x="1020" y="391" class="m ev">logs · consola</text></g>
  <rect x="146" y="498" width="908" height="96" rx="18" fill="#F7F4ED" stroke="#D8D2C7" stroke-width="2"/><text x="600" y="538" class="s foot">“La página no carga” todavía no es un diagnóstico.</text><text x="600" y="570" class="s copy">Localiza la primera capa que no produjo la evidencia esperada.</text>
</svg>
