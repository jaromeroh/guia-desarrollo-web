<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Máquina de estados de un circuit breaker</title>
  <desc id="desc">El circuit breaker pasa de cerrado a abierto cuando los errores alcanzan el umbral. Tras vencer el tiempo de espera pasa a semiabierto. Una prueba exitosa lo cierra y una prueba fallida lo devuelve a abierto.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#59636D"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .tag { font-size: 18px; font-weight: 760; letter-spacing: 2px; fill: #31536A; }
      .state-title { font-size: 30px; font-weight: 750; text-anchor: middle; }
      .state-copy { font-size: 21px; fill: #59636D; text-anchor: middle; }
      .flow { stroke: #59636D; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .failure { stroke: #B95736; stroke-width: 4; fill: none; marker-end: url(#arrow-rust); }
      .label { font-size: 20px; font-weight: 680; fill: #59636D; text-anchor: middle; }
      .failure-label { font-size: 20px; font-weight: 700; fill: #8F3F26; text-anchor: middle; }
      .note { font-size: 19px; fill: #59636D; }
    </style>
  </defs>

  <rect width="1000" height="620" fill="#F2EEE6"/>
  <rect x="38" y="38" width="924" height="544" rx="24" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="72" y="82" class="sans tag">MÁQUINA DE ESTADOS</text>

  <g>
    <circle cx="210" cy="310" r="100" fill="#E8EEF1" stroke="#31536A" stroke-width="4"/>
    <text x="210" y="302" class="sans state-title">Cerrado</text>
    <text x="210" y="338" class="sans state-copy">tráfico normal</text>

    <circle cx="500" cy="310" r="100" fill="#F3E6DF" stroke="#B95736" stroke-width="4"/>
    <text x="500" y="302" class="sans state-title">Abierto</text>
    <text x="500" y="338" class="sans state-copy">rechazar rápido</text>

    <circle cx="790" cy="310" r="100" fill="#F5ECD8" stroke="#B68125" stroke-width="4"/>
    <text x="790" y="302" class="sans state-title">Semiabierto</text>
    <text x="790" y="338" class="sans state-copy">probar el servicio</text>
  </g>

  <path class="failure" d="M300 266 C338 182 382 182 410 266"/>
  <text x="355" y="170" class="sans failure-label">errores ≥ umbral</text>

  <line class="flow" x1="600" y1="310" x2="684" y2="310"/>
  <text x="642" y="278" class="sans label">timeout</text>

  <path class="failure" d="M742 220 C682 112 604 112 548 220"/>
  <text x="645" y="108" class="sans failure-label">prueba fallida</text>

  <path class="flow" d="M742 400 C630 530 370 530 258 400"/>
  <rect x="414" y="474" width="172" height="36" rx="12" fill="#FFFDFA"/>
  <text x="500" y="500" class="sans label">prueba exitosa</text>

  <g transform="translate(86 552)">
    <circle cx="0" cy="0" r="8" fill="#31536A"/>
    <text x="20" y="7" class="sans note">Cerrado permite tráfico</text>
    <circle cx="278" cy="0" r="8" fill="#B95736"/>
    <text x="298" y="7" class="sans note">Abierto protege al sistema</text>
    <circle cx="610" cy="0" r="8" fill="#B68125"/>
    <text x="630" y="7" class="sans note">Semiabierto limita pruebas</text>
  </g>
</svg>
