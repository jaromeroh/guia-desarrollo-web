<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">De un formulario HTML a una petición HTTP</title>
  <desc id="desc">El navegador toma los controles que tienen un atributo name, construye pares de nombre y valor, los codifica en una petición HTTP y la envía al servidor. El servidor procesa la solicitud y devuelve una respuesta.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#31536A"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#59636D"/></marker>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.title{font-size:29px;font-weight:760;text-anchor:middle}.copy{font-size:22px;fill:#59636D;text-anchor:middle}.literal{font-size:22px;text-anchor:middle}.step{font-size:18px;font-weight:760;fill:#FFFDFA;text-anchor:middle;dominant-baseline:central}.flow{stroke:#31536A;stroke-width:4;fill:none;marker-end:url(#arrow)}.return{stroke:#59636D;stroke-width:3.5;stroke-dasharray:10 8;fill:none;marker-end:url(#return-arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#F2EEE6"/>
  <rect x="38" y="38" width="1124" height="684" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="72" y="82" class="sans tag">INTERFAZ Y PROTOCOLO</text>

  <rect x="62" y="144" width="270" height="420" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <circle cx="98" cy="180" r="18" fill="#31536A"/><text x="98" y="180" class="sans step">1</text>
  <text x="197" y="205" class="sans title">Formulario</text>
  <text x="197" y="238" class="sans copy">interfaz visible</text>
  <rect x="92" y="278" width="210" height="72" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="197" y="307" class="sans copy">Buscar productos</text>
  <text x="197" y="333" class="mono literal">name="q"</text>
  <rect x="92" y="372" width="210" height="66" rx="14" fill="#FFFDFA" stroke="#31536A" stroke-width="2"/>
  <text x="197" y="413" class="mono literal">teclado</text>
  <rect x="126" y="464" width="142" height="58" rx="14" fill="#31536A"/>
  <text x="197" y="500" class="sans copy" style="fill:#FFFDFA;font-weight:700">Buscar</text>

  <rect x="382" y="210" width="220" height="286" rx="22" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/>
  <circle cx="416" cy="246" r="18" fill="#31536A"/><text x="416" y="246" class="sans step">2</text>
  <text x="492" y="286" class="sans title">Datos</text>
  <text x="492" y="320" class="sans copy">pares nombre–valor</text>
  <rect x="414" y="356" width="156" height="82" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="492" y="389" class="mono literal">q</text>
  <text x="492" y="418" class="mono literal">teclado</text>
  <text x="492" y="468" class="sans copy">solo viaja lo que tiene name</text>

  <rect x="652" y="174" width="260" height="358" rx="22" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <circle cx="688" cy="210" r="18" fill="#31536A"/><text x="688" y="210" class="sans step">3</text>
  <text x="782" y="250" class="sans title">Petición HTTP</text>
  <text x="782" y="284" class="sans copy">el navegador codifica</text>
  <rect x="682" y="326" width="200" height="126" rx="14" fill="#FFFDFA" stroke="#B68125" stroke-width="2"/>
  <text x="782" y="365" class="mono literal">GET</text>
  <text x="782" y="400" class="mono literal">/buscar</text>
  <text x="782" y="431" class="mono literal">?q=teclado</text>
  <text x="782" y="496" class="sans copy">action + method + datos</text>

  <rect x="962" y="208" width="176" height="290" rx="22" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/>
  <circle cx="994" cy="244" r="18" fill="#B95736"/><text x="994" y="244" class="sans step">4</text>
  <text x="1050" y="290" class="sans title">Servidor</text>
  <text x="1050" y="332" class="sans copy">lee</text>
  <text x="1050" y="366" class="sans copy">valida</text>
  <text x="1050" y="400" class="sans copy">procesa</text>
  <text x="1050" y="456" class="sans copy">devuelve HTML</text>

  <line class="flow" x1="332" y1="354" x2="376" y2="354"/>
  <line class="flow" x1="602" y1="354" x2="646" y2="354"/>
  <line class="flow" x1="912" y1="354" x2="956" y2="354"/>
  <path class="return" d="M1050 504 V608 H197 V570"/>
  <rect x="512" y="590" width="224" height="36" rx="12" fill="#FFFDFA"/>
  <text x="624" y="615" class="sans copy">respuesta y nueva página</text>
  <text x="600" y="678" class="sans copy">El formulario funciona sin JavaScript; el navegador ya conoce el protocolo básico.</text>
</svg>
