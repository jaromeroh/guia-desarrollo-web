<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1280" role="img" aria-labelledby="title desc">
  <title id="title">TDD con un agente · evidencia antes que velocidad</title>
  <desc id="desc">La persona define un comportamiento observable y revisa el riesgo; el agente implementa hasta satisfacer la prueba; ambos refactorizan y amplían la evidencia antes de aceptar el cambio.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="420" height="1280" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="1248" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">TDD CON AGENTES</text><rect id="tdd-mobile-0" x="52" y="92" width="316" height="140" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="tdd-mobile-0" data-padding="18" x="210" y="134" class="sans node-title"><tspan x="210" y="134">1 · Definir</tspan><tspan x="210" dy="32" class="node-copy">ejemplo · riesgo</tspan><tspan x="210" dy="24" class="node-copy">esperado</tspan></text><path class="flow" d="M210 232V289"/><rect id="tdd-mobile-1" x="52" y="297" width="316" height="140" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="tdd-mobile-1" data-padding="18" x="210" y="339" class="sans node-title"><tspan x="210" y="339">2 · Comprobar</tspan><tspan x="210" dy="32" class="node-copy">el test falla</tspan><tspan x="210" dy="24" class="node-copy">sin el cambio</tspan></text><path class="flow" d="M210 437V494"/><rect id="tdd-mobile-2" x="52" y="502" width="316" height="140" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="tdd-mobile-2" data-padding="18" x="210" y="544" class="sans node-title"><tspan x="210" y="544">3 · Construir</tspan><tspan x="210" dy="32" class="node-copy">el agente propone</tspan><tspan x="210" dy="24" class="node-copy">el cambio mínimo</tspan></text><path class="flow" d="M210 642V699"/><rect id="tdd-mobile-3" x="52" y="707" width="316" height="140" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="tdd-mobile-3" data-padding="18" x="210" y="749" class="sans node-title"><tspan x="210" y="749">4 · Evaluar</tspan><tspan x="210" dy="32" class="node-copy">dominio · seguridad</tspan><tspan x="210" dy="24" class="node-copy">alcance · claridad</tspan></text><path class="flow" d="M210 847V904"/><rect id="tdd-mobile-4" x="52" y="912" width="316" height="140" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="tdd-mobile-4" data-padding="18" x="210" y="954" class="sans node-title"><tspan x="210" y="954">5 · Completar</tspan><tspan x="210" dy="32" class="node-copy">límites · bordes</tspan><tspan x="210" dy="24" class="node-copy">regresión</tspan></text><rect id="tdd-mobile-note" x="52" y="1125" width="316" height="105" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2"/><text data-container="tdd-mobile-note" data-padding="16" x="210" y="1160" class="sans node-copy"><tspan x="210">Si aparece un riesgo nuevo,</tspan><tspan x="210" dy="25">vuelve a especificar y comprobar.</tspan></text>
</svg>
