<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 930" role="img" aria-labelledby="title desc">
  <title id="title">Un índice reduce el espacio de búsqueda</title>
  <desc id="desc">Un árbol B compara una clave con nodos ordenados y desciende solo por la rama compatible, en lugar de recorrer todas las filas.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="420" height="930" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="898" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">RUTA DE BÚSQUEDA</text><rect id="bt-mobile-0" x="52" y="110" width="316" height="145" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="bt-mobile-0" data-padding="18" x="210" y="152" class="sans node-title"><tspan x="210" y="152">M</tspan><tspan x="210" dy="32" class="node-copy">P &gt; M · ir a la derecha</tspan></text><path class="risk-flow" d="M210 255V330"/><rect id="bt-mobile-1" x="52" y="340" width="316" height="145" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="bt-mobile-1" data-padding="18" x="210" y="382" class="sans node-title"><tspan x="210" y="382">R · V</tspan><tspan x="210" dy="32" class="node-copy">P &lt; R · ir a la izquierda</tspan></text><path class="risk-flow" d="M210 485V560"/><rect id="bt-mobile-2" x="52" y="570" width="316" height="145" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="bt-mobile-2" data-padding="18" x="210" y="612" class="sans node-title"><tspan x="210" y="612">N–Q</tspan><tspan x="210" dy="32" class="node-copy">Pedro está en este rango</tspan></text><rect id="bt-mobile-note" x="52" y="790" width="316" height="85" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/><text data-container="bt-mobile-note" data-padding="16" x="210" y="825" class="sans node-copy"><tspan x="210">El índice evita recorrer</tspan><tspan x="210" dy="23">cada fila de la tabla.</tspan></text>
</svg>
