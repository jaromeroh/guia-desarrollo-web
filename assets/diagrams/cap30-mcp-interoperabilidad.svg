<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Interoperabilidad mediante MCP</title><desc id="desc">El host conecta un cliente MCP con servidores que publican capacidades; autenticación, consentimiento y políticas siguen perteneciendo al sistema que los integra.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.title{font-size:30px;font-weight:760}.head{font-size:20px;font-weight:760;text-anchor:middle}.copy{font-size:18px;fill:#59636D;text-anchor:middle}.num{font-size:17px;font-weight:780;text-anchor:middle}.foot{font-size:20px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536A"/></marker></defs><rect width="1200" height="720" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">EL PROTOCOLO NO CONCEDE PERMISOS</text><text x="72" y="146" class="s title">Interoperabilidad mediante MCP</text><rect id="cap30-mcp-interoperabilidad-card-1" x="72.0" y="210" width="193.6" height="270" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="168.8" cy="254" r="22" fill="#31536A"/><text x="168.8" y="261" class="s num" fill="#fff" data-container="cap30-mcp-interoperabilidad-card-1" data-padding="20">1</text><text class="s head" data-container="cap30-mcp-interoperabilidad-card-1" data-padding="20"><tspan x="168.8" y="316.0">Persona</tspan></text><text class="s copy" data-container="cap30-mcp-interoperabilidad-card-1" data-padding="20"><tspan x="168.8" y="370.0">intención y</tspan><tspan x="168.8" y="394.0">aprobación</tspan></text><rect id="cap30-mcp-interoperabilidad-card-2" x="287.6" y="210" width="193.6" height="270" rx="22" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><circle cx="384.4" cy="254" r="22" fill="#A9A49B"/><text x="384.4" y="261" class="s num" fill="#fff" data-container="cap30-mcp-interoperabilidad-card-2" data-padding="20">2</text><text class="s head" data-container="cap30-mcp-interoperabilidad-card-2" data-padding="20"><tspan x="384.4" y="316.0">Host</tspan></text><text class="s copy" data-container="cap30-mcp-interoperabilidad-card-2" data-padding="20"><tspan x="384.4" y="358.0">contexto ·</tspan><tspan x="384.4" y="382.0">política ·</tspan><tspan x="384.4" y="406.0">modelo</tspan></text><rect id="cap30-mcp-interoperabilidad-card-3" x="503.2" y="210" width="193.6" height="270" rx="22" fill="#F5ECD8" stroke="#C59132" stroke-width="3"/><circle cx="600.0" cy="254" r="22" fill="#C59132"/><text x="600.0" y="261" class="s num" fill="#fff" data-container="cap30-mcp-interoperabilidad-card-3" data-padding="20">3</text><text class="s head" data-container="cap30-mcp-interoperabilidad-card-3" data-padding="20"><tspan x="600.0" y="316.0">Cliente MCP</tspan></text><text class="s copy" data-container="cap30-mcp-interoperabilidad-card-3" data-padding="20"><tspan x="600.0" y="370.0">negocia</tspan><tspan x="600.0" y="394.0">capacidades</tspan></text><rect id="cap30-mcp-interoperabilidad-card-4" x="718.8" y="210" width="193.6" height="270" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="815.6" cy="254" r="22" fill="#31536A"/><text x="815.6" y="261" class="s num" fill="#fff" data-container="cap30-mcp-interoperabilidad-card-4" data-padding="20">4</text><text class="s head" data-container="cap30-mcp-interoperabilidad-card-4" data-padding="20"><tspan x="815.6" y="316.0">Servidor MCP</tspan></text><text class="s copy" data-container="cap30-mcp-interoperabilidad-card-4" data-padding="20"><tspan x="815.6" y="358.0">tools ·</tspan><tspan x="815.6" y="382.0">resources ·</tspan><tspan x="815.6" y="406.0">prompts</tspan></text><rect id="cap30-mcp-interoperabilidad-card-5" x="934.4" y="210" w