<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc">
  <title id="title">Capas conceptuales de una aplicación web</title>
  <desc id="desc">La presentación se comunica con la API, que traduce el contrato externo hacia la lógica de negocio. La lógica usa acceso a datos y este se comunica con mecanismos de persistencia o servicios externos. Las respuestas regresan hacia la presentación.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#31536A"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636D"/></marker>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:18px;font-weight:760;letter-spacing:2px;fill:#31536A}.title{font-size:30px;font-weight:750;text-anchor:middle}.copy{font-size:21px;fill:#59636D;text-anchor:middle}.boundary{font-size:16px;font-weight:700;letter-spacing:1px;fill:#59636D;text-anchor:middle}.flow{stroke:#31536A;stroke-width:4;fill:none;marker-end:url(#arrow)}.response{stroke:#59636D;stroke-width:3.5;stroke-dasharray:10 8;fill:none;marker-end:url(#return-arrow)}
    </style>
  </defs>
  <rect width="760" height="1040" fill="#F2EEE6"/>
  <rect x="34" y="34" width="692" height="972" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="68" y="80" class="sans tag">RESPONSABILIDADES POR CAPA</text>

  <text x="63" y="178" class="sans boundary" transform="rotate(-90 63 178)">CLIENTE</text>
  <rect x="110" y="110" width="540" height="126" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="380" y="160" class="sans title">Presentación</text>
  <text x="380" y="197" class="sans copy">estructura, interacción y estado visible</text>

  <line x1="84" y1="260" x2="676" y2="260" stroke="#B95736" stroke-width="3" stroke-dasharray="10 9"/>

  <text x="63" y="566" class="sans boundary" transform="rotate(-90 63 566)">APLICACIÓN</text>
  <rect x="110" y="300" width="540" height="126" rx="20" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/>
  <text x="380" y="350" class="sans title">API</text>
  <text x="380" y="387" class="sans copy">contrato, autenticación y validación de entrada</text>

  <rect x="110" y="478" width="540" height="126" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/>
  <text x="380" y="528" class="sans title">Lógica de negocio</text>
  <text x="380" y="565" class="sans copy">reglas, casos de uso y decisiones del dominio</text>

  <rect x="110" y="656" width="540" height="126" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="380" y="706" class="sans title">Acceso a datos</text>
  <text x="380" y="743" class="sans copy">traduce operaciones hacia dependencias</text>

  <line x1="84" y1="812" x2="676" y2="812" stroke="#A9A49B" stroke-width="3" stroke-dasharray="10 9"/>

  <rect x="110" y="850" width="540" height="126" rx="20" fill="#FFFDFA" stroke="#31536A" stroke-width="3"/>
  <text x="380" y="900" class="sans title">Persistencia y servicios</text>
  <text x="380" y="937" class="sans copy">base de datos, caché, objetos y APIs externas</text>

  <line class="flow" x1="330" y1="236" x2="330" y2="294"/>
  <line class="flow" x1="330" y1="426" x2="330" y2="472"/>
  <line class="flow" x1="330" y1="604" x2="330" y2="650"/>
  <line class="flow" x1="330" y1="782" x2="330" y2="844"/>
  <path class="response" d="M430 850 V788 M430 656 V610 M430 478 V432 M430 300 V242"/>
  <rect x="278" y="244" width="204" height="30" rx="10" fill="#FFFDFA"/>
  <text x="380" y="265" class="sans boundary">FRONTERA DE RED</text>
  <rect x="292" y="796" width="176" height="30" rx="10" fill="#FFFDFA"/>
  <text x="380" y="817" class="sans boundary">INFRAESTRUCTURA</text>
</svg>
