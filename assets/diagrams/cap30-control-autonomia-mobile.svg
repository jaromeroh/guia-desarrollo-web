<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1334" role="img" aria-labelledby="title desc"><title id="title">Superficie de control de un agente en composición vertical</title><desc id="desc">El control efectivo combina un alcance explícito, contexto limitado, permisos mínimos, aprobaciones para efectos sensibles y evidencia que permita detener o revertir.</desc><defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:16px;font-weight:760;letter-spacing:1.15px;fill:#31536A}.head{font-size:21px;font-weight:760}.copy{font-size:17px;fill:#59636D;text-anchor:middle}.num{font-size:15px;font-weight:780;text-anchor:middle}.foot{font-size:16px;font-weight:700;text-anchor:middle}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#31536A"/></marker></defs><rect width="420" height="1334" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1302" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">LA AUTONOMÍA SE DISEÑA POR CAPAS</text><rect id="cap30-control-autonomia-mobile-card-1" x="38" y="108" width="344" height="176" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="146" r="20" fill="#31536A"/><text x="72" y="152" class="s num" fill="#fff" data-container="cap30-control-autonomia-mobile-card-1" data-padding="20">1</text><text x="108" y="152" class="s head" data-container="cap30-control-autonomia-mobile-card-1" data-padding="20">Alcance</text><text class="s copy" data-container="cap30-control-autonomia-mobile-card-1" data-padding="20"><tspan x="210.0" y="216.0">objetivo y exclusiones</tspan></text><path d="M210 284V322" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap30-control-autonomia-mobile-card-2" x="38" y="330" width="344" height="176" rx="20" fill="#FFFDFA" stroke="#A9A49B" stroke-width="3"/><circle cx="72" cy="368" r="20" fill="#A9A49B"/><text x="72" y="374" class="s num" fill="#fff" data-container="cap30-control-autonomia-mobile-card-2" data-padding="20">2</text><text x="108" y="374" class="s head" data-container="cap30-control-autonomia-mobile-card-2" data-padding="20">Contexto</text><text class="s copy" data-container="cap30-control-autonomia-mobile-card-2" data-padding="20"><tspan x="210.0" y="438.0">mínimo suficiente</tspan></text><path d="M210 506V544" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap30-control-autonomia-mobile-card-3" x="38" y="552" width="344" height="176" rx="20" fill="#F5ECD8" stroke="#C59132" stroke-width="3"/><circle cx="72" cy="590" r="20" fill="#C59132"/><text x="72" y="596" class="s num" fill="#fff" data-container="cap30-control-autonomia-mobile-card-3" data-padding="20">3</text><text x="108" y="596" class="s head" data-container="cap30-control-autonomia-mobile-card-3" data-padding="20">Permisos</text><text class="s copy" data-container="cap30-control-autonomia-mobile-card-3" data-padding="20"><tspan x="210.0" y="660.0">leer · actuar · denegar</tspan></text><path d="M210 728V766" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap30-control-autonomia-mobile-card-4" x="38" y="774" width="344" height="176" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><circle cx="72" cy="812" r="20" fill="#31536A"/><text x="72" y="818" class="s num" fill="#fff" data-container="cap30-control-autonomia-mobile-card-4" data-padding="20">4</text><text x="108" y="818" class="s head" data-container="cap30-control-autonomia-mobile-card-4" data-padding="20">Aprobaciones</text><text class="s copy" data-container="cap30-control-autonomia-mobile-card-4" data-padding="20"><tspan x="210.0" y="882.0">efectos sensibles</tspan></text><path d="M210 950V988" stroke="#31536A" stroke-width="4" marker-end="url(#a)"/><rect id="cap30-control-autonomia-mobile-card-5" x="38" y="996" width="344" height="176" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><circle cx="72" cy="1034" r="20" fill="#B95736"/><text x="72" y="1040" class="s num" fill="#fff" data-container="cap30-control-autonomia-mobile-card-5" data-padding="20">5</text><text x="108" y="1040" class="s head" data-container="cap30-control-autonomia-mobile-card-5" data-padding="20">Evidencia y parada</text><text class="s copy" data-container="cap30-control-autonomia-mobile-card-5" data-padding="20"><tspan x="210.0" y="1104.0">logs · pruebas · límites</tspan></text><text class="s foot"><tspan x="210.0" y="1204.0">Más autonomía solo es razonable</tspan><tspan x="210.0" y="1228.0">cuando el trabajo es acotado,</tspan><tspan x="210.0" y="1252.0">observable y recuperable.</tspan></text></svg>