<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Diferencia entre media queries y container queries</title>
  <desc id="desc">Las media queries consultan el viewport o las preferencias del entorno para tomar decisiones de página. Las container queries consultan el espacio disponible del componente para adaptar su composición local.</desc>
  <defs>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.heading{font-size:30px;font-weight:760;text-anchor:middle}.copy{font-size:22px;fill:#59636D;text-anchor:middle}.item{font-size:22px;font-weight:700;text-anchor:middle}.label{font-size:18px;font-weight:760;letter-spacing:1.2px;fill:#31536A;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F2EEE6"/>
  <rect x="38" y="38" width="1124" height="644" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="72" y="84" class="sans tag">DOS PREGUNTAS, DOS ALCANCES</text>

  <rect x="70" y="126" width="500" height="474" rx="24" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="320" y="176" class="mono heading">@media</text>
  <text x="320" y="214" class="sans copy">¿qué permite el entorno?</text>
  <rect x="110" y="254" width="420" height="112" rx="18" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="320" y="292" class="sans label">ALCANCE: PÁGINA</text>
  <text x="320" y="334" class="sans item">viewport · color · movimiento</text>
  <rect x="110" y="398" width="420" height="150" rx="18" fill="#F7F4ED" stroke="#A9A49B" stroke-width="2"/>
  <text x="320" y="438" class="sans copy">Ejemplos</text>
  <text x="320" y="478" class="sans item">mostrar la barra lateral</text>
  <text x="320" y="516" class="sans item">reducir movimiento</text>

  <rect x="630" y="126" width="500" height="474" rx="24" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="880" y="176" class="mono heading">@container</text>
  <text x="880" y="214" class="sans copy">¿qué espacio tiene el componente?</text>
  <rect x="670" y="254" width="420" height="112" rx="18" fill="#FFFDFA" stroke="#B68125" stroke-width="2"/>
  <text x="880" y="292" class="sans label">ALCANCE: COMPONENTE</text>
  <text x="880" y="334" class="sans item">contenedor local disponible</text>
  <rect x="670" y="398" width="118" height="150" rx="16" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="729" y="430" class="sans label">LATERAL</text><rect x="694" y="456" width="70" height="64" rx="9" fill="#E8EEF1"/>
  <rect x="804" y="398" width="150" height="150" rx="16" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="879" y="430" class="sans label">PRINCIPAL</text><rect x="830" y="456" width="98" height="64" rx="9" fill="#E8EEF1"/>
  <rect x="970" y="398" width="120" height="150" rx="16" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2"/>
  <text x="1030" y="430" class="sans label">MODAL</text><rect x="992" y="456" width="76" height="64" rx="9" fill="#E8EEF1"/>
  <text x="600" y="650" class="sans copy">La decisión vive donde nace la restricción: en la página o en el componente.</text>
</svg>
