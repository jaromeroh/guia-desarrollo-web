<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 980" role="img" aria-labelledby="title desc">
  <title id="title">Dos decisiones arquitectónicas en composición móvil</title>
  <desc id="desc">Primero se decide cómo agrupar responsabilidades, desde una aplicación principal hasta servicios autónomos. Después se decide cómo aprovisionar ejecución, desde capacidad duradera hasta activación por eventos. Las decisiones pueden combinarse.</desc>
  <style>
    .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:14px;font-weight:760;letter-spacing:1.5px;fill:#31536A}.question{font-size:20px;font-weight:760}.end{font-size:15px;font-weight:700}.copy{font-size:14px;fill:#59636D}.combo{font-size:18px;font-weight:750}.combo-copy{font-size:14px;fill:#59636D}
  </style>
  <rect width="420" height="980" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="948" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/>
  <text x="36" y="50" class="sans tag">DOS DECISIONES INDEPENDIENTES</text>

  <rect x="36" y="78" width="348" height="156" rx="18" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/>
  <text x="56" y="116" class="sans question">1. Agrupar responsabilidades</text>
  <text x="56" y="158" class="sans end">App principal</text>
  <text x="364" y="158" class="sans end" text-anchor="end">Servicios</text>
  <line x1="174" y1="180" x2="276" y2="180" stroke="#31536A" stroke-width="3"/>
  <circle cx="174" cy="180" r="5" fill="#31536A"/><circle cx="276" cy="180" r="5" fill="#31536A"/>
  <text x="56" y="212" class="sans copy">Delimitación interna → autonomía de despliegue</text>

  <rect x="36" y="264" width="348" height="156" rx="18" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/>
  <text x="56" y="302" class="sans question">2. Aprovisionar ejecución</text>
  <text x="56" y="344" class="sans end">Capacidad duradera</text>
  <text x="364" y="344" class="sans end" text-anchor="end">Por eventos</text>
  <line x1="192" y1="366" x2="276" y2="366" stroke="#B68125" stroke-width="3"/>
  <circle cx="192" cy="366" r="5" fill="#B68125"/><circle cx="276" cy="366" r="5" fill="#B68125"/>
  <text x="56" y="400" class="sans copy">Procesos · contenedores · funciones · isolates</text>

  <text x="36" y="468" class="sans tag">COMBINACIONES POSIBLES</text>
  <rect x="36" y="494" width="348" height="100" rx="16" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/>
  <text x="56" y="530" class="sans combo">Aplicación modular</text>
  <text x="56" y="562" class="sans combo-copy">un proceso o contenedor principal</text>
  <rect x="36" y="614" width="348" height="100" rx="16" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/>
  <text x="56" y="650" class="sans combo">Servicios desplegables</text>
  <text x="56" y="670" class="sans combo-copy"><tspan x="56">varios procesos con red</tspan><tspan x="56" dy="24">y operación distribuida</tspan></text>
  <rect x="36" y="734" width="348" height="100" rx="16" fill="#F7F4ED" stroke="#A9A49B" stroke-width="2.5"/>
  <text x="56" y="770" class="sans combo">Artefactos generados</text>
  <text x="56" y="798" class="sans combo-copy">estáticos, funciones o edge</text>
  <text x="56" y="820" class="sans combo-copy">desde una base de código</text>
  <rect x="36" y="854" width="348" height="82" rx="16" fill="#F5ECD8" stroke="#B68125" stroke-width="2.5"/>
  <text x="56" y="890" class="sans combo">Servicios por evento</text>
  <text x="56" y="920" class="sans combo-copy">colas, funciones y consumidores coordinados</text>
</svg>
