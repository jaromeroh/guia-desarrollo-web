<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1110" role="img" aria-labelledby="title desc">
  <title id="title">Constructor y jardinero · dos formas de intervenir</title>
  <desc id="desc">La mentalidad de constructor controla cada paso de una implementación; la de jardinero prepara contexto, límites y evidencia para orientar resultados variables. El trabajo real combina ambas según el riesgo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="420" height="1110" fill="#F2EEE6"/>
  <rect x="16" y="16" width="388" height="1078" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/>
  <text x="38" y="58" class="sans tag">CONTROL DIRECTO · CONDICIONES</text><rect id="bg-mobile-0" x="52" y="92" width="316" height="210" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="bg-mobile-0" data-padding="18" x="210" y="134" class="sans node-title"><tspan x="210" y="134">Constructor</tspan><tspan x="210" dy="32" class="node-copy">decide cada paso</tspan><tspan x="210" dy="24" class="node-copy">depura código y estado</tspan><tspan x="210" dy="24" class="node-copy">prueba el programa</tspan></text><path class="flow" d="M210 302V369"/><rect id="bg-mobile-1" x="52" y="377" width="316" height="210" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="bg-mobile-1" data-padding="18" x="210" y="419" class="sans node-title"><tspan x="210" y="419">Jardinero</tspan><tspan x="210" dy="32" class="node-copy">prepara contexto y límites</tspan><tspan x="210" dy="24" class="node-copy">observa herramientas y salida</tspan><tspan x="210" dy="24" class="node-copy">ajusta con evidencia</tspan></text><path class="flow" d="M210 587V654"/><rect id="bg-mobile-2" x="52" y="662" width="316" height="210" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="bg-mobile-2" data-padding="18" x="210" y="704" class="sans node-title"><tspan x="210" y="704">Decisión</tspan><tspan x="210" dy="32" class="node-copy">combinar según riesgo</tspan><tspan x="210" dy="24" class="node-copy">reversibilidad y oráculo</tspan></text><rect id="bg-mobile-note" x="52" y="935" width="316" height="110" rx="14" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text data-container="bg-mobile-note" data-padding="16" x="210" y="970" class="sans node-copy"><tspan x="210">Delegar la construcción no delega</tspan><tspan x="210" dy="25">la responsabilidad por</tspan><tspan x="210" dy="25">el resultado del sistema.</tspan></text>
</svg>
