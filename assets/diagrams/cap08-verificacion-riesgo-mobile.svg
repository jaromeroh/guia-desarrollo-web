<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1450" role="img" aria-labelledby="title desc">
  <title id="title">Verificación según riesgo en composición vertical</title><desc id="desc">Cuatro combinaciones de impacto e incertidumbre indican desde comprobaciones rápidas hasta autoridad limitada, aprobación experta y recuperación ensayada.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:15px;font-weight:760;letter-spacing:1.2px;fill:#31536A}.head{font-size:21px;font-weight:760}.q{font-size:16px;font-weight:700}.copy{font-size:15px;fill:#59636D}.lab{font-size: 14px;font-weight:760;letter-spacing:.8px}.foot{font-size:17px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="420" height="1450" fill="#F2EEE6"/><rect x="16" y="16" width="388" height="1418" rx="22" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text x="38" y="58" class="s tag">IMPACTO × INCERTIDUMBRE</text>
  <g><rect x="38" y="94" width="344" height="284" rx="20" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="66" y="136" class="s lab" fill="#31536A">BAJO IMPACTO · BAJA INCERTIDUMBRE</text><text x="66" y="180" class="s head">Comprobaciones rápidas</text><text x="66" y="222" class="s q">Automatizar un cambio reversible</text><text x="66" y="264" class="s copy">diff acotado · tipos · tests existentes</text><text x="66" y="306" class="s copy">revisión por muestreo si corresponde</text><text x="66" y="348" class="s copy">Ej.: formato o reemplazo mecánico</text></g>
  <g><rect x="38" y="408" width="344" height="284" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="66" y="450" class="s lab" fill="#C59132">BAJO IMPACTO · ALTA INCERTIDUMBRE</text><text x="66" y="494" class="s head">Exploración aislada</text><text x="66" y="536" class="s q">No confundir prototipo con solución</text><text x="66" y="578" class="s copy">hipótesis · observación · detención</text><text x="66" y="620" class="s copy">Ej.: investigar un fallo incierto</text></g>
  <g><rect x="38" y="722" width="344" height="284" rx="20" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="66" y="764" class="s lab" fill="#C59132">ALTO IMPACTO · BAJA INCERTIDUMBRE</text><text x="66" y="808" class="s head">Controles y recuperación</text><text x="66" y="850" class="s q">Ejecutar un procedimiento conocido</text><text x="66" y="892" class="s copy">pruebas · revisión · despliegue gradual</text><text x="66" y="934" class="s copy">Ej.: migración incremental de datos</text></g>
  <g><rect x="38" y="1036" width="344" height="284" rx="20" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="66" y="1078" class="s lab" fill="#B95736">ALTO IMPACTO · ALTA INCERTIDUMBRE</text><text x="66" y="1122" class="s head">Autoridad limitada</text><text x="66" y="1164" class="s q">Exigir aprobación y revisión experta</text><text x="66" y="1206" class="s copy">solo lectura · entorno seguro</text><text x="66" y="1248" class="s copy">recuperación ensayada</text><text x="66" y="1290" class="s copy">Ej.: autenticación, pagos o producción</text></g>
  <text x="210" y="1382" class="s foot" text-anchor="middle">El riesgo define evidencia y permisos.</text>
</svg>
