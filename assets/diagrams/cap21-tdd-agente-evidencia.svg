<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TDD con un agente · evidencia antes que velocidad</title>
  <desc id="desc">La persona define un comportamiento observable y revisa el riesgo; el agente implementa hasta satisfacer la prueba; ambos refactorizan y amplían la evidencia antes de aceptar el cambio.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">TDD con un agente · evidencia antes que velocidad</text>
  <text x="48" y="91" class="sans subtitle">La prueba es un criterio verificable, no una garantía completa</text><rect id="tdd-step-0" x="35" y="225" width="205" height="175" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="tdd-step-0" data-padding="18" x="137.5" y="267" class="sans node-title"><tspan x="137.5" y="267">1 · Definir</tspan><tspan x="137.5" dy="32" class="node-copy">ejemplo · riesgo</tspan><tspan x="137.5" dy="24" class="node-copy">esperado</tspan></text><path class="flow" d="M240 312H263"/><rect id="tdd-step-1" x="267" y="225" width="205" height="175" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="tdd-step-1" data-padding="18" x="369.5" y="267" class="sans node-title"><tspan x="369.5" y="267">2 · Comprobar</tspan><tspan x="369.5" dy="32" class="node-copy">el test falla</tspan><tspan x="369.5" dy="24" class="node-copy">sin el cambio</tspan></text><path class="flow" d="M472 312H495"/><rect id="tdd-step-2" x="499" y="225" width="205" height="175" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="tdd-step-2" data-padding="18" x="601.5" y="267" class="sans node-title"><tspan x="601.5" y="267">3 · Construir</tspan><tspan x="601.5" dy="32" class="node-copy">el agente propone</tspan><tspan x="601.5" dy="24" class="node-copy">el cambio mínimo</tspan></text><path class="flow" d="M704 312H727"/><rect id="tdd-step-3" x="731" y="225" width="205" height="175" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="tdd-step-3" data-padding="18" x="833.5" y="267" class="sans node-title"><tspan x="833.5" y="267">4 · Evaluar</tspan><tspan x="833.5" dy="32" class="node-copy">dominio · seguridad</tspan><tspan x="833.5" dy="24" class="node-copy">alcance · claridad</tspan></text><path class="flow" d="M936 312H959"/><rect id="tdd-step-4" x="963" y="225" width="205" height="175" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="tdd-step-4" data-padding="18" x="1065.5" y="267" class="sans node-title"><tspan x="1065.5" y="267">5 · Completar</tspan><tspan x="1065.5" dy="32" class="node-copy">límites · bordes</tspan><tspan x="1065.5" dy="24" class="node-copy">regresión</tspan></text><path class="risk-flow" d="M1065 400V525H140V404"/><rect id="tdd-loop" x="465" y="507" width="270" height="36" rx="8" fill="#FFFDFA"/><text data-container="tdd-loop" data-padding="6" x="600" y="531" class="sans label">nuevo riesgo o caso descubierto</text><rect id="tdd-note" x="225" y="585" width="750" height="80" rx="14" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text data-container="tdd-note" data-padding="16" x="600" y="618" class="sans node-copy"><tspan x="600">Un test puede aprobar una especificación incompleta.</tspan><tspan x="600" dy="25">La revisión humana decide si la evidencia representa el problema real.</tspan></text>
</svg>
