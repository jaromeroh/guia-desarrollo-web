<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Una feature flag también tiene ciclo de vida</title>
  <desc id="desc">El equipo crea una bandera con propietario y fecha de retiro, despliega el código inactivo, habilita por cohortes y señales, decide expandir o apagar, y finalmente elimina ambas rutas.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#31536A"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B95736"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20262E; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #20262E; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #72706C; }
      .tag { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #31536A; }
      .node-title { font-size: 19px; font-weight: 720; text-anchor: middle; }
      .node-copy { font-size: 15px; fill: #59636D; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 680; text-anchor: middle; }
      .small { font-size: 14px; fill: #72706C; }
      .flow { fill: none; stroke: #31536A; stroke-width: 3; marker-end: url(#arrow); }
      .risk-flow { fill: none; stroke: #B95736; stroke-width: 3; marker-end: url(#arrow-rust); }
      .relation { fill: none; stroke: #59636D; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F2EEE6"/>
  <text x="48" y="60" class="sans title">Una feature flag también tiene ciclo de vida</text>
  <text x="48" y="91" class="sans subtitle">Deploy no es release; una bandera temporal necesita retirada</text><rect id="flag-step-0" x="35" y="225" width="205" height="175" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="flag-step-0" data-padding="18" x="137.5" y="267" class="sans node-title"><tspan x="137.5" y="267">1 · Definir</tspan><tspan x="137.5" dy="32" class="node-copy">dueño · propósito</tspan><tspan x="137.5" dy="24" class="node-copy">caducidad</tspan></text><path class="flow" d="M240 312H263"/><rect id="flag-step-1" x="267" y="225" width="205" height="175" rx="14" fill="#FFFDFA" stroke="#A9A49B" stroke-width="2.5"/><text data-container="flag-step-1" data-padding="18" x="369.5" y="267" class="sans node-title"><tspan x="369.5" y="267">2 · Desplegar</tspan><tspan x="369.5" dy="32" class="node-copy">ruta nueva apagada</tspan><tspan x="369.5" dy="24" class="node-copy">ruta estable activa</tspan></text><path class="flow" d="M472 312H495"/><rect id="flag-step-2" x="499" y="225" width="205" height="175" rx="14" fill="#F5ECD8" stroke="#C59132" stroke-width="2.5"/><text data-container="flag-step-2" data-padding="18" x="601.5" y="267" class="sans node-title"><tspan x="601.5" y="267">3 · Exponer</tspan><tspan x="601.5" dy="32" class="node-copy">cohorte estable</tspan><tspan x="601.5" dy="24" class="node-copy">señales del grupo</tspan></text><path class="flow" d="M704 312H727"/><rect id="flag-step-3" x="731" y="225" width="205" height="175" rx="14" fill="#F3E6DF" stroke="#B95736" stroke-width="2.5"/><text data-container="flag-step-3" data-padding="18" x="833.5" y="267" class="sans node-title"><tspan x="833.5" y="267">4 · Decidir</tspan><tspan x="833.5" dy="32" class="node-copy">expandir, pausar</tspan><tspan x="833.5" dy="24" class="node-copy">o desactivar</tspan></text><path class="flow" d="M936 312H959"/><rect id="flag-step-4" x="963" y="225" width="205" height="175" rx="14" fill="#E8EEF1" stroke="#31536A" stroke-width="2.5"/><text data-container="flag-step-4" data-padding="18" x="1065.5" y="267" class="sans node-title"><tspan x="1065.5" y="267">5 · Retirar</tspan><tspan x="1065.5" dy="32" class="node-copy">borrar flag</tspan><tspan x="1065.5" dy="24" class="node-copy">y código obsoleto</tspan></text><path class="risk-flow" d="M825 400V500H370V404"/><rect id="flag-off" x="485" y="482" width="225" height="36" rx="8" fill="#FFFDFA"/><text data-container="flag-off" data-padding="6" x="597.5" y="506" class="sans label">señal adversa · apagar</text><rect id="flag-note" x="225" y="575" width="750" height="90" rx="14" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2"/><text data-container="flag-note" data-padding="16" x="600" y="610" class="sans node-copy"><tspan x="600">Un kill switch reduce exposición, pero no revierte datos</tspan><tspan x="600" dy="25">ni sustituye la corrección y la investigación del incidente.</tspan></text>
</svg>
