<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Problemas distintos de seguridad en el navegador</title><desc id="desc">La política del mismo origen limita lecturas entre orígenes, CORS autoriza compartir respuestas, CSRF evita acciones autenticadas no intencionadas y CSP restringe recursos que pueden cargarse o ejecutarse.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:29px;font-weight:760}.q{font-size:22px;font-weight:720}.copy{font-size:20px;fill:#59636D}.lab{font-size:17px;font-weight:760;letter-spacing:1px}.foot{font-size:22px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="1200" height="820" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="744" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">CUATRO MECANISMOS, CUATRO PREGUNTAS</text>
  <g><rect x="72" y="122" width="510" height="236" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="104" y="168" class="s head">Política del mismo origen</text><text x="104" y="210" class="s q">¿Puede este script leer el otro origen?</text><text x="104" y="252" class="s copy">Por defecto, limita acceso programático</text><text x="104" y="282" class="s copy">que expondría datos entre compartimentos.</text><text x="104" y="326" class="s lab" fill="#31536A">RESTRICCIÓN BASE DEL NAVEGADOR</text></g>
  <g><rect x="618" y="122" width="510" height="236" rx="22" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="650" y="168" class="s head">CORS</text><text x="650" y="202" class="s q"><tspan x="650">¿Autoriza el servidor compartir</tspan><tspan x="650" dy="28">la respuesta?</tspan></text><text x="650" y="266" class="s copy">Cabeceras HTTP conceden acceso a un origen.</text><text x="650" y="296" class="s copy">No autentica ni autoriza la operación.</text><text x="650" y="334" class="s lab" fill="#C59132">PERMISO DE LECTURA ENTRE ORÍGENES</text></g>
  <g><rect x="72" y="394" width="510" height="236" rx="22" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="104" y="440" class="s head">CSRF</text><text x="104" y="482" class="s q">¿El usuario quiso enviar esta acción?</text><text x="104" y="524" class="s copy">Un sitio malicioso intenta aprovechar</text><text x="104" y="554" class="s copy">credenciales que el navegador adjunta.</text><text x="104" y="598" class="s lab" fill="#B95736">INTENCIÓN DE UNA ACCIÓN AUTENTICADA</text></g>
  <g><rect x="618" y="394" width="510" height="236" rx="22" fill="#F7F4ED" stroke="#A9A49B" stroke-width="3"/><text x="650" y="440" class="s head">CSP</text><text x="650" y="482" class="s q">¿Qué recursos pueden cargarse o ejecutarse?</text><text x="650" y="524" class="s copy">Una política restringe scripts, estilos,</text><text x="650" y="554" class="s copy">conexiones, marcos y otras fuentes.</text><text x="650" y="598" class="s lab" fill="#59636D">DEFENSA EN PROFUNDIDAD</text></g>
  <text x="600" y="700" class="s foot">Ninguno sustituye la autenticación ni la autorización del servidor.</text><text x="600" y="738" class="s copy" text-anchor="middle">Primero identifica la pregunta de seguridad; después elige el control.</text>
</svg>
