<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Acoplamiento y cohesión como dimensiones distintas</title><desc id="desc">El acoplamiento observa dependencias entre componentes; la cohesión observa relación interna. Un diseño busca cambios localizados mediante bajo acoplamiento y alta cohesión, sin fragmentar sin límite.</desc>
  <defs><style>.s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20262E}.tag{font-size:21px;font-weight:760;letter-spacing:2px;fill:#31536A}.head{font-size:28px;font-weight:760}.q{font-size:21px;font-weight:700}.copy{font-size:19px;fill:#59636D}.lab{font-size:16px;font-weight:760;letter-spacing:1px}.foot{font-size:22px;font-weight:700;text-anchor:middle}</style></defs>
  <rect width="1200" height="780" fill="#F2EEE6"/><rect x="38" y="38" width="1124" height="704" rx="26" fill="#FFFDFA" stroke="#D8D2C7" stroke-width="2.5"/><text x="72" y="84" class="s tag">DOS DIMENSIONES DEL DISEÑO</text>
  <g><rect x="72" y="122" width="510" height="238" rx="22" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="104" y="168" class="s head">Acoplamiento alto</text><text x="104" y="208" class="s q">¿Cuántos cambios se propagan?</text><text x="104" y="250" class="s copy">A conoce detalles de B, C y D.</text><text x="104" y="282" class="s copy">Probar una pieza exige levantar las demás.</text><text x="104" y="328" class="s lab" fill="#B95736">CAMBIO DISTRIBUIDO</text></g>
  <g><rect x="618" y="122" width="510" height="238" rx="22" fill="#E8EEF1" stroke="#31536A" stroke-width="3"/><text x="650" y="168" class="s head">Acoplamiento bajo</text><text x="650" y="208" class="s q">¿La dependencia pasa por un contrato?</text><text x="650" y="250" class="s copy">A conoce la interfaz necesaria de B.</text><text x="650" y="282" class="s copy">Un doble puede sustituir B en una prueba.</text><text x="650" y="328" class="s lab" fill="#31536A">CAMBIO LOCALIZADO</text></g>
  <g><rect x="72" y="396" width="510" height="238" rx="22" fill="#F3E6DF" stroke="#B95736" stroke-width="3"/><text x="104" y="442" class="s head">Cohesión baja</text><text x="104" y="482" class="s q">¿Por qué viven juntas estas funciones?</text><text x="104" y="524" class="s copy">Fechas, correo, impuestos e imágenes</text><text x="104" y="556" class="s copy">terminan en un cajón de sastre.</text><text x="104" y="602" class="s lab" fill="#B95736">RESPONSABILIDAD DIFUSA</text></g>
  <g><rect x="618" y="396" width="510" height="238" rx="22" fill="#F5ECD8" stroke="#B68125" stroke-width="3"/><text x="650" y="442" class="s head">Cohesión alta</text><text x="650" y="482" class="s q">¿Todo contribuye al mismo propósito?</text><text x="650" y="524" class="s copy">Crear, actualizar y consultar usuarios</text><text x="650" y="556" class="s copy">comparten reglas y lenguaje.</text><text x="650" y="602" class="s lab" fill="#C59132">RESPONSABILIDAD CLARA</text></g>
  <text x="600" y="692" class="s foot">Objetivo: cambios localizados, no la fragmentación máxima.</text>
</svg>
