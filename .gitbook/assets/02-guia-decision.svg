  <text x="160.0" y="290.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">▶ MICROSERVICIOS</text>
  <line x1="125.0" y1="340.0" x2="125.0" y2="350.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="125.0" y1="350.0" x2="155.0" y2="350.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <text x="160.0" y="350.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">▶ MICROSERVICIOS (o monolito + servicios auxiliares)</text>
  <line x1="125.0" y1="400.0" x2="125.0" y2="410.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="125.0" y1="410.0" x2="155.0" y2="410.0"
