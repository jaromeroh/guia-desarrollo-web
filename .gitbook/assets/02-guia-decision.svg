  <line x1="125.0" y1="220.0" x2="125.0" y2="230.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="125.0" y1="230.0" x2="155.0" y2="230.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <text x="160.0" y="230.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">▶ MONOLITO</text>
  <line x1="125.0" y1="280.0" x2="125.0" y2="290.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="125.0" y1="290.0" x2="155.0" y2="290.0"
