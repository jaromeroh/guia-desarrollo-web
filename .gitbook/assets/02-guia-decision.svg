  <text x="160.0" y="630.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">▶ TRADICIONAL (o serverless con servicios especializados)</text>
  <line x1="125.0" y1="680.0" x2="125.0" y2="690.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="125.0" y1="690.0" x2="155.0" y2="690.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <text x="160.0" y="690.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">▶ TRADICIONAL</text>
  <line x1="125.0" y1="740.0" x2="125.0" y2="750.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="125.0" y1="750.0" x2="155.0" y2="750.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <text x="160.0" y="750.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">▶ SERVERLESS</text>
  <line x1="125.0" y1="800.0" x2="125.0" y2="810.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="125.0" y1="810.0" x2="155.0" y2="810.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <text x="160.0" y="810.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">▶ TRADICIONAL (puede ser más económico)</text>
  <text x="80" y="150.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿Equipo pequeño (&lt; 10 personas)?</text>
  <text x="80" y="210.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿Un solo producto con dominio cohesivo?</text>
  <text x="80" y="270.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿Múltiples equipos que necesitan autonomía total?</text>
  <text x="80" y="330.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿Partes del sistema con requisitos de escala muy diferentes?</text>
  <text x="80" y="390.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿No estás seguro?</text>
  <text x="390" y="490.0"
        text-anchor="middle" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif" font-weight="bold">DECISIÓN 2: ¿Tradicional o Serverless?</text>
  <text x="80" y="550.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿Tráfico muy variable o impredecible?</text>
  <text x="80" y="610.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿Necesitas WebSockets o conexiones persistentes?</text>
  <text x="80" y="670.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿Procesos de larga duración (&gt; 30 segundos)?</text>
  <text x="80" y="730.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿Quieres mínima operación de infraestructura?</text>
  <text x="80" y="790.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">¿Tráfico constante y predecible?</text>
