  <text x="160.0" y="410.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">▶ MONOLITO (siempre puedes extraer servicios después)</text>
  <line x1="125.0" y1="560.0" x2="125.0" y2="570.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="125.0" y1="570.0" x2="155.0" y2="570.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <text x="160.0" y="570.0"
        text-anchor="start" dominant-baseline="middle"
        fill="#1f2937" font-size="14"
        font-family="system-ui, -apple-system, sans-serif">▶ SERVERLESS (escala a cero, escala al infinito)</text>
  <line x1="125.0" y1="620.0" x2="125.0" y2="630.0"
        stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="125.0" y1="630.0" x2="155.0" y2="630.0"
